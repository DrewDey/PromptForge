name: Community project release boundary

on:
  # This guard is required by main-branch protection. It must run on every PR
  # so a change outside a hand-maintained path list cannot bypass it—or leave
  # another PR waiting for a required check that never starts.
  pull_request:

jobs:
  database-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:community-project-pilot
      - run: npm run check:community-project-alert-recovery
      - run: npm run check:community-project-db
      - run: npm run check:artifact-sandbox
      - run: npm run typecheck
      - run: npm run build
      - name: Verify the rendered community-project boundary
        run: |
          npm start -- --hostname 127.0.0.1 --port 3111 > /tmp/pathforge-community-project.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3111/build > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent --show-error http://127.0.0.1:3111/build > /dev/null; then
            tail -n 200 /tmp/pathforge-community-project.log
            exit 1
          fi
          npm run check:community-project-auth-browser -- --base-url http://127.0.0.1:3111
