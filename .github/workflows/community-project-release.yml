name: Community project release boundary

on:
  pull_request:
    paths:
      - '.github/workflows/community-project-release.yml'
      # This boundary spans routes, data shaping, cards, and shared preview
      # styles. Keep it source-wide instead of relying on a brittle allowlist.
      - 'src/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'scripts/check-community-project*'
      - 'scripts/check-protected-artifact-sandbox.mjs'
      - 'test-fixtures/community-project/**'

jobs:
  database-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:community-project-pilot
      - run: npm run check:community-project-db
      - run: npm run check:artifact-sandbox
      - run: npm run typecheck
      - run: npm run build
      - name: Verify the rendered community-project boundary
        run: |
          npm start -- --hostname 127.0.0.1 --port 3111 > /tmp/pathforge-community-project.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3111/build > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent --show-error http://127.0.0.1:3111/build > /dev/null; then
            tail -n 200 /tmp/pathforge-community-project.log
            exit 1
          fi
          npm run check:community-project-auth-browser -- --base-url http://127.0.0.1:3111
