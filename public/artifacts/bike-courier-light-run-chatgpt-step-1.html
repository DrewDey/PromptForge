<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Block Bike Courier</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #15191f;
    font-family: system-ui, Arial, sans-serif;
    color: white;
    overflow: hidden;
  }
  .wrap {
    width: min(96vw, 720px);
    text-align: center;
  }
  h1 {
    margin: 10px 0 6px;
    font-size: clamp(24px, 5vw, 38px);
  }
  .hud {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }
  .box {
    background: #222936;
    border: 1px solid #3b4659;
    border-radius: 12px;
    padding: 8px;
    font-size: 14px;
  }
  canvas {
    width: 100%;
    aspect-ratio: 1 / 0.72;
    background: #26313f;
    border: 3px solid #55657c;
    border-radius: 18px;
    display: block;
    touch-action: none;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
  }
  button {
    border: 0;
    border-radius: 14px;
    padding: 12px;
    background: #e8edf5;
    color: #111;
    font-weight: 800;
    font-size: 18px;
  }
  .wide {
    grid-column: span 3;
    font-size: 15px;
  }
  .hint {
    margin-top: 8px;
    color: #cbd5e1;
    font-size: 13px;
  }
  @media (max-width: 430px) {
    .hud { grid-template-columns: repeat(2, 1fr); }
    .box { padding: 6px; font-size: 12px; }
    .controls { grid-template-columns: repeat(3, 58px); }
    button { padding: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Block Bike Courier</h1>
  <div class="hud">
    <div class="box">Packages: <span id="pkg">0</span>/5</div>
    <div class="box">Time: <span id="time">60</span></div>
    <div class="box">Score: <span id="score">0</span></div>
    <div class="box">Status: <span id="status">Ready</span></div>
  </div>

  <canvas id="game" width="720" height="520"></canvas>

  <div class="controls">
    <span></span><button data-dir="up">↑</button><span></span>
    <button data-dir="left">←</button><button id="start">Start</button><button data-dir="right">→</button>
    <span></span><button data-dir="down">↓</button><span></span>
    <button class="wide" id="restart">Restart</button>
  </div>

  <div class="hint">Use arrow keys, WASD, or buttons. Stop at red lights. Deliver to glowing doors.</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const pkgEl = document.getElementById("pkg");
const timeEl = document.getElementById("time");
const scoreEl = document.getElementById("score");
const statusEl = document.getElementById("status");

const roads = [
  { x: 0, y: 115, w: 720, h: 70 },
  { x: 0, y: 335, w: 720, h: 70 },
  { x: 145, y: 0, w: 70, h: 520 },
  { x: 505, y: 0, w: 70, h: 520 }
];

const intersections = [
  { x: 145, y: 115, w: 70, h: 70, phase: 0 },
  { x: 505, y: 115, w: 70, h: 70, phase: 1 },
  { x: 145, y: 335, w: 70, h: 70, phase: 1 },
  { x: 505, y: 335, w: 70, h: 70, phase: 0 }
];

const deliveries = [
  { x: 70, y: 75 },
  { x: 635, y: 75 },
  { x: 70, y: 445 },
  { x: 635, y: 445 },
  { x: 350, y: 260 }
];

let bike, keys, started, over, packages, score, timeLeft, lastTime, lightTimer, currentTarget;

function reset() {
  bike = { x: 180, y: 370, r: 12, speed: 190 };
  keys = {};
  started = false;
  over = false;
  packages = 0;
  score = 0;
  timeLeft = 60;
  lastTime = 0;
  lightTimer = 0;
  currentTarget = 0;
  updateHUD("Ready");
  draw();
}

function updateHUD(status) {
  pkgEl.textContent = packages;
  timeEl.textContent = Math.ceil(timeLeft);
  scoreEl.textContent = score;
  statusEl.textContent = status;
}

function isRoad(x, y) {
  return roads.some(r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
}

function redLightPenalty(x, y) {
  for (const i of intersections) {
    const inside = x >= i.x && x <= i.x + i.w && y >= i.y && y <= i.y + i.h;
    if (!inside) continue;
    const horizontalGreen = i.phase === 0;
    const movingHorizontal = Math.abs((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) > 0;
    const movingVertical = Math.abs((keys.down ? 1 : 0) - (keys.up ? 1 : 0)) > 0;
    if ((movingHorizontal && !horizontalGreen) || (movingVertical && horizontalGreen)) return true;
  }
  return false;
}

function tick(ts) {
  if (!started || over) return;
  if (!lastTime) lastTime = ts;
  const dt = Math.min(0.033, (ts - lastTime) / 1000);
  lastTime = ts;

  timeLeft -= dt;
  lightTimer += dt;

  if (lightTimer > 2.4) {
    intersections.forEach(i => i.phase = i.phase ? 0 : 1);
    lightTimer = 0;
  }

  let dx = 0, dy = 0;
  if (keys.left) dx -= 1;
  if (keys.right) dx += 1;
  if (keys.up) dy -= 1;
  if (keys.down) dy += 1;

  if (dx || dy) {
    const mag = Math.hypot(dx, dy);
    dx /= mag;
    dy /= mag;
    const nx = bike.x + dx * bike.speed * dt;
    const ny = bike.y + dy * bike.speed * dt;

    if (isRoad(nx, ny)) {
      bike.x = nx;
      bike.y = ny;
      if (redLightPenalty(nx, ny)) {
        score = Math.max(0, score - 1);
        updateHUD("Red light!");
      } else {
        updateHUD("Riding");
      }
    } else {
      updateHUD("Stay on road");
    }
  }

  const target = deliveries[currentTarget];
  if (target && Math.hypot(bike.x - target.x, bike.y - target.y) < 28) {
    packages++;
    score += 100 + Math.ceil(timeLeft);
    currentTarget++;
    updateHUD("Delivered!");
  }

  if (packages >= deliveries.length) {
    over = true;
    score += Math.ceil(timeLeft) * 5;
    updateHUD("All delivered");
  }

  if (timeLeft <= 0) {
    timeLeft = 0;
    over = true;
    updateHUD("Shift over");
  }

  draw();
  if (!over) requestAnimationFrame(tick);
}

function drawRoads() {
  ctx.fillStyle = "#1d2430";
  roads.forEach(r => ctx.fillRect(r.x, r.y, r.w, r.h));

  ctx.strokeStyle = "#e7d86b";
  ctx.setLineDash([18, 18]);
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.moveTo(0, 150);
  ctx.lineTo(720, 150);
  ctx.moveTo(0, 370);
  ctx.lineTo(720, 370);
  ctx.moveTo(180, 0);
  ctx.lineTo(180, 520);
  ctx.moveTo(540, 0);
  ctx.lineTo(540, 520);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawBlocks() {
  ctx.fillStyle = "#334155";
  const blocks = [
    [20, 20, 100, 70], [245, 25, 220, 70], [600, 20, 90, 70],
    [245, 215, 220, 90], [20, 215, 100, 90], [600, 215, 90, 90],
    [20, 430, 100, 60], [245, 430, 220, 60], [600, 430, 90, 60]
  ];
  blocks.forEach(b => {
    ctx.fillRect(...b);
    ctx.fillStyle = "#475569";
    ctx.fillRect(b[0] + 12, b[1] + 12, b[2] - 24, 14);
    ctx.fillStyle = "#334155";
  });
}

function drawLights() {
  intersections.forEach(i => {
    const horizontalGreen = i.phase === 0;
    ctx.fillStyle = "rgba(255,255,255,.08)";
    ctx.fillRect(i.x, i.y, i.w, i.h);

    ctx.fillStyle = horizontalGreen ? "#22c55e" : "#ef4444";
    ctx.beginPath();
    ctx.arc(i.x + 20, i.y + 15, 8, 0, Math.PI * 2);
    ctx.arc(i.x + 50, i.y + 55, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = horizontalGreen ? "#ef4444" : "#22c55e";
    ctx.beginPath();
    ctx.arc(i.x + 55, i.y + 20, 8, 0, Math.PI * 2);
    ctx.arc(i.x + 15, i.y + 50, 8, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawDeliveries() {
  deliveries.forEach((d, idx) => {
    ctx.fillStyle = idx < currentTarget ? "#64748b" : idx === currentTarget ? "#facc15" : "#94a3b8";
    ctx.beginPath();
    ctx.arc(d.x, d.y, idx === currentTarget ? 18 : 11, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#111827";
    ctx.font = "bold 14px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(idx + 1, d.x, d.y);
  });
}

function drawBike() {
  ctx.save();
  ctx.translate(bike.x, bike.y);
  ctx.fillStyle = "#38bdf8";
  ctx.beginPath();
  ctx.arc(0, 0, bike.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#e0f2fe";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-14, 10);
  ctx.lineTo(14, 10);
  ctx.moveTo(-8, -8);
  ctx.lineTo(8, 8);
  ctx.stroke();

  ctx.restore();
}

function drawOverlay(text, sub) {
  ctx.fillStyle = "rgba(15,23,42,.82)";
  ctx.fillRect(85, 120, 550, 260);
  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.font = "bold 34px system-ui";
  ctx.fillText(text, 360, 195);
  ctx.font = "18px system-ui";
  ctx.fillText(sub, 360, 238);
  ctx.fillText("Avoid red lights. Deliver packages in order.", 360, 270);
  ctx.fillText("Arrow keys, WASD, or touch buttons.", 360, 302);
}

function draw() {
  ctx.clearRect(0, 0, 720, 520);
  drawBlocks();
  drawRoads();
  drawLights();
  drawDeliveries();
  drawBike();

  if (!started) drawOverlay("Ready to ride?", "Press Start to begin");
  if (over) drawOverlay(packages >= 5 ? "Route complete!" : "Shift over", "Final score: " + score);
}

function startGame() {
  if (over) reset();
  started = true;
  lastTime = 0;
  updateHUD("Go!");
  requestAnimationFrame(tick);
}

document.getElementById("start").onclick = startGame;
document.getElementById("restart").onclick = () => { reset(); startGame(); };

document.querySelectorAll("[data-dir]").forEach(btn => {
  const dir = btn.dataset.dir;
  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[dir] = true;
  });
  btn.addEventListener("pointerup", () => keys[dir] = false);
  btn.addEventListener("pointerleave", () => keys[dir] = false);
});

window.addEventListener("keydown", e => {
  const map = {
    ArrowLeft: "left", a: "left", A: "left",
    ArrowRight: "right", d: "right", D: "right",
    ArrowUp: "up", w: "up", W: "up",
    ArrowDown: "down", s: "down", S: "down"
  };
  if (map[e.key]) {
    e.preventDefault();
    keys[map[e.key]] = true;
  }
  if (e.key === "Enter" || e.key === " ") startGame();
});

window.addEventListener("keyup", e => {
  const map = {
    ArrowLeft: "left", a: "left", A: "left",
    ArrowRight: "right", d: "right", D: "right",
    ArrowUp: "up", w: "up", W: "up",
    ArrowDown: "down", s: "down", S: "down"
  };
  if (map[e.key]) keys[map[e.key]] = false;
});

reset();
</script>
</body>
</html>
