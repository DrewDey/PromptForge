<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Answer Evidence Balance Board</title>

<style>

  :root {

    --bg: #0b0f14;

    --panel: #12181f;

    --panel-2: #161d26;

    --border: #2a3340;

    --text: #e8ebef;

    --muted: #8b95a1;

    --accent: #4fd1c5;

    --accent-dim: #38bdb1;

    --warn: #f6ad55;

    --danger: #fc8181;

    --ok: #68d391;

    --card-shadow: 0 4px 16px rgba(0,0,0,0.35);

    --radius: 12px;

    --gap: 12px;

    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  }



  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {

    margin: 0;

    background: var(--bg);

    color: var(--text);

    font-family: var(--font-sans);

    line-height: 1.5;

    font-size: 16px;

    -webkit-font-smoothing: antialiased;

  }



  /* Layout */

  .app {

    display: grid;

    grid-template-rows: auto 1fr auto;

    height: 100vh;

    max-width: 720px;

    margin: 0 auto;

    padding: var(--gap);

    gap: var(--gap);

  }



  header {

    text-align: center;

    padding: 8px 0 4px;

  }

  header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }

  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; }



  /* Paste Area */

  .paste-section {

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    padding: var(--gap);

    display: grid;

    gap: 10px;

  }

  .paste-section label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

  #paste-input {

    width: 100%;

    min-height: 140px;

    background: var(--bg);

    border: 1px solid var(--border);

    border-radius: 8px;

    color: var(--text);

    padding: 12px;

    font-family: var(--font-sans);

    font-size: 0.95rem;

    line-height: 1.6;

    resize: vertical;

    outline: none;

    transition: border-color 0.15s;

  }

  #paste-input:focus { border-color: var(--accent); }

  .paste-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {

    appearance: none;

    border: 1px solid var(--border);

    background: var(--panel-2);

    color: var(--text);

    padding: 10px 16px;

    border-radius: 8px;

    font-size: 0.9rem;

    font-weight: 600;

    cursor: pointer;

    transition: all 0.15s;

    touch-action: manipulation;

  }

  .btn:hover { background: var(--panel); border-color: var(--accent-dim); }

  .btn:active { transform: scale(0.98); }

  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .btn.primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }

  .btn.ghost { background: transparent; }

  .btn.warn { background: var(--warn); border-color: var(--warn); color: #1a1a1a; }

  .btn.danger { background: var(--danger); border-color: var(--danger); color: #1a1a1a; }



  /* Cards Area */

  .cards-section {

    overflow-y: auto;

    display: grid;

    gap: var(--gap);

    padding-bottom: var(--gap);

  }

  .card {

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    padding:12px;

    box-shadow: var(--card-shadow);

    display: grid;

    gap: 10px;

    animation: slideIn 0.2s ease-out;

  }

  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .card-header {

    display: flex;

    align-items: center;

    gap: 10px;

    flex-wrap: wrap;

  }

  .card-type {

    font-size: 0.7rem;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 0.06em;

    padding: 4px 10px;

    border-radius: 90claim rgba(75, 0.150.1);--text0.8)  .card-type.type-evidence { background: rgba(104, 211, 145, 0.15); color: var(--ok); border-color: var(--ok); }

  .card-type.type-helpfulness { background: rgba(79, 209, 197, 0.15); color: var(--accent); border-color: var(--accent); }

  .card-type.type-other { background: rgba(139, 149, 161, 0.15); color: var(--muted); border-color: var(--muted); }

  .card-drag { flex: 1; color: var(--muted); cursor: grab; font-size: 1.1rem; user-select: none; touch-action: none; }

  .card-drag:active { cursor: grabbing; }

  .card-content {

    min-height: 60px;

    outline: none;

    white-space: pre-wrap;

    word-wrap: break-word;

    font-size: 0.95rem;

    line-height: 1.6;

  }

  .card-content:empty::before { content: attr(data-placeholder); color: var(--muted); opacity: 0.6; }

  .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .card-actions .btn { padding: 6px 12px; font-size: 0.75rem; }



  /* Flags Panel */

  .flags-panel {

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    padding: var(--gap);

    display: grid;

    gap: 10px;

  }

  .flags-panel summary {

    cursor: pointer;

    list-style: none;

    display: flex;

    align-items: center;

    gap: 10px;

    font-weight: 600;

    color: var(--text);

  }

  .flags-panel summary::-webkit-details-marker { display: none; }

  .flags-panel summary::before { content: "▸"; font-size: 0.7rem; transition: transform 0.2s; color: var(--muted); }

  .flags-panel[open] summary::before { transform: rotate(90deg); }

  .flags-list { display: grid; gap: 8px; padding-top: 8px; }

  .flag-item {

    display: grid;

    grid-template-columns: auto 1fr auto; gap: 10px; align-items: start;

    padding: 10px;

    background: var(--panel-2);

    border-radius: 8px;

    border-left: 3px solid var(--warn);

    font-size: 0.85rem;

  }

  .flag-item.danger { border-left-color: var(--danger); }

  .flag-item.ok { border-left-color: var(--ok); }

  .flag-icon { font-size: 1.1rem; line-height: 1; }

  .flag-text { color: var(--text); }

  .flag-text .snippet { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.8em; color: var(--accent); }

  .flag-fix { white-space: nowrap; }



  /* Source Checklist */

  .checklist-panel {

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    padding: var(--gap);

    display: grid;

    gap: 10px;

  }

  .checklist-panel summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; font-weight: 600; }

  .checklist-panel summary::-webkit-details-marker { display: none; }

  .checklist-panel summary::before { content: "▸"; font-size: 0.7rem; transition: transform 0.2s; color: var(--muted); }

  .checklist-panel[open] summary::before { transform: rotate(90deg); }

  .checklist-items { display: grid; gap: 6px; padding-top: 8px; }

  .check-item {

    display: flex; align-items: center; gap: 10px;

    padding: 8px 10px;

    background: var(--panel-2);

    border-radius: 8px;

    font-size: 0.85rem;

    transition: background 0.15s;

  }

  .check-item:hover { background: var(--panel); }

  .check-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }

  .check-item label { cursor: pointer; flex: 1; user-select: none; }

  .check-item.done label { text-decoration: line-through; color: var(--muted); }



  /* Export Area */

  .export-section {

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    padding: var(--gap);

    display: grid;

    gap: 10px;

  }

  .export-preview {

    min-height: 100px;

    max-height: 280px;

    overflow-y: auto;

    background: var(--bg);

    border: 1px solid var(--border);

    border-radius: 8px;

    padding: 12px;

    font-family: var(--font-mono);

    font-size: 0.8rem;

    line-height: 1.6;

    white-space: pre-wrap;

    word-wrap: break-word;

    color: var(--text);

  }

  .export-preview.empty { color: var(--muted); text-align: center; padding-top: 40px; }

  .export-actions { display: flex; gap: 8px; flex-wrap: wrap; }



  /* Footer */

  footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 8px 0; }



  /* Empty state */

  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }

  .empty-state svg { width: 64px; height: 64px; margin-bottom: 12px; opacity: 0.4; }



  /* Scrollbar */

  ::-webkit-scrollbar { width: 8px; height: 8px; }

  ::-webkit-scrollbar-track { background: var(--bg); }

  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }



  /* Reduced motion */

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }



  /* Print/export clean */

  @media print { header, .paste-section, .card-actions, .flags-panel summary, .checklist-panel summary, .export-section, footer, .btn { display: none !important; }

  .app { height: auto; max-width: none; padding: 0; }

  .card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; background: white; color: black; }

  .card-type { border-color: currentColor; color: black; background: #f0f0f0; }

  .card-content { color: black; }

  .export-preview { display: none; } }

</style>

</head>

<body>

<div class="app">

  <header>

    <h1>Answer Evidence Balance Board</h1>

    <p>Paste → Split → Audit → Export</p>

  </header>



  <section class="paste-section" aria-label="Paste draft answer">

    <label for="paste-input">Draft Answer</label>

    <textarea id="paste-input" placeholder="Paste your draft answer here…&#10;&#10;Tip: Paragraphs separated by blank lines become individual cards. You can also edit cards directly after splitting."></textarea>

    <div class="paste-actions">

      <button class="btn primary" id="btn-split" type="button">Split into Cards</button>

      <button class="btn ghost" id="btn-clear" type="button">Clear All</button>

      <button class="btn ghost" id="btn-demo" type="button">Load Demo</button>

    </div>

  </section>



  <section class="cards-section" id="cards-section" aria-label="Claim, evidence, and helpfulness cards" role="list">

    <div class="empty-state" id="empty-state" role="status">

      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>

      <p>No cards yet. Paste a draft and click <strong>Split into Cards</strong>.</p>

    </div>

  </section>



  <details class="flags-panel" id="flags-panel" aria-label="Balance flags">

    <summary><span id="flags-count">0</span> Balance Flags</summary>

    <div class="flags-list" id="flags-list" role="list" aria-live="polite"></div>

  </details>



  <details class="checklist-panel" id="checklist-panel" aria-label="Source needed checklist">

    <summary>Source-Needed Checklist</summary>

    <div class="checklist-items" id="checklist-items" role="list"></div>

  </details>



  <section class="export-section" aria-label="Export cleaned answer">

    <div class="export-preview empty" id="export-preview" aria-live="polite" role="textbox" readonly>Export preview appears here after analysis.</div>

    <div class="export-actions">

      <button class="btn primary" id="btn-copy" type="button">Copy Clean Answer</button>

      <button class="btn ghost" id="btn-download" type="button">Download .txt</button>

      <button class="btn ghost" id="btn-download-md" type="button">Download .md</button>

    </div>

  </section>



  <footer>

    <p>Works offline • No tracking • Save as HTML to reuse</p>

  </footer>

</div>



<script>

// ============================================================

// Answer Evidence Balance Board — Single-file logic

// ============================================================



/** @type {Array<{id:string, type:string, content:string, order:number}>} */

let cards = [];

let nextId = 1;

let dragSrc = null;



// --- DOM Refs ---

const pasteInput = document.getElementById('paste-input');

const cardsSection = document.getElementById('cards-section');

const emptyState = document.getElementById('empty-state');

const flagsPanel = document.getElementById('flags-panel');

const flagsCount = document.getElementById('flags-count');

const flagsList = document.getElementById('flags-list');

const checklistItems = document.getElementById('checklist-items');

const exportPreview = document.getElementById('export-preview');



// --- Constants ---

const TYPE_LABELS = {

  claim: 'Claim',

  evidence: 'Evidence',

  helpfulness: 'Helpfulness',

  other: 'Other'

};

const TYPE_COLORS = {

  claim: 'var(--danger)',

  evidence: 'var(--ok)',

  helpfulness: 'var(--accent)',

  other: 'var(--muted)'

};



// --- Heuristic Patterns ---

const SELF_PROMO_PATTERNS = [

  /\b(my|our)\s+(product|tool|service|platform|startup|company|business|app|software|solution|offering)\b/i,

  /\b(check out|try out|take a look at)\s+(my|our)\b/i,

  /\bI\s+(built|created|launched|founded|developed|made)\b/i,

  /\bvisit\s+(my|our)\s+\S+\b/i,

  /\bgithub\.com\/[^/]+\/[^/]+\b/i,

  /\b[A-Za-z0-9-]+\.(com|io|dev|app|ai)\b/,

  /\b(sign up|subscribe|join)\s+(my|our)\b/i,

  /\bnewsletter\b/i,

  /\bdiscord\.gg\/\S+\b/i,

];



const UNSUPPORTED_CLAIM_PATTERNS = [

    // [Insert table/screenshot/benchmark/link] — keep    /^\s*\[(insert|add|include|put)\s+(table|screenshot|benchmark|link|chart|graph|data|figure|image)\]/i,

    /^\s*\[.*?(citation|reference|source|evidence|proof|data)\s*(needed|required|here|missing|todo)\]/i,

    // Citation placeholder like [1], [ref], [citation needed]

    /^\[\s*(\d+|ref|citation|cite|source)\s*\]\s*$/i,

    /^\[\s*citation\s+needed\s*\]\s*$/i,

];



const WEAK_EVIDENCE_PATTERNS = [

  /^(in my experience|personally|i think|i believe|i feel|from what i'?ve seen|anecdotally)\b/i,

  /^(generally|usually|typically|often|many people|most developers|everyone knows)\b/i,

  /^(studies show|research shows|experts say|it is known|it'?s well known)\b/i,

];



const HELPFULNESS_KEYWORDS = [

  'step', 'example', 'code', 'snippet', 'config', 'command', 'install', 'run',

  'usage', 'api', 'parameter', 'option', 'flag', 'workaround', 'fix', 'solution',

  'troubleshoot', 'debug', 'error', 'warning', 'note', 'tip', 'caveat', 'gotcha'

];



const CITATION_PATTERN = /\[(\d+|[a-z]+)\]|\((?:https?:\/\/|doi:|arxiv:)[^)]+\)/gi;

const URL_PATTERN = /https?:\/\/[^\s)]+/gi;

const DOI_PATTERN = /\b10\.\d{4,9}\/[-._;()/:A-Z0-9]+\b/i;

const ISBN_PATTERN = /\b(?:ISBN[- ]?)?(?:97[89][- ]?)?\d{1,5}[- ]?\d{1,7}[- ]?\d{1,6}[- ]?[\dX]\b/i;



// --- Utility ---

const $ = (sel, ctx = document) => ctx.querySelector(sel);

const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];



function uid() { return `card-${nextId++}-${Math.random().toString(36).slice(2,6)}`; }

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function debounce(fn, ms = 150) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }



// --- Classification ---

function classifyText(text) {

  const t = text.trim().toLowerCase();

  if (!t) return 'other';



  // Explicit markers

  if (/^\[?(claim|assertion|statement)\]?/i.test(t)) return 'claim';

  if (/^\[?(evidence|proof|source|citation|reference|data|benchmark|study)\]?/i.test(t)) return 'evidence';

  if (/^\[?(helpful|helpfulness|tip|example|step|workaround|solution|fix|note|caveat)\]?/i.test(t)) return 'helpfulness';



  // Heuristics

  const hasCitation = CITATION_PATTERN.test(text) || URL_PATTERN.test(text) || DOI_PATTERN.test(text) || ISBN_PATTERN.test(text);

  const hasCode = /```|`[^`]+`|^\s{4}\S/m.test(text);

  const hasSteps = /^\s*(\d+\.|[-*])\s/.test(text) || /\b(step \d|first|next|then|finally)\b/i.test(text);

  const isShort = text.split(/\s+/).length < 12;



  if (hasCitation || hasCode) return 'evidence';

  if (hasSteps || HELPFULNESS_KEYWORDS.some(k => new RegExp(`\\b${k}\\b`, 'i').test(text))) return 'helpfulness';

  if (WEAK_EVIDENCE_PATTERNS.some(r => r.test(t))) return 'claim'; // opinions presented as fact

  if (isShort && /^(this|that|it|the|a|an)\b/i.test(t)) return 'claim';



  // Default: claim if declarative, else other

  return /[.!?]$/.test(text.trim()) ? 'claim' : 'other';

}



// --- Detection ---

function detectSelfPromo(text) {

  const hits = [];

  for (const rx of SELF_PROMO_PATTERNS) {

    const m = text.match(rx);

    if (m) hits.push({ pattern: rx.source, match: m[0], index: m.index });

  }

  return hits;

}



function detectUnsupportedClaims(text) {

  const hits = [];

  for (const rx of UNSUPPORTED_CLAIM_PATTERNS) {

    const m = text.match(rx);

    if (m) hits.push({ pattern: rx.source, match: m[0], index: m.index });

  }

  return hits;

}



function detectWeakEvidence(text) {

  const hits = [];

  for (const rx of WEAK_EVIDENCE_PATTERNS) {

    const m = text.match(rx);

    if (m) hits.push({ pattern: rx.source, match: m[0], index: m.index });

  }

  return hits;

}



function hasCitation(text) {

  return CITATION_PATTERN.test(text) || URL_PATTERN.test(text) || DOI_PATTERN.test(text) || ISBN_PATTERN.test(text);

}



function extractSnippet(text, index, radius = 40) {

  if (index === undefined) return text.slice(0, 80);

  const start = Math.max(0, index - radius);

  const end = Math.min(text.length, index + radius);

  let snip = text.slice(start, end);

  if (start > 0) snip = '…' + snip;

  if (end < text.length) snip = snip + '…';

  return snip;

}



// --- Card Rendering ---

function renderCards() {

  cardsSection.innerHTML = '';

  if (cards.length === 0) {

    cardsSection.appendChild(emptyState);

    emptyState.hidden = false;

    return;

  }

  emptyState.hidden = true;



  for (const card of cards) {

    const el = document.createElement('article');

    el.className = 'card';

    el.dataset.id = card.id;

    el.draggable = true;

    el.role = 'listitem';

    el.innerHTML = `

      <div class="card-header">

        <select class="card-type type-${card.type}" aria-label="Card type">${Object.entries(TYPE_LABELS).map(([v, l]) => `<option value="${v}"${v===card.type?' selected':''}>${l}</option>`).join('')}</select>

        <span class="card-drag" aria-label="Drag to reorder" tabindex="0">⋮⋮</span>

        <div class="card-actions">

          <button class="btn ghost" data-action="duplicate" aria-label="Duplicate">⎘</button>

          <button class="btn ghost danger" data-action="delete" aria-label="Delete">✕</button>

        </div>

      </div>

      <div class="card-content" contenteditable="true" data-placeholder="Type or edit…" aria-label="Card content" spellcheck="true">${escapeHtml(card.content)}</div>

    `;

    cardsSection.appendChild(el);



    // Events

    el.querySelector('.card-type').addEventListener('change', e => {

      card.type = e.target.value;

      e.target.className = `card-type type-${card.type}`;

      debouncedAnalyze();

    });

    el.querySelector('.card-content').addEventListener('input', debounce(() => {

      card.content = el.querySelector('.card-content').textContent;

      debouncedAnalyze();

    }, 200));

    el.querySelector('[data-action="duplicate"]').addEventListener('click', () => {

      const idx = cards.indexOf(card);

      cards.splice(idx + 1, 0, { id: uid(), type: card.type, content: card.content, order: Date.now() });

      renumber();

      renderCards();

      debouncedAnalyze();

    });

    el.querySelector('[data-action="delete"]').addEventListener('click', () => {

      cards = cards.filter(c => c.id !== card.id);

      renumber();

      renderCards();

      debouncedAnalyze();

    });



    // Drag & drop

    el.addEventListener('dragstart', e => {

      dragSrc = el;

      e.dataTransfer.effectAllowed = 'move';

      el.classList.add('dragging');

    });

    el.addEventListener('dragend', () => {

      el.classList.remove('dragging');

      dragSrc = null;

    });

    el.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });

    el.addEventListener('drop', e => {

      e.preventDefault();

      if (dragSrc && dragSrc !== el) {

        const from = cards.findIndex(c => c.id === dragSrc.dataset.id);

        const to = cards.findIndex(c => c.id === el.dataset.id);

        const [moved] = cards.splice(from, 1);

        cards.splice(to, 0, moved);

        renumber();

        renderCards();

        debouncedAnalyze();

      }

    });



    // Keyboard reorder (Enter/Space on drag handle)

    const dragHandle = el.querySelector('.card-drag');

    dragHandle.addEventListener('keydown', e => {

      if (e.key === 'Enter' || e.key === ' ') {

        e.preventDefault();

        const idx = cards.findIndex(c => c.id === card.id);

        if (e.shiftKey && idx > 0) { [cards[idx], cards[idx-1]] = [cards[idx-1], cards[idx]]; }

        else if (!e.shiftKey && idx < cards.length - 1) { [cards[idx], cards[idx+1]] = [cards[idx+1], cards[idx]]; }

        else return;

        renumber();

        renderCards();

        debouncedAnalyze();

      }

    });

  }

}



function renumber() { cards.forEach((c, i) => c.order = i); }



// --- Analysis ---

function analyze() {

  const allText = cards.map(c => c.content).join('\n\n');

  const flags = [];

  const checklistSet = new Set();



  for (const card of cards) {

    const text = card.content;



    // Self-promo (any type)

    for (const hit of detectSelfPromo(text)) {

      flags.push({

        severity: 'warn',

        type: 'self-promo',

        message: 'Possible self-promotion detected',

        snippet: extractSnippet(text, hit.index),

        cardId: card.id,

        fix: 'Remove or disclose affiliation'

      });

    }



    if (card.type === 'claim') {

      // Unsupported claim markers

      for (const hit of detectUnsupportedClaims(text)) {

        flags.push({

          severity: 'warn',

          type: 'placeholder',

          message: 'Placeholder citation/marker found',

          snippet: extractSnippet(text, hit.index),

          cardId: card.id,

          fix: 'Replace with real citation'

        });

      }

      // Weak evidence language

      for (const hit of detectWeakEvidence(text)) {

        flags.push({

          severity: 'warn',

          type: 'weak-evidence',

          message: 'Claim uses weak/hedging language',

          snippet: extractSnippet(text, hit.index),

          cardId: card.id,

          fix: 'Add concrete evidence or cite source'

        });

      }

      // No citation at all

      if (!hasCitation(text) && text.trim().length > 30) {

        flags.push({

          severity: 'danger',

          type: 'uncited-claim',

          message: 'Claim appears uncited',

          snippet: extractSnippet(text),

          cardId: card.id,

          fix: 'Add citation, link, or evidence card'

        });

        checklistSet.add(`Add source for: "${extractSnippet(text, 0, 60)}"`);

      }

    }



    if (card.type === 'evidence') {

      if (!hasCitation(text) && !/```|`[^`]+`|^\s{4}\S/m.test(text)) {

        flags.push({

          severity: 'warn',

          type: 'thin-evidence',

          message: 'Evidence card lacks citation/code/data',

          snippet: extractSnippet(text),

          cardId: card.id,

          fix: 'Add link, DOI, ISBN, or code block'

        });

      }

    }

  }



  // Balance checks

  const claimCount = cards.filter(c => c.type === 'claim').length;

  const evidenceCount = cards.filter(c => c.type === 'evidence').length;

  const helpfulCount = cards.filter(c => c.type === 'helpfulness').length;



  if (claimCount > 0 && evidenceCount === 0) {

    flags.unshift({

      severity: 'danger',

      type: 'balance',

      message: `${claimCount} claim(s) but 0 evidence cards — answer lacks support`,

      snippet: '',

      cardId: null,

      fix: 'Add evidence cards with citations, data, or code'

    });

  } else if (claimCount > evidenceCount * 2) {

    flags.unshift({

      severity: 'warn',

      type: 'balance',

      message: `High claim-to-evidence ratio (${claimCount}:${evidenceCount})`,

      snippet: '',

      cardId: null,

      fix: 'Add more evidence or reduce speculative claims'

    });

  }



  if (helpfulCount === 0 && claimCount > 0) {

    checklistSet.add('Consider adding a helpfulness card (example, step, caveat, or workaround)');

  }



  // Render flags

  flagsCount.textContent = flags.length;

  flagsList.innerHTML = '';

  for (const f of flags) {

    const item = document.createElement('div');

    item.className = `flag-item ${f.severity === 'danger' ? 'danger' : ''}`;

    item.role = 'listitem';

    const icon = f.severity === 'danger' ? '✖' : '⚠';

    item.innerHTML = `

      <span class="flag-icon" aria-hidden="true">${icon}</span>

      <div class="flag-text"><strong>${f.message}</strong>${f.snippet ? `<br><span class="snippet">${escapeHtml(f.snippet)}</span>` : ''}</div>

      ${f.fix ? `<button class="btn ghost flag-fix" data-fix="${escapeHtml(f.fix)}" aria-label="Copy fix suggestion">${f.fix}</button>` : ''}

    `;

    if (f.cardId) {

      item.style.borderLeftColor = f.severity === 'danger' ? 'var(--danger)' : 'var(--warn)';

      item.querySelector('.flag-icon').textContent = f.type === 'self-promo' ? '📢' : (f.severity === 'danger' ? '✖' : '⚠');

    }

    flagsList.appendChild(item);

  }

  // Fix buttons

  $$('.flag-fix', flagsList).forEach(btn => {

    btn.addEventListener('click', () => navigator.clipboard.writeText(btn.dataset.fix).then(() => {

      const orig = btn.textContent;

      btn.textContent = 'Copied!';

      setTimeout(() => btn.textContent = orig, 1200);

    }));

  });



  // Render checklist

  checklistItems.innerHTML = '';

  const sortedChecks = [...checklistSet].sort();

  if (sortedChecks.length === 0) {

    checklistItems.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;padding:8px;">✓ No outstanding source needs detected</div>';

  } else {

    for (const text of sortedChecks) {

      const item = document.createElement('div');

      item.className = 'check-item';

      item.role = 'listitem';

      item.innerHTML = `<input type="checkbox" id="chk-${uid()}"><label for="chk-${uid()}">${escapeHtml(text)}</label>`;

      item.querySelector('input').addEventListener('change', e => {

        item.classList.toggle('done', e.target.checked);

      });

      checklistItems.appendChild(item);

    }

  }



  // Build export preview

  buildExportPreview();

}



function buildExportPreview() {

  const claimCards = cards.filter(c => c.type === 'claim');

  const evidenceCards = cards.filter(c => c.type === 'evidence');

  const helpfulCards = cards.filter(c => c.type === 'helpfulness');

  const otherCards = cards.filter(c => c.type === 'other');



  let out = '';

  if (claimCards.length) {

    out += '## Answer\n\n';

    for (const c of claimCards) out += `${c.content.trim()}\n\n`;

  }

  if (evidenceCards.length) {

    out += '## Sources & Evidence\n\n';

    for (const c of evidenceCards) out += `- ${c.content.trim()}\n`;

    out += '\n';

  }

  if (helpfulCards.length) {

    out += '## Practical Guidance\n\n';

    for (const c of helpfulCards) out += `- ${c.content.trim()}\n`;

    out += '\n';

  }

  if (otherCards.length) {

    out += '## Notes\n\n';

    for (const c of otherCards) out += `- ${c.content.trim()}\n`;

  }



  exportPreview.textContent = out.trim() || 'Export preview appears here after analysis.';

  exportPreview.classList.toggle('empty', !out.trim());

}



// --- Split Logic ---

function splitIntoCards() {

  const raw = pasteInput.value.trim();

  if (!raw) return;



  // Split by double newline, fallback to single newline if few paragraphs

  let parts = raw.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);

  if (parts.length <= 1) {

    parts = raw.split(/\n+/).map(s => s.trim()).filter(Boolean);

  }



  cards = parts.map((content, i) => ({

    id: uid(),

    type: classifyText(content),

    content,

    order: i

  }));

  renderCards();

  analyze();

  pasteInput.value = '';

}



// --- Export ---

function copyExport() {

  const text = exportPreview.textContent;

  if (text && !exportPreview.classList.contains('empty')) {

    navigator.clipboard.writeText(text).then(() => {

      const btn = document.getElementById('btn-copy');

      const orig = btn.textContent;

      btn.textContent = 'Copied!';

      setTimeout(() => btn.textContent = orig, 1200);

    });

  }

}



function downloadExport(ext) {

  const text = exportPreview.textContent;

  if (!text || exportPreview.classList.contains('empty')) return;

  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });

  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');

  a.href = url;

  a.download = `answer-brief.${ext}`;

  a.click();

  URL.revokeObjectURL(url);

}

  const demo = `Our new framework "Velox" outperforms React by 3x in benchmarks.

// --- Event Bindings ---

document.getElementById('btn-split').addEventListener('click', splitIntoCards);

document.getElementById('btn-clear').addEventListener('click', () => {

  cards = [];

  nextId = 1;

  pasteInput.value = '';

  renderCards();

  analyze();

});

document.getElementById('btn-demo').addEventListener('click', loadDemo);

document.getElementById('btn-copy').addEventListener('click', copyExport);

document.getElementById('btn-download').addEventListener('click', () => downloadExport('txt'));

document.getElementById('btn-download-md').addEventListener('click', () => downloadExport('md'));



// Paste handler: auto-split on paste if empty

pasteInput.addEventListener('paste', e => {

  if (cards.length === 0) {

    setTimeout(splitIntoCards, 0);

  }

});



// Debounced analyze

const debouncedAnalyze = debounce(analyze, 200);



// Init

renderCards();

analyze();



// Keyboard shortcut: Ctrl/Cmd+Enter to split

document.addEventListener('keydown', e => {

  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {

    e.preventDefault();

    splitIntoCards();

  }

});
