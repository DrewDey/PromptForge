<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookout Batch Card Sorter</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --accent-color: #ff6b6b;
            --grill-color: #ff4757;
            --side-color: #ffa502;
            --drink-color: #2ed573;
            --dessert-color: #1e90ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            padding-bottom: 80px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .form-container {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .form-row input, .form-row select, .form-row textarea {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
        }

        .form-row select {
            height: 48px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .lanes-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .lane {
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 15px;
        }

        .lane-header {
            font-size: 1.2rem;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lane-grill { border-color: var(--grill-color); }
        .lane-grill .lane-header { color: var(--grill-color); border-bottom-color: var(--grill-color); }
        
        .lane-side { border-color: var(--side-color); }
        .lane-side .lane-header { color: var(--side-color); border-bottom-color: var(--side-color); }
        
        .lane-drink { border-color: var(--drink-color); }
        .lane-drink .lane-header { color: var(--drink-color); border-bottom-color: var(--drink-color); }
        
        .lane-dessert { border-color: var(--dessert-color); }
        .lane-dessert .lane-header { color: var(--dessert-color); border-bottom-color: var(--dessert-color); }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 50px;
        }

        .card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
        }

        .card-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            word-break: break-word;
        }

        .card-notes {
            font-size: 0.9rem;
            border-top: 1px dashed var(--border-color);
            padding-top: 6px;
            margin-top: 6px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8rem;
            width: auto;
            background-color: #333;
        }

        .btn-delete {
            background-color: #cf6679;
        }

        .action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 12px;
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--accent-color);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <h1>Cookout Batch Card Sorter</h1>
    <div id="toast" class="toast">Checklist copied!</div>

    <div class="form-container">
        <div class="form-row">
            <input type="text" id="dishName" placeholder="Dish Name (e.g., Smash Burgers)" required>
        </div>
        <div class="form-row">
            <input type="text" id="batchSize" placeholder="Batch Size (e.g., 20 patties)">
            <input type="text" id="prepWindow" placeholder="Prep Window (e.g., 2:00 PM - 2:30 PM)">
        </div>
        <div class="form-row">
            <select id="laneSelect">
                <option value="grill">Grill Lane</option>
                <option value="side">Side Lane</option>
                <option value="drink">Drink Lane</option>
                <option value="dessert">Dessert Lane</option>
            </select>
        </div>
        <div class="form-row">
            <textarea id="servingNotes" placeholder="Serving notes / captions..." rows="2"></textarea>
        </div>
        <button id="addCardBtn">Add Dish Card</button>
    </div>

    <div class="lanes-container">
        <div class="lane lane-grill" id="lane-grill">
            <div class="lane-header"><span>Grill</span><span class="count" id="count-grill">0</span></div>
            <div class="card-list" id="list-grill"></div>
        </div>

        <div class="lane lane-side" id="lane-side">
            <div class="lane-header"><span>Sides</span><span class="count" id="count-side">0</span></div>
            <div class="card-list" id="list-side"></div>
        </div>

        <div class="lane lane-drink" id="lane-drink">
            <div class="lane-header"><span>Drinks</span><span class="count" id="count-drink">0</span></div>
            <div class="card-list" id="list-drink"></div>
        </div>

        <div class="lane lane-dessert" id="lane-dessert">
            <div class="lane-header"><span>Desserts</span><span class="count" id="count-dessert">0</span></div>
            <div class="card-list" id="list-dessert"></div>
        </div>
    </div>

    <div class="action-bar">
        <button id="copyChecklistBtn">Copy Prep & Caption Checklist</button>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('cookout_items')) || [];

        function saveData() {
            localStorage.setItem('cookout_items', JSON.stringify(items));
            renderCards();
        }

        function addCard() {
            const nameInput = document.getElementById('dishName');
            const batchInput = document.getElementById('batchSize');
            const prepInput = document.getElementById('prepWindow');
            const laneSelect = document.getElementById('laneSelect');
            const notesInput = document.getElementById('servingNotes');

            const name = nameInput.value.trim();
            const batch = batchInput.value.trim();
            const prep = prepInput.value.trim();
            const lane = laneSelect.value;
            const notes = notesInput.value.trim();

            if (!name) return;

            const newItem = {
                id: Date.now().toString(),
                name,
                batch,
                prep,
                lane,
                notes
            };

            items.push(newItem);
            saveData();

            nameInput.value = '';
            batchInput.value = '';
            prepInput.value = '';
            notesInput.value = '';
        }

        function deleteCard(id) {
            items = items.filter(item => item.id !== id);
            saveData();
        }

        function moveCard(id, direction) {
            const laneOrder = ['grill', 'side', 'drink', 'dessert'];
            const item = items.find(i => i.id === id);
            if (!item) return;

            let currentIndex = laneOrder.indexOf(item.lane);
            if (direction === 'next' && currentIndex < laneOrder.length - 1) {
                item.lane = laneOrder[currentIndex + 1];
            } else if (direction === 'prev' && currentIndex > 0) {
                item.lane = laneOrder[currentIndex - 1];
            }
            saveData();
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        function copyChecklist() {
            if (items.length === 0) return;

            const laneTitles = { grill: 'GRILL', side: 'SIDES', drink: 'DRINKS', dessert: 'DESSERTS' };
            let text = `🔥 COOKOUT PREP & CAPTION CHECKLIST 🔥\n\n`;

            ['grill', 'side', 'drink', 'dessert'].forEach(lane => {
                const laneItems = items.filter(item => item.lane === lane);
                if (laneItems.length > 0) {
                    text += `--- ${laneTitles[lane]} ---\n`;
                    laneItems.forEach(item => {
                        text += `[ ] ${item.name}`;
                        if (item.batch) text += ` (Batch: ${item.batch})`;
                        if (item.prep) text += ` [Window: ${item.prep}]`;
                        text += `\n`;
                        if (item.notes) text += `    📝 Notes: ${item.notes}\n`;
                    });
                    text += `\n`;
                }
            });

            navigator.clipboard.writeText(text.trim()).then(showToast);
        }

        function renderCards() {
            const lists = {
                grill: document.getElementById('list-grill'),
                side: document.getElementById('list-side'),
                drink: document.getElementById('list-drink'),
                dessert: document.getElementById('list-dessert')
            };

            const counts = { grill: 0, side: 0, drink: 0, dessert: 0 };

            Object.values(lists).forEach(list => list.innerHTML = '');

            items.forEach(item => {
                counts[item.lane]++;
                
                const card = document.createElement('div');
                card.className = 'card';
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'card-title';
                titleDiv.textContent = item.name;
                card.appendChild(titleDiv);
                
                let metaText = [];
                if (item.batch) metaText.push(`Batch: ${item.batch}`);
                if (item.prep) metaText.push(`Prep: ${item.prep}`);
                
                if (metaText.length > 0) {
                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'card-meta';
                    metaDiv.textContent = metaText.join(' | ');
                    card.appendChild(metaDiv);
                }

                if (item.notes) {
                    const notesDiv = document.createElement('div');
                    notesDiv.className = 'card-notes';
                    notesDiv.textContent = item.notes;
                    card.appendChild(notesDiv);
                }

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'card-actions';

                const leftBtn = document.createElement('button');
                leftBtn.className = 'btn-small';
                leftBtn.textContent = '←';
                leftBtn.addEventListener('click', () => moveCard(item.id, 'prev'));
                
                const rightBtn = document.createElement('button');
                rightBtn.className = 'btn-small';
                rightBtn.textContent = '→';
                rightBtn.addEventListener('click', () => moveCard(item.id, 'next'));

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-small btn-delete';
                deleteBtn.textContent = 'Delete';
                deleteBtn.addEventListener('click', () => deleteCard(item.id));

                actionsDiv.appendChild(leftBtn);
                actionsDiv.appendChild(rightBtn);
                actionsDiv.appendChild(deleteBtn);
                card.appendChild(actionsDiv);
                
                if (lists[item.lane]) {
                    lists[item.lane].appendChild(card);
                }
            });

            Object.keys(counts).forEach(lane => {
                document.getElementById(`count-${lane}`).textContent = counts[lane];
            });
        }

        // Event Listeners for main static interface controls
        document.getElementById('addCardBtn').addEventListener('click', addCard);
        document.getElementById('copyChecklistBtn').addEventListener('click', copyChecklist);

        // Initial render
        renderCards();
    </script>
</body>
</html>
