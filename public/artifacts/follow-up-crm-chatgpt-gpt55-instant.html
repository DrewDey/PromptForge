<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Follow-Up CRM Tracker</title><style>  :root{    --bg:#0f1220; --panel:#171b2e; --panel2:#202642; --text:#f5f7ff;    --muted:#a8afc7; --line:#303855; --accent:#7c9cff; --danger:#ff6b7a;    --warn:#ffd166; --good:#4ade80; --shadow:0 20px 50px rgba(0,0,0,.35);  }  *{box-sizing:border-box}  body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#0f1220,#12172b 45%,#0d1020);color:var(--text)}  .wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}  header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px}  h1{margin:0;font-size:clamp(28px,4vw,46px);letter-spacing:-.04em}  .sub{color:var(--muted);margin-top:8px}  .panel{background:rgba(23,27,46,.9);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;padding:18px}  button,input,select,textarea{font:inherit}  button{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#071022;font-weight:800;cursor:pointer}  button:hover{filter:brightness(1.08)}  button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}  button.danger{background:transparent;color:var(--danger);border:1px solid rgba(255,107,122,.5)}  button.quick{padding:8px 10px;font-size:12px;background:#10162a;color:var(--text);border:1px solid var(--line)}  button.quick.done{border-color:rgba(74,222,128,.55);color:#9af5b7}  button.quick.snooze{border-color:rgba(124,156,255,.55);color:#b9c7ff}  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}  label{display:block;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}  input,select,textarea{width:100%;background:#0f1325;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px}  textarea{min-height:86px;resize:vertical}  .form{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}  .span2{grid-column:span 2}.span4{grid-column:span 4}  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}  .toolbar{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:12px;margin:18px 0}  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}  .stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}  .stat b{font-size:28px}.stat div{color:var(--muted);font-size:13px}  .buckets{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}  .bucket h2{margin:0 0 12px;font-size:18px}  .card{background:#11162a;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}  .top{display:flex;justify-content:space-between;gap:12px}  .name{font-weight:900;font-size:17px}  .pill{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;margin-top:8px;white-space:nowrap}  .overdue{background:rgba(255,107,122,.15);color:#ff98a3}  .today{background:rgba(255,209,102,.16);color:#ffe08d}  .upcoming{background:rgba(74,222,128,.14);color:#8df2ad}  .meta,.note{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.4}  .last{color:#c6cbea;font-size:12px;margin-top:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);display:inline-block;padding:6px 8px;border-radius:999px}  .quickBtns,.cardBtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}  .cardBtns{padding-top:10px;border-top:1px solid rgba(255,255,255,.07)}  .empty{color:var(--muted);border:1px dashed var(--line);border-radius:16px;padding:18px;text-align:center}  @media(max-width:850px){    header,.toolbar{display:block}    .form,.grid,.stats,.buckets{grid-template-columns:1fr}    .span2,.span4{grid-column:auto}    .toolbar>*{margin-bottom:10px}    .top{display:block}    .pill{margin-top:10px}  }</style></head><body><div class="wrap">  <header>    <div>      <h1>Follow-Up CRM</h1>      <div class="sub">Tiny pipeline tracker for freelancers and solo operators. Everything stays in this browser.</div>    </div>    <div class="actions">      <button class="secondary" onclick="exportCSV()">Export CSV</button>      <button class="danger" onclick="clearAll()">Clear All</button>    </div>  </header>  <section class="panel">    <form id="crmForm" class="form">      <input type="hidden" id="id">      <div><label>Name</label><input id="name" required placeholder="Jane Client"></div>      <div><label>Company</label><input id="company" placeholder="Acme Co."></div>      <div><label>Email</label><input id="email" type="email" placeholder="jane@email.com"></div>      <div><label>Value</label><input id="value" type="number" min="0" placeholder="2500"></div>      <div><label>Status</label><select id="status"><option>Lead</option><option>Contacted</option><option>Proposal Sent</option><option>Won</option><option>Lost</option></select></div>      <div><label>Next Follow-Up</label><input id="followDate" type="date" required></div>      <div class="span2"><label>Opportunity</label><input id="opportunity" placeholder="Website redesign, monthly retainer, consulting call..."></div>      <div class="span4"><label>Notes</label><textarea id="notes" placeholder="Last conversation, objections, next action..."></textarea></div>      <div class="span4 actions">        <button type="submit" id="saveBtn">Save Contact</button>        <button type="button" class="secondary" onclick="resetForm()">Cancel Edit</button>      </div>    </form>    <div class="toolbar">      <input id="search" placeholder="Search name, company, opportunity, notes..." oninput="render()">      <select id="statusFilter" onchange="render()">        <option value="">All statuses</option><option>Lead</option><option>Contacted</option><option>Proposal Sent</option><option>Won</option><option>Lost</option>      </select>      <select id="sortBy" onchange="render()">        <option value="date">Sort by follow-up date</option>        <option value="value">Sort by value</option>        <option value="name">Sort by name</option>        <option value="lastContacted">Sort by last contacted</option>      </select>      <button class="secondary" onclick="seedDemo()">Add Demo Data</button>    </div>    <div class="stats" id="stats"></div>    <div class="buckets">      <div class="bucket"><h2>Overdue</h2><div id="overdue"></div></div>      <div class="bucket"><h2>Today</h2><div id="today"></div></div>      <div class="bucket"><h2>Upcoming</h2><div id="upcoming"></div></div>    </div>  </section></div><script>const KEY = "solo_followup_crm_v2";const OLD_KEY = "solo_followup_crm_v1";let contacts = JSON.parse(localStorage.getItem(KEY) || "null");if (!contacts) {  contacts = JSON.parse(localStorage.getItem(OLD_KEY) || "[]").map(c => ({    ...c,    lastContacted: c.lastContacted || ""  }));  localStorage.setItem(KEY, JSON.stringify(contacts));}const $ = id => document.getElementById(id);const todayISO = () => new Date().toISOString().slice(0,10);function addDaysISO(days){  const d = new Date();  d.setDate(d.getDate() + days);  return d.toISOString().slice(0,10);}function humanDateTime(iso){  if (!iso) return "Never contacted";  const d = new Date(iso);  return d.toLocaleString([], {    month:"short",    day:"numeric",    year:"numeric",    hour:"numeric",    minute:"2-digit"  });}$("followDate").value = todayISO();function save(){  localStorage.setItem(KEY, JSON.stringify(contacts));  render();}$("crmForm").addEventListener("submit", e => {  e.preventDefault();  const existing = contacts.find(c => c.id === $("id").value);  const item = {    id: $("id").value || crypto.randomUUID(),    name: $("name").value.trim(),    company: $("company").value.trim(),    email: $("email").value.trim(),    value: Number($("value").value || 0),    status: $("status").value,    followDate: $("followDate").value,    opportunity: $("opportunity").value.trim(),    notes: $("notes").value.trim(),    lastContacted: existing?.lastContacted || "",    updated: new Date().toISOString()  };  const i = contacts.findIndex(c => c.id === item.id);  if(i >= 0) contacts[i] = item; else contacts.push(item);  resetForm();  save();});function resetForm(){  $("crmForm").reset();  $("id").value = "";  $("followDate").value = todayISO();  $("saveBtn").textContent = "Save Contact";}function editContact(id){  const c = contacts.find(x => x.id === id);  Object.keys(c).forEach(k => $(k) && ($(k).value = c[k]));  $("saveBtn").textContent = "Update Contact";  scrollTo({top:0, behavior:"smooth"});}function deleteContact(id){  if(confirm("Delete this contact?")){    contacts = contacts.filter(c => c.id !== id);    save();  }}function markFollowedUp(id){  const c = contacts.find(x => x.id === id);  if (!c) return;  c.lastContacted = new Date().toISOString();  c.status = c.status === "Lead" ? "Contacted" : c.status;  c.updated = new Date().toISOString();  save();}function reschedule(id, days){  const c = contacts.find(x => x.id === id);  if (!c) return;  c.followDate = addDaysISO(days);  c.updated = new Date().toISOString();  save();}function markAndReschedule(id, days){  const c = contacts.find(x => x.id === id);  if (!c) return;  c.lastContacted = new Date().toISOString();  c.followDate = addDaysISO(days);  c.status = c.status === "Lead" ? "Contacted" : c.status;  c.updated = new Date().toISOString();  save();}function bucketOf(date){  const t = todayISO();  if(date < t) return "overdue";  if(date === t) return "today";  return "upcoming";}function filtered(){  const q = $("search").value.toLowerCase();  const sf = $("statusFilter").value;  let list = contacts.filter(c =>    (!sf || c.status === sf) &&    [c.name,c.company,c.email,c.opportunity,c.notes].join(" ").toLowerCase().includes(q)  );  const sort = $("sortBy").value;  list.sort((a,b) => {    if (sort === "value") return b.value - a.value;    if (sort === "name") return a.name.localeCompare(b.name);    if (sort === "lastContacted") return (b.lastContacted || "").localeCompare(a.lastContacted || "");    return a.followDate.localeCompare(b.followDate);  });  return list;}function render(){  const list = filtered();  const buckets = {overdue:[], today:[], upcoming:[]};  list.forEach(c => buckets[bucketOf(c.followDate)].push(c));  const contactedCount = contacts.filter(c => c.lastContacted).length;  $("stats").innerHTML = `    <div class="stat"><b>${contacts.length}</b><div>Total contacts</div></div>    <div class="stat"><b>${buckets.overdue.length}</b><div>Overdue</div></div>    <div class="stat"><b>${buckets.today.length}</b><div>Due today</div></div>    <div class="stat"><b>${contactedCount}</b><div>Contacted before</div></div>  `;  ["overdue","today","upcoming"].forEach(type => {    $(type).innerHTML = buckets[type].length ? buckets[type].map(card).join("") : `<div class="empty">No ${type} follow-ups.</div>`;  });}function card(c){  const cls = bucketOf(c.followDate);  return `    <div class="card">      <div class="top">        <div>          <div class="name">${esc(c.name)}</div>          <div class="meta">${esc(c.company || "No company")} · ${esc(c.status)} · $${Number(c.value).toLocaleString()}</div>        </div>        <span class="pill ${cls}">${c.followDate}</span>      </div>      <div class="meta">${esc(c.opportunity || "No opportunity listed")}</div>      <div class="note">${esc(c.notes || "No notes yet.")}</div>      <div class="last">Last contacted ${esc(humanDateTime(c.lastContacted))}</div>      <div class="meta">${c.email ? `<a style="color:var(--accent)" href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : "No email"}</div>      <div class="quickBtns">        <button class="quick done" onclick="markFollowedUp('${c.id}')">Followed up today</button>        <button class="quick snooze" onclick="reschedule('${c.id}', 1)">+1 day</button>        <button class="quick snooze" onclick="reschedule('${c.id}', 7)">+7 days</button>        <button class="quick done" onclick="markAndReschedule('${c.id}', 7)">Done, +7</button>      </div>      <div class="cardBtns">        <button class="secondary" onclick="editContact('${c.id}')">Edit</button>        <button class="danger" onclick="deleteContact('${c.id}')">Delete</button>      </div>    </div>  `;}function esc(s){  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}function exportCSV(){  const headers = ["Name","Company","Email","Value","Status","Next Follow-Up","Last Contacted","Opportunity","Notes","Updated"];  const rows = contacts.map(c => [    c.name,    c.company,    c.email,    c.value,    c.status,    c.followDate,    c.lastContacted ? humanDateTime(c.lastContacted) : "",    c.opportunity,    c.notes,    c.updated  ]);  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v ?? "").replaceAll('"','""')}"`).join(",")).join("\n");  const blob = new Blob([csv], {type:"text/csv"});  const a = document.createElement("a");  a.href = URL.createObjectURL(blob);  a.download = "follow-up-crm.csv";  a.click();  URL.revokeObjectURL(a.href);}function clearAll(){  if(confirm("Clear every saved contact from this browser?")){    contacts = [];    save();  }}function seedDemo(){  const d = new Date();  const iso = offset => new Date(d.getFullYear(), d.getMonth(), d.getDate()+offset).toISOString().slice(0,10);  const now = new Date();  const lastWeek = new Date();  lastWeek.setDate(now.getDate() - 7);  const yesterday = new Date();  yesterday.setDate(now.getDate() - 1);  contacts.push(    {      id:crypto.randomUUID(),      name:"Maya Patel",      company:"Northline Studio",      email:"maya@example.com",      value:3200,      status:"Proposal Sent",      followDate:iso(-2),      opportunity:"Brand refresh package",      notes:"Asked for revised timeline and payment split.",      lastContacted:lastWeek.toISOString(),      updated:new Date().toISOString()    },    {      id:crypto.randomUUID(),      name:"Chris Morgan",      company:"Morgan HVAC",      email:"chris@example.com",      value:900,      status:"Contacted",      followDate:iso(0),      opportunity:"Landing page tune-up",      notes:"Call went well. Send examples before noon.",      lastContacted:yesterday.toISOString(),      updated:new Date().toISOString()    },    {      id:crypto.randomUUID(),      name:"Lena Brooks",      company:"Brooks Legal",      email:"lena@example.com",      value:1800,      status:"Lead",      followDate:iso(5),      opportunity:"Monthly content retainer",      notes:"Warm intro. Follow up with simple scope.",      lastContacted:"",      updated:new Date().toISOString()    }  );  save();}render();</script></body></html>
