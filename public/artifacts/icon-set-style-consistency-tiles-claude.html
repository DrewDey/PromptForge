<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Icon Studio</title>
<style>
/* ── TOKENS ──────────────────────────────────────────────────────────────── */
:root {
  --bg:       #0F0F11;
  --surf:     #18181C;
  --surf2:    #222228;
  --border:   #2E2E38;
  --text:     #E8E8F0;
  --muted:    #72728A;
  --accent:   #14B8A6;
  --warn:     #F59E0B;
  --danger:   #EF4444;
  --tile-bg:  #F4F4EF;
  --mono: 'Courier New', Courier, monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

/* Hard viewport clamp — nothing may widen the page */
html { overflow-x: hidden; }
body {
  overflow-x: hidden;
  max-width: 100vw;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  min-height: 100dvh;
  padding-bottom: 88px;
}

/* ── HEADER ─────────────────────────────────────────────────────────────── */
.site-header {
  position: sticky; top: 0; z-index: 100;
  width: 100%;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 8px;
  /* prevent the sticky element itself from overflowing */
  overflow: hidden;
}
.site-header h1 {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}
.h1-accent { color: var(--accent); }

/* ── DNA PANEL ───────────────────────────────────────────────────────────── */
.dna-panel {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  /* must not escape the header's padded width */
  width: 100%;
  overflow: hidden;
}
.dna-panel summary {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent);
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.dna-panel summary::-webkit-details-marker { display: none; }
.dna-panel summary::after { content: '▾'; transition: transform .2s; }
.dna-panel[open] summary::after { transform: rotate(180deg); }
.dna-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
  /* grid children must not overflow their column track */
  min-width: 0;
}
/* Every direct child of dna-grid needs min-width:0 or it can blow out */
.dna-grid > * { min-width: 0; }
.dna-grid label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  display: block;
  margin-bottom: 3px;
}
.dna-grid input,
.dna-grid select,
.dna-grid textarea {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 8px;
  outline: none;
}
.dna-grid input:focus,
.dna-grid select:focus,
.dna-grid textarea:focus { border-color: var(--accent); }
.dna-full { grid-column: 1 / -1; }
.dna-notes { resize: none; min-height: 44px; font-family: var(--sans); }

/* swatches */
.swatch-row {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  min-width: 0;
  overflow: hidden;
}
.swatch-row > label { width: 100%; margin-bottom: 0; }
.swatch-wrap { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.swatch-wrap input[type=color] {
  width: 28px; height: 28px;
  padding: 2px;
  border-radius: 5px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surf2);
  flex-shrink: 0;
}
/* Use ch units so the hex field scales with font rather than a fixed px width */
.swatch-wrap input[type=text] { width: 7ch; min-width: 0; font-size: 11px; }
.btn-sm {
  background: none;
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 7px;
  line-height: 1.4;
  flex-shrink: 0;
}
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm.rm:hover { border-color: var(--danger); color: var(--danger); }

/* ── MAIN ────────────────────────────────────────────────────────────────── */
.main { padding: 12px 16px; overflow: hidden; }
.section-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  overflow: hidden;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); min-width: 0; }

/* ── TILE GRID ───────────────────────────────────────────────────────────── */
.tile-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
@media (min-width: 500px)  { .tile-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 700px)  { .tile-grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 960px)  { .tile-grid { grid-template-columns: repeat(5, 1fr); } }

/* ── TILE CARD ───────────────────────────────────────────────────────────── */
.tile-card {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: border-color .15s;
}
.tile-card.state-warn    { border-color: var(--warn);   }
.tile-card.state-bad     { border-color: var(--danger); }
.tile-card.state-flagged { border-color: var(--danger); }

/* preview area */
.tile-preview {
  background: var(--tile-bg);
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* ── CSS ICON ATOMS ─────────────────────────────────────────────────────── */
.icon { position: relative; display: flex; align-items: center; justify-content: center; }

/* Home */
.icon-home {
  width: 44px; height: 44px;
}
.icon-home::before {
  content: '';
  position: absolute;
  top: 4px; left: 2px; right: 2px;
  border-left: 22px solid transparent;
  border-right: 22px solid transparent;
  border-bottom: 20px solid #1E40AF;
}
.icon-home::after {
  content: '';
  position: absolute;
  bottom: 0; left: 8px; right: 8px;
  height: 24px;
  background: #1E40AF;
  border-radius: 2px 2px 0 0;
}
.icon-home .door {
  position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 10px; height: 14px;
  background: var(--tile-bg);
  border-radius: 1px;
}

/* Settings (gear-ish) */
.icon-settings {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: #1E40AF;
  position: relative;
}
.icon-settings::after {
  content: '';
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  background: var(--tile-bg);
}

/* Search */
.icon-search {
  width: 36px; height: 36px;
  border: 4px solid #1E40AF;
  border-radius: 50%;
  position: relative;
}
.icon-search::after {
  content: '';
  position: absolute;
  bottom: -12px; right: -10px;
  width: 4px; height: 14px;
  background: #1E40AF;
  border-radius: 2px;
  transform: rotate(-45deg);
  transform-origin: top center;
}

/* Bell / Notifications */
.icon-bell {
  width: 38px; height: 38px;
  position: relative;
}
.icon-bell::before {
  content: '';
  position: absolute;
  top: 4px; left: 4px; right: 4px;
  height: 28px;
  background: #1E40AF;
  border-radius: 12px 12px 0 0;
}
.icon-bell::after {
  content: '';
  position: absolute;
  bottom: 2px; left: 50%; transform: translateX(-50%);
  width: 12px; height: 6px;
  background: #1E40AF;
  border-radius: 0 0 8px 8px;
}
.icon-bell .clapper {
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 6px; height: 8px;
  background: #1E40AF;
  border-radius: 3px;
  z-index: 1;
}

/* User / Profile */
.icon-user {
  width: 40px; height: 40px;
  position: relative;
}
.icon-user::before {
  content: '';
  position: absolute;
  top: 2px; left: 50%; transform: translateX(-50%);
  width: 18px; height: 18px;
  background: #1E40AF;
  border-radius: 50%;
}
.icon-user::after {
  content: '';
  position: absolute;
  bottom: 0; left: 2px; right: 2px;
  height: 18px;
  background: #1E40AF;
  border-radius: 12px 12px 0 0;
}

/* Bookmark */
.icon-bookmark {
  width: 30px; height: 44px;
  background: #1E40AF;
  position: relative;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%);
}

/* Chart / Analytics */
.icon-chart {
  width: 44px; height: 36px;
  display: flex;
  align-items: flex-end;
  gap: 5px;
  padding-bottom: 2px;
}
.icon-chart .bar {
  flex: 1;
  background: #1E40AF;
  border-radius: 2px 2px 0 0;
}
.icon-chart .bar:nth-child(1) { height: 40%; }
.icon-chart .bar:nth-child(2) { height: 70%; }
.icon-chart .bar:nth-child(3) { height: 55%; }
.icon-chart .bar:nth-child(4) { height: 90%; }

/* Mail / Envelope */
.icon-mail {
  width: 44px; height: 32px;
  background: #1E40AF;
  border-radius: 4px;
  position: relative;
}
.icon-mail::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  border-left: 22px solid transparent;
  border-right: 22px solid transparent;
  border-top: 16px solid #3B60C4;
}

/* Calendar */
.icon-calendar {
  width: 40px; height: 40px;
  background: #1E40AF;
  border-radius: 6px;
  position: relative;
  overflow: hidden;
}
.icon-calendar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 13px;
  background: #1732A0;
}
.icon-calendar::after {
  content: '';
  position: absolute;
  bottom: 6px; left: 6px; right: 6px;
  height: 16px;
  display: grid;
  background:
    repeating-linear-gradient(
      to right,
      var(--tile-bg) 0 6px,
      transparent 6px 10px
    ),
    repeating-linear-gradient(
      to bottom,
      var(--tile-bg) 0 6px,
      transparent 6px 10px
    );
}

/* Lock */
.icon-lock {
  width: 36px; height: 42px;
  position: relative;
}
.icon-lock::before {
  content: '';
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 22px; height: 20px;
  border: 5px solid #1E40AF;
  border-bottom: none;
  border-radius: 11px 11px 0 0;
}
.icon-lock::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 24px;
  background: #1E40AF;
  border-radius: 4px;
}
.icon-lock .keyhole {
  position: absolute;
  bottom: 6px; left: 50%; transform: translateX(-50%);
  width: 10px; height: 12px;
  background: var(--tile-bg);
  border-radius: 5px 5px 2px 2px;
  z-index: 1;
}

/* drift bar */
.tile-drift-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  display: flex;
}
.drift-seg { flex: 1; transition: background .25s; }
.drift-seg.ok   { background: var(--accent); }
.drift-seg.warn { background: var(--warn);   }
.drift-seg.bad  { background: var(--danger); }
.drift-seg.idle { background: var(--border); }

/* ── CARD BODY ───────────────────────────────────────────────────────────── */
.tile-body { padding: 8px 10px 4px; min-width: 0; overflow: hidden; }
.tile-name {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  background: none;
  border: none;
  color: var(--text);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  outline: none;
  padding: 0;
  margin-bottom: 6px;
  /* prevent the bare input from overflowing the card */
  display: block;
}
.tile-name::placeholder { color: var(--muted); }

.axis-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; min-width: 0; }
.axis-lbl {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  width: 40px;
  flex-shrink: 0;
}
.axis-sel {
  flex: 1;
  min-width: 0;
  max-width: 100%;
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-size: 11px;
  font-family: var(--mono);
  padding: 3px 5px;
  outline: none;
}
.axis-sel:focus { border-color: var(--accent); }

.tile-obs {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-family: var(--sans);
  font-size: 11px;
  padding: 5px 7px;
  resize: none;
  outline: none;
  margin-top: 4px;
  min-height: 42px;
  display: block;
}
.tile-obs:focus { border-color: var(--accent); }

/* ── CARD FOOTER ─────────────────────────────────────────────────────────── */
.tile-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 10px 8px;
  border-top: 1px solid var(--border);
  margin-top: 5px;
  min-width: 0;
  overflow: hidden;
  gap: 4px;
}
.drift-badge {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 4px;
  /* truncate if badge text is very long */
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
  flex-shrink: 1;
}
.drift-badge.ok      { background: rgba(20,184,166,.15); color: var(--accent); }
.drift-badge.warn    { background: rgba(245,158,11,.15);  color: var(--warn);   }
.drift-badge.bad     { background: rgba(239,68,68,.15);   color: var(--danger); }
.drift-badge.flagged { background: rgba(239,68,68,.22);   color: var(--danger); }

.tile-actions { display: flex; gap: 4px; flex-shrink: 0; }
.btn-icon {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 5px;
  border-radius: 4px;
  line-height: 1;
  flex-shrink: 0;
}
.btn-icon:hover  { color: var(--text); }
.btn-flag.active { color: var(--danger); }

/* ── ADD TILE ────────────────────────────────────────────────────────────── */
.btn-add-tile {
  grid-column: 1 / -1;
  background: none;
  border: 1px dashed var(--border);
  border-radius: 10px;
  color: var(--muted);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .08em;
  padding: 14px;
  text-align: center;
  text-transform: uppercase;
  width: 100%;
  transition: border-color .15s, color .15s;
}
.btn-add-tile:hover { border-color: var(--accent); color: var(--accent); }

/* ── BOTTOM BAR ──────────────────────────────────────────────────────────── */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(15,15,17,.93);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding: 10px 16px max(10px, env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 200;
  /* never exceed viewport */
  width: 100%;
  overflow: hidden;
  box-sizing: border-box;
}
.summary-line {
  flex: 1;
  min-width: 0;          /* allow it to shrink below content width */
  overflow: hidden;
}
.summary-line span {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .05em;
  color: var(--muted);
}
.summary-line .s-total { color: var(--text); font-weight: 700; }
.summary-line .s-bad   { color: var(--danger); }
.summary-line .s-warn  { color: var(--warn);   }

.btn-copy {
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #000;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  padding: 10px 14px;
  text-transform: uppercase;
  transition: opacity .15s;
  white-space: nowrap;
  flex-shrink: 0;   /* never allow this button to be squashed */
}
.btn-copy:hover  { opacity: .85; }
.btn-copy:active { opacity: .7; }

/* ── TOAST ───────────────────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 76px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--surf2);
  border: 1px solid var(--accent);
  border-radius: 8px;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .06em;
  padding: 8px 16px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s, transform .2s;
  z-index: 300;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ── HEADER ────────────────────────────────────────────────────────────── -->
<header class="site-header">
  <h1>⬡ Icon <span class="h1-accent">Consistency</span> Studio</h1>
  <details class="dna-panel" open id="dnaDetails">
    <summary>Family DNA</summary>
    <div class="dna-grid">

      <div>
        <label for="dna-shape">Shape language</label>
        <select id="dna-shape">
          <option>Rounded corners</option>
          <option>Sharp / geometric</option>
          <option>Organic / freeform</option>
          <option>Mixed</option>
        </select>
      </div>

      <div>
        <label for="dna-radius">Corner radius</label>
        <input type="text" id="dna-radius" placeholder="e.g. 4 px" value="8 px">
      </div>

      <div>
        <label for="dna-stroke">Stroke weight</label>
        <input type="text" id="dna-stroke" placeholder="e.g. 2 px" value="2 px">
      </div>

      <div>
        <label for="dna-fill">Fill style</label>
        <select id="dna-fill">
          <option>Outline / line</option>
          <option>Filled / solid</option>
          <option>Duotone</option>
          <option>Gradient</option>
          <option>Mixed</option>
        </select>
      </div>

      <div>
        <label for="dna-detail">Detail level</label>
        <select id="dna-detail">
          <option>Minimal (1–2 elements)</option>
          <option>Medium (3–5 elements)</option>
          <option>Rich (6+ elements)</option>
        </select>
      </div>

      <div>
        <label for="dna-size">Optical size target</label>
        <input type="text" id="dna-size" placeholder="e.g. 24 px" value="24 px">
      </div>

      <div class="swatch-row">
        <label>Brand palette</label>
        <div id="swatchList"></div>
        <button class="btn-sm" id="btnAddSwatch">＋</button>
      </div>

      <div class="dna-full">
        <label for="dna-notes">Constraints</label>
        <textarea id="dna-notes" class="dna-notes" rows="2"
          placeholder="e.g. No gradients below 16 px. Must work at 50% opacity for disabled state…"></textarea>
      </div>

    </div>
  </details>
</header>

<!-- ── MAIN ──────────────────────────────────────────────────────────────── -->
<main class="main">
  <div class="section-label">Concepts</div>
  <div class="tile-grid" id="tileGrid"></div>
</main>

<!-- ── BOTTOM BAR ────────────────────────────────────────────────────────── -->
<div class="bottom-bar">
  <div class="summary-line" id="summaryLine"></div>
  <button class="btn-copy" id="btnCopy">⎘ Copy note</button>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ── CONSTANTS ─────────────────────────────────────────────────────────── */
const STORAGE_KEY = 'icon-studio-v3';

const AXIS_OPTS = ['Matches', 'Minor drift', 'Major drift'];
const DRIFT_CLASS = ['ok', 'warn', 'bad'];

// Ten starter icons: name + a function that builds the CSS icon DOM
const STARTERS = [
  { name: 'Home',          iconFn: buildIconHome       },
  { name: 'Settings',      iconFn: buildIconSettings   },
  { name: 'Search',        iconFn: buildIconSearch     },
  { name: 'Notifications', iconFn: buildIconBell       },
  { name: 'Profile',       iconFn: buildIconUser       },
  { name: 'Bookmark',      iconFn: buildIconBookmark   },
  { name: 'Analytics',     iconFn: buildIconChart      },
  { name: 'Mail',          iconFn: buildIconMail       },
  { name: 'Calendar',      iconFn: buildIconCalendar   },
  { name: 'Lock',          iconFn: buildIconLock       },
];

/* ── CSS ICON BUILDERS ──────────────────────────────────────────────────── */
function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

function buildIconHome() {
  const w = el('div', 'icon icon-home');
  w.appendChild(el('div', 'door'));
  return w;
}
function buildIconSettings() {
  return el('div', 'icon icon-settings');
}
function buildIconSearch() {
  return el('div', 'icon icon-search');
}
function buildIconBell() {
  const w = el('div', 'icon icon-bell');
  w.appendChild(el('div', 'clapper'));
  return w;
}
function buildIconUser() {
  return el('div', 'icon icon-user');
}
function buildIconBookmark() {
  return el('div', 'icon icon-bookmark');
}
function buildIconChart() {
  const w = el('div', 'icon icon-chart');
  for (let i = 0; i < 4; i++) w.appendChild(el('div', 'bar'));
  return w;
}
function buildIconMail() {
  return el('div', 'icon icon-mail');
}
function buildIconCalendar() {
  return el('div', 'icon icon-calendar');
}
function buildIconLock() {
  const w = el('div', 'icon icon-lock');
  w.appendChild(el('div', 'keyhole'));
  return w;
}

/* ── STATE ──────────────────────────────────────────────────────────────── */
let tiles    = [];   // array of tile data objects
let swatches = [];   // array of hex strings
let nextId   = 1;

/* ── PERSISTENCE ────────────────────────────────────────────────────────── */
function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      dna:      readDNA(),
      swatches: swatches,
      tiles:    tiles.map(function(t) {
        return { id: t.id, name: t.name, shape: t.shape,
                 color: t.color, detail: t.detail,
                 note: t.note, flagged: t.flagged };
      })
    }));
  } catch (_) {}
}

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}

/* ── DNA ────────────────────────────────────────────────────────────────── */
function readDNA() {
  return {
    shape:  document.getElementById('dna-shape').value,
    radius: document.getElementById('dna-radius').value,
    stroke: document.getElementById('dna-stroke').value,
    fill:   document.getElementById('dna-fill').value,
    detail: document.getElementById('dna-detail').value,
    size:   document.getElementById('dna-size').value,
    notes:  document.getElementById('dna-notes').value,
  };
}

function applyDNA(dna) {
  if (!dna) return;
  ['shape','radius','stroke','fill','detail','size','notes'].forEach(function(k) {
    const el = document.getElementById('dna-' + k);
    if (el && dna[k] !== undefined) el.value = dna[k];
  });
}

// Wire DNA inputs to persist
['dna-shape','dna-radius','dna-stroke','dna-fill','dna-detail','dna-size','dna-notes']
  .forEach(function(id) {
    const node = document.getElementById(id);
    if (node) node.addEventListener('input', persist);
  });

/* ── SWATCHES ───────────────────────────────────────────────────────────── */
document.getElementById('btnAddSwatch').addEventListener('click', function() {
  swatches.push('#1E40AF');
  renderSwatches();
  persist();
});

function renderSwatches() {
  const list = document.getElementById('swatchList');
  // Remove all existing swatch wrappers
  while (list.firstChild) list.removeChild(list.firstChild);

  swatches.forEach(function(hex, i) {
    const wrap = el('div', 'swatch-wrap');

    const picker = document.createElement('input');
    picker.type  = 'color';
    picker.value = hex;
    picker.addEventListener('input', function() {
      hexField.value = picker.value;
      swatches[i]    = picker.value;
      persist();
    });

    const hexField = document.createElement('input');
    hexField.type      = 'text';
    hexField.value     = hex;
    hexField.maxLength = 9;
    hexField.className = 'axis-sel';
    hexField.style.width = '72px';
    hexField.addEventListener('input', function() {
      if (/^#[0-9A-Fa-f]{6}$/.test(hexField.value)) {
        picker.value = hexField.value;
        swatches[i]  = hexField.value;
        persist();
      }
    });

    const rmBtn = el('button', 'btn-sm rm');
    rmBtn.textContent = '×';
    rmBtn.addEventListener('click', function() {
      swatches.splice(i, 1);
      renderSwatches();
      persist();
    });

    wrap.appendChild(picker);
    wrap.appendChild(hexField);
    wrap.appendChild(rmBtn);
    list.appendChild(wrap);
  });
}

/* ── TILE DATA ──────────────────────────────────────────────────────────── */
function makeTileData(overrides) {
  const d = overrides || {};
  return {
    id:      d.id      !== undefined ? d.id      : nextId++,
    name:    d.name    !== undefined ? d.name    : '',
    shape:   d.shape   !== undefined ? d.shape   : 0,
    color:   d.color   !== undefined ? d.color   : 0,
    detail:  d.detail  !== undefined ? d.detail  : 0,
    note:    d.note    !== undefined ? d.note    : '',
    flagged: d.flagged !== undefined ? d.flagged : false,
    iconIdx: d.iconIdx !== undefined ? d.iconIdx : 0,
  };
}

function driftClass(t) {
  if (t.flagged) return 'flagged';
  return DRIFT_CLASS[Math.max(t.shape, t.color, t.detail)];
}

function badgeText(t) {
  if (t.flagged)         return 'Flagged';
  const w = Math.max(t.shape, t.color, t.detail);
  return w === 0 ? 'On-spec' : w === 1 ? 'Drift' : 'Major drift';
}

/* ── CARD BUILD ─────────────────────────────────────────────────────────── */
function buildCard(t) {
  const dc   = driftClass(t);
  const card = el('div', 'tile-card state-' + dc);
  card.dataset.tid = t.id;

  /* preview */
  const preview = el('div', 'tile-preview');

  // look up icon builder from starters or use first as fallback
  const starter = STARTERS[t.iconIdx] || STARTERS[0];
  preview.appendChild(starter.iconFn());

  const driftBar = el('div', 'tile-drift-bar');
  ['shape','color','detail'].forEach(function(axis) {
    const seg = el('div', 'drift-seg ' + DRIFT_CLASS[t[axis]]);
    seg.dataset.axis = axis;
    driftBar.appendChild(seg);
  });
  preview.appendChild(driftBar);
  card.appendChild(preview);

  /* body */
  const body = el('div', 'tile-body');

  const nameInput = document.createElement('input');
  nameInput.type        = 'text';
  nameInput.className   = 'tile-name';
  nameInput.placeholder = 'Icon name…';
  nameInput.value       = t.name;
  nameInput.addEventListener('input', function() {
    t.name = nameInput.value;
    persist();
    refreshSummary();
  });
  body.appendChild(nameInput);

  /* three axis rows */
  [
    { key: 'shape',  label: 'Shape'  },
    { key: 'color',  label: 'Color'  },
    { key: 'detail', label: 'Detail' },
  ].forEach(function(axis) {
    const row = el('div', 'axis-row');
    const lbl = el('span', 'axis-lbl');
    lbl.textContent = axis.label;
    row.appendChild(lbl);

    const sel = el('select', 'axis-sel');
    AXIS_OPTS.forEach(function(optText, i) {
      const opt   = document.createElement('option');
      opt.value   = i;
      opt.textContent = optText;
      if (i === t[axis.key]) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', function() {
      t[axis.key] = parseInt(sel.value, 10);
      syncCard(card, t);
      persist();
      refreshSummary();
    });
    row.appendChild(sel);
    body.appendChild(row);
  });

  /* observation textarea */
  const obs = el('textarea', 'tile-obs');
  obs.rows        = 2;
  obs.placeholder = 'Observation…';
  obs.textContent = t.note;
  obs.addEventListener('input', function() {
    t.note = obs.value;
    persist();
  });
  body.appendChild(obs);

  card.appendChild(body);

  /* footer */
  const footer = el('div', 'tile-footer');

  const badge = el('span', 'drift-badge ' + dc);
  badge.textContent = badgeText(t);
  footer.appendChild(badge);

  const actions = el('div', 'tile-actions');

  const flagBtn = el('button', 'btn-icon btn-flag' + (t.flagged ? ' active' : ''));
  flagBtn.title       = 'Flag / unflag';
  flagBtn.textContent = '⚑';
  flagBtn.addEventListener('click', function() {
    t.flagged = !t.flagged;
    syncCard(card, t);
    persist();
    refreshSummary();
  });
  actions.appendChild(flagBtn);

  const delBtn = el('button', 'btn-icon');
  delBtn.title       = 'Remove';
  delBtn.textContent = '✕';
  delBtn.addEventListener('click', function() {
    tiles = tiles.filter(function(x) { return x.id !== t.id; });
    card.parentNode.removeChild(card);
    persist();
    refreshSummary();
  });
  actions.appendChild(delBtn);

  footer.appendChild(actions);
  card.appendChild(footer);

  return card;
}

/* update an existing card's visual state without rebuilding it */
function syncCard(card, t) {
  const dc = driftClass(t);

  // border state
  card.className = 'tile-card state-' + dc;

  // drift bar segments
  card.querySelectorAll('.drift-seg').forEach(function(seg) {
    seg.className = 'drift-seg ' + DRIFT_CLASS[t[seg.dataset.axis]];
  });

  // badge
  const badge = card.querySelector('.drift-badge');
  badge.className   = 'drift-badge ' + dc;
  badge.textContent = badgeText(t);

  // flag button
  const flagBtn = card.querySelector('.btn-flag');
  if (t.flagged) {
    flagBtn.classList.add('active');
  } else {
    flagBtn.classList.remove('active');
  }
}

/* ── TILE GRID RENDER ───────────────────────────────────────────────────── */
function renderGrid() {
  const grid = document.getElementById('tileGrid');

  // Clear only tile cards, keep the add button if it exists
  grid.querySelectorAll('.tile-card').forEach(function(c) {
    grid.removeChild(c);
  });

  let addBtn = grid.querySelector('.btn-add-tile');
  if (!addBtn) {
    addBtn = el('button', 'btn-add-tile');
    addBtn.textContent = '＋ Add concept';
    addBtn.addEventListener('click', function() {
      const idx  = tiles.length % STARTERS.length;
      const t    = makeTileData({ iconIdx: idx });
      tiles.push(t);
      const card = buildCard(t);
      grid.insertBefore(card, addBtn);
      persist();
      refreshSummary();
    });
    grid.appendChild(addBtn);
  }

  tiles.forEach(function(t) {
    grid.insertBefore(buildCard(t), addBtn);
  });

  refreshSummary();
}

/* ── SUMMARY BAR ────────────────────────────────────────────────────────── */
function refreshSummary() {
  const total   = tiles.length;
  const flagged = tiles.filter(function(t) { return t.flagged; }).length;
  const bad     = tiles.filter(function(t) {
    return !t.flagged && driftClass(t) === 'bad';
  }).length;
  const warn    = tiles.filter(function(t) {
    return !t.flagged && driftClass(t) === 'warn';
  }).length;
  const ok      = total - flagged - bad - warn;

  const line = document.getElementById('summaryLine');
  while (line.firstChild) line.removeChild(line.firstChild);

  function seg(text, cls) {
    const s = el('span', cls || '');
    s.textContent = text;
    return s;
  }
  line.appendChild(seg(String(total), 's-total'));
  line.appendChild(seg(' tiles · '));
  line.appendChild(seg(String(flagged + bad) + ' ⚑', 's-bad'));
  line.appendChild(seg(' drift · '));
  line.appendChild(seg(String(warn) + ' ~', 's-warn'));
  line.appendChild(seg(' warn · '));
  line.appendChild(seg(String(ok) + ' ✓ ok'));
}

/* ── COPY ART DIRECTION ─────────────────────────────────────────────────── */
document.getElementById('btnCopy').addEventListener('click', function() {
  const note = buildNote();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(note).then(function() { toast('Art direction copied ✓'); });
  } else {
    const ta = document.createElement('textarea');
    ta.value = note;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Copied ✓');
  }
});

function buildNote() {
  const dna  = readDNA();
  const rows = [];
  rows.push('ICON FAMILY ART DIRECTION');
  rows.push('════════════════════════════════════════');
  rows.push('');
  rows.push('SPEC');
  rows.push('  Shape: ' + dna.shape + '  ·  Corner radius: ' + dna.radius);
  rows.push('  Stroke: ' + dna.stroke + '  ·  Fill: ' + dna.fill);
  rows.push('  Detail: ' + dna.detail + '  ·  Target size: ' + dna.size);
  if (swatches.length) {
    rows.push('  Palette: ' + swatches.join('  '));
  }
  if (dna.notes.trim()) {
    rows.push('');
    rows.push('CONSTRAINTS');
    dna.notes.split('\n').forEach(function(l) {
      if (l.trim()) rows.push('  ' + l.trim());
    });
  }
  const drifted = tiles.filter(function(t) {
    return t.flagged || driftClass(t) !== 'ok';
  });
  if (drifted.length) {
    rows.push('');
    rows.push('DRIFT FLAGS');
    drifted.forEach(function(t) {
      const axes = [];
      if (t.shape  > 0) axes.push('shape('  + AXIS_OPTS[t.shape]  + ')');
      if (t.color  > 0) axes.push('color('  + AXIS_OPTS[t.color]  + ')');
      if (t.detail > 0) axes.push('detail(' + AXIS_OPTS[t.detail] + ')');
      const label = (t.name || 'Tile ' + t.id) + (t.flagged ? ' ⚑' : '');
      rows.push('  ' + label + ': ' + (axes.join(', ') || 'manually flagged'));
      if (t.note.trim()) rows.push('    → ' + t.note.trim());
    });
  }
  const good = tiles.filter(function(t) {
    return !t.flagged && driftClass(t) === 'ok';
  });
  if (good.length) {
    rows.push('');
    rows.push('ON-SPEC');
    rows.push('  ' + good.map(function(t) { return t.name || 'Tile ' + t.id; }).join('  ·  '));
  }
  rows.push('');
  rows.push('Generated ' + new Date().toLocaleString());
  return rows.join('\n');
}

/* ── TOAST ──────────────────────────────────────────────────────────────── */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2200);
}

/* ── INIT ───────────────────────────────────────────────────────────────── */
(function init() {
  const saved = loadSaved();
  if (saved && saved.tiles && saved.tiles.length) {
    applyDNA(saved.dna);
    swatches = saved.swatches || ['#1E40AF','#FFFFFF','#F1F5F9'];
    renderSwatches();
    saved.tiles.forEach(function(td, i) {
      if (td.id >= nextId) nextId = td.id + 1;
      // attach icon index: use position mod starters if not stored
      td.iconIdx = (td.iconIdx !== undefined) ? td.iconIdx : (i % STARTERS.length);
      tiles.push(makeTileData(td));
    });
  } else {
    swatches = ['#1E40AF','#FFFFFF','#F1F5F9'];
    renderSwatches();
    STARTERS.forEach(function(s, i) {
      tiles.push(makeTileData({ name: s.name, iconIdx: i }));
    });
  }
  renderGrid();
  persist();
}());
</script>
