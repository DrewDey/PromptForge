<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Sprint Planner &amp; Cluster Tool</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --warn: #f59e0b;
            --info: #3b82f6;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        header {
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
        }

        p.subtitle {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            height: 140px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
        }

        textarea:focus, select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button.secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        button.secondary:hover {
            background: var(--border);
        }

        .hidden {
            display: none !important;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        /* Distribution Summary */
        .dist-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 8px;
            margin-bottom: 16px;
        }

        .dist-stat {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
        }

        .dist-val {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .dist-lbl {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
        }

        /* Editable Table Rows */
        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
            min-width: 500px;
        }

        th, td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        select, input[type="text"] {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            width: 100%;
        }

        /* Alerts & Cards */
        .alert {
            background: rgba(245, 158, 11, 0.1);
            border-left: 4px solid var(--warn);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .alert-title {
            font-weight: 600;
            color: var(--warn);
            margin-bottom: 2px;
        }

        .cluster-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cluster-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
        }

        .cluster-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .cluster-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-info { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
        .badge-trans { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
        .badge-invest { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; }
        .badge-mixed { background: rgba(245, 158, 11, 0.2); color: #fde047; }

        .kw-list {
            list-style: none;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .kw-item {
            padding: 4px 0;
            border-bottom: 1px dashed rgba(51, 65, 85, 0.4);
            white-space: pre-wrap;
        }

        .kw-item:last-child {
            border-bottom: none;
        }

        .brief-output {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            overflow-x: auto;
            max-height: 400px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SEO Sprint Planner &amp; Cluster Tool</h1>
        <p class="subtitle">Secure, local-first workflow workspace</p>
    </header>

    <div class="container">
        <div class="card">
            <label for="kwInput">Keywords (One Per Line)</label>
            <textarea id="kwInput" placeholder="how to build a chicken coop&#10;chicken coop plans diy&#10;buy pre-built chicken coop&#10;best wood for chicken coop&#10;chicken coop nesting boxes setup"></textarea>
            <div class="actions">
                <button id="btnRun">Parse &amp; Plan</button>
                <button id="btnSample" class="secondary">Load Sample</button>
            </div>
        </div>

        <div id="outputContainer" class="card hidden">
            
            <div class="section-title">Intent Distribution</div>
            <div id="distSummary" class="dist-summary"></div>

            <div class="section-title">Sprint Planner Matrix</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 40%;">Keyword</th>
                            <th>Intent</th>
                            <th>Stage</th>
                            <th>Difficulty</th>
                        </tr>
                    </thead>
                    <tbody id="plannerTableBody"></tbody>
                </table>
            </div>
            <div class="actions" style="margin-bottom: 24px; grid-template-columns: 1fr;">
                <button id="btnRefresh" style="background-color: var(--panel); color: var(--accent); border: 1px solid var(--border);">Update Engine Analytics</button>
            </div>

            <div class="section-title">Gaps &amp; Warnings</div>
            <div id="gapAlerts"></div>

            <div class="section-title" style="margin-top: 16px;">Intent Clusters</div>
            <div id="clusterContainer" class="cluster-grid"></div>

            <div class="section-title" style="margin-top: 20px;">Sprint Content Brief</div>
            <div class="actions" style="margin-bottom: 12px; grid-template-columns: 1fr 1fr;">
                <button id="btnCopy" class="secondary">Copy Brief</button>
                <button id="btnDownload" class="secondary">Download</button>
            </div>
            <pre id="briefBlock" class="brief-output"></pre>
        </div>
    </div>

    <script>
        const stopWords = new Set(['for', 'the', 'and', 'with', 'best', 'buy', 'how', 'to', 'what', 'is', 'a', 'in', 'on', 'of', 'near', 'me', 'online', 'top', 'vs', 'cheap', 'guide', 'review', 'reviews']);

        const intentRules = {
            informational: ['how', 'what', 'why', 'guide', 'tips', 'tutorial', 'ideas', 'diy', 'example', 'learn'],
            transactional: ['buy', 'price', 'cheap', 'cost', 'shop', 'sale', 'purchase', 'order', 'store'],
            investigational: ['best', 'vs', 'review', 'top', 'compare', 'alternative', 'rated']
        };

        const sampleData = [
            "how to build a chicken coop",
            "chicken coop plans diy",
            "buy pre-built chicken coop",
            "best wood for chicken coop",
            "chicken coop nesting boxes setup",
            "affordable chicken coops for sale",
            "chicken coop size calculator"
        ];

        let keywordsState = [];
        let generatedBriefText = "";

        const btnRun = document.getElementById('btnRun');
        const btnSample = document.getElementById('btnSample');
        const btnRefresh = document.getElementById('btnRefresh');
        const btnCopy = document.getElementById('btnCopy');
        const btnDownload = document.getElementById('btnDownload');
        const kwInput = document.getElementById('kwInput');
        const outputContainer = document.getElementById('outputContainer');
        const distSummary = document.getElementById('distSummary');
        const plannerTableBody = document.getElementById('plannerTableBody');
        const gapAlerts = document.getElementById('gapAlerts');
        const clusterContainer = document.getElementById('clusterContainer');
        const briefBlock = document.getElementById('briefBlock');

        btnRun.addEventListener('click', parseInitialKeywords);
        btnSample.addEventListener('click', loadSampleData);
        btnRefresh.addEventListener('click', triggerRecalculation);
        btnCopy.addEventListener('click', copyBrief);
        btnDownload.addEventListener('click', downloadBrief);

        function loadSampleData() {
            kwInput.value = sampleData.join('\n');
            parseInitialKeywords();
        }

        function parseInitialKeywords() {
            const rawInput = kwInput.value;
            const lines = rawInput.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);

            if (lines.length === 0) return;

            keywordsState = lines.map(line => {
                const intent = guessIntentString(line);
                let stage = "TOFU";
                if (intent === "Transactional") stage = "BOFU";
                if (intent === "Investigational") stage = "MOFU";

                return {
                    phrase: line,
                    intent: intent,
                    stage: stage,
                    difficulty: "Medium"
                };
            });

            outputContainer.classList.remove('hidden');
            buildPlannerMatrix();
            executeAnalysisEngine();
        }

        function guessIntentString(phrase) {
            const lower = phrase.toLowerCase();
            let info = 0, trans = 0, invest = 0;
            intentRules.informational.forEach(w => { if(lower.includes(w)) info++; });
            intentRules.transactional.forEach(w => { if(lower.includes(w)) trans++; });
            intentRules.investigational.forEach(w => { if(lower.includes(w)) invest++; });

            if (info > 0 && trans === 0 && invest === 0) return 'Informational';
            if (trans > 0 && info === 0 && invest === 0) return 'Transactional';
            if (invest > 0 && info === 0 && trans === 0) return 'Investigational';
            return 'Mixed';
        }

        function buildPlannerMatrix() {
            plannerTableBody.textContent = '';

            keywordsState.forEach((item, index) => {
                const tr = document.createElement('tr');

                // Keyword input cell
                const tdPhrase = document.createElement('td');
                const inpPhrase = document.createElement('input');
                inpPhrase.type = 'text';
                inpPhrase.value = item.phrase;
                inpPhrase.addEventListener('change', (e) => {
                    keywordsState[index].phrase = e.target.value;
                });
                tdPhrase.appendChild(inpPhrase);
                tr.appendChild(tdPhrase);

                // Intent Selector
                const tdIntent = document.createElement('td');
                const selIntent = document.createElement('select');
                ['Informational', 'Transactional', 'Investigational', 'Mixed'].forEach(opt => {
                    const o = document.createElement('option');
                    o.value = opt;
                    o.textContent = opt;
                    if (opt === item.intent) o.selected = true;
                    selIntent.appendChild(o);
                });
                selIntent.addEventListener('change', (e) => {
                    keywordsState[index].intent = e.target.value;
                });
                tdIntent.appendChild(selIntent);
                tr.appendChild(tdIntent);

                // Stage Selector
                const tdStage = document.createElement('td');
                const selStage = document.createElement('select');
                ['TOFU', 'MOFU', 'BOFU'].forEach(opt => {
                    const o = document.createElement('option');
                    o.value = opt;
                    o.textContent = opt;
                    if (opt === item.stage) o.selected = true;
                    selStage.appendChild(o);
                });
                selStage.addEventListener('change', (e) => {
                    keywordsState[index].stage = e.target.value;
                });
                tdStage.appendChild(selStage);
                tr.appendChild(tdStage);

                // Difficulty Selector
                const tdDiff = document.createElement('td');
                const selDiff = document.createElement('select');
                ['Low', 'Medium', 'High'].forEach(opt => {
                    const o = document.createElement('option');
                    o.value = opt;
                    o.textContent = opt;
                    if (opt === item.difficulty) o.selected = true;
                    selDiff.appendChild(o);
                });
                selDiff.addEventListener('change', (e) => {
                    keywordsState[index].difficulty = e.target.value;
                });
                tdDiff.appendChild(selDiff);
                tr.appendChild(tdDiff);

                plannerTableBody.appendChild(tr);
            });
        }

        function triggerRecalculation() {
            executeAnalysisEngine();
        }

        function executeAnalysisEngine() {
            gapAlerts.textContent = '';
            clusterContainer.textContent = '';
            distSummary.textContent = '';

            let counts = { Informational: 0, Transactional: 0, Investigational: 0, Mixed: 0 };
            let clusters = {};

            keywordsState.forEach(item => {
                if(counts[item.intent] !== undefined) counts[item.intent]++;

                // Local clustering allocation using structural string patterns
                const words = item.phrase.toLowerCase()
                    .replace(/[^a-zA-Z0-9\s]/g, '')
                    .split(/\s+/)
                    .filter(w => w.length > 2 && !stopWords.has(w));
                
                let anchor = "general";
                if (words.length > 0) {
                    anchor = words[0]; 
                    for (let key in clusters) {
                        if (words.includes(key) || key.includes(words[0])) {
                            anchor = key;
                            break;
                        }
                    }
                }

                if (!clusters[anchor]) clusters[anchor] = [];
                clusters[anchor].push(item);
            });

            // Draw Summary Cards
            for (let type in counts) {
                const statBox = document.createElement('div');
                statBox.className = 'dist-stat';
                const val = document.createElement('div');
                val.className = 'dist-val';
                val.textContent = counts[type];
                const lbl = document.createElement('div');
                lbl.className = 'dist-lbl';
                lbl.textContent = type.substring(0, 4);
                statBox.appendChild(val);
                statBox.appendChild(lbl);
                distSummary.appendChild(statBox);
            }

            let missingTrans = [];
            let missingInfo = [];
            let briefMarkdown = `=== SEO SPRINT PLANNING BRIEF ===\nExecution Matrix Output\n\n`;

            // Process clusters UI & Logic safely
            for (let key in clusters) {
                const items = clusters[key];
                
                // Track internal diversity inside structural nodes
                let hasInfo = items.some(i => i.intent === 'Informational');
                let hasTrans = items.some(i => i.intent === 'Transactional');
                if (!hasTrans) missingTrans.push(key);
                if (!hasInfo) missingInfo.push(key);

                const clusterCard = document.createElement('div');
                clusterCard.className = 'cluster-card';

                const clusterHeader = document.createElement('div');
                clusterHeader.className = 'cluster-header';

                const clusterName = document.createElement('span');
                clusterName.className = 'cluster-name';
                clusterName.textContent = `Pillar Cluster: ${key.toUpperCase()}`;

                const badge = document.createElement('span');
                badge.className = 'badge badge-info';
                badge.textContent = `${items.length} Units`;

                clusterHeader.appendChild(clusterName);
                clusterHeader.appendChild(badge);
                clusterCard.appendChild(clusterHeader);

                const kwList = document.createElement('ul');
                kwList.className = 'kw-list';

                items.forEach(i => {
                    const kwItem = document.createElement('li');
                    kwItem.className = 'kw-item';
                    kwItem.textContent = `${i.phrase} [${i.intent} | ${i.stage} | Diff: ${i.difficulty}]`;
                    kwList.appendChild(kwItem);
                });

                clusterCard.appendChild(kwList);
                clusterContainer.appendChild(clusterCard);

                // Append node specs to the export state text buffer
                briefMarkdown += `## Cluster Strategy Node: [${key.toUpperCase()}]\n`;
                briefMarkdown += `Target Content Pipeline Architecture:\n`;
                items.forEach(i => {
                    briefMarkdown += `  - Keyword Variant: ${i.phrase} (Stage: ${i.stage}, Target Difficulty: ${i.difficulty})\n`;
                });
                briefMarkdown += `\nRecommended Setup Structure:\n`;
                briefMarkdown += `  - Primary H1 Focus: Mastering the Ecosystem of ${key.charAt(0).toUpperCase() + key.slice(1)}\n`;
                briefMarkdown += `  - Section Execution: Functional patterns matching specific criteria profiles.\n`;
                briefMarkdown += `\n--------------------------------------------------\n\n`;
            }

            // Print Pipeline Coverage Diagnostics Safely
            if (missingTrans.length > 0) {
                const alertDiv = document.createElement('div');
                alertDiv.className = 'alert';
                const title = document.createElement('div');
                title.className = 'alert-title';
                title.textContent = '⚠️ Monetization/Conversion Gap';
                const desc = document.createElement('p');
                desc.style.color = 'var(--muted)';
                desc.style.fontSize = '0.8rem';
                desc.textContent = `The tactical nodes "${missingTrans.slice(0, 3).join(', ')}" do not present clean bottom-funnel keyword mappings.`;
                alertDiv.appendChild(title);
                alertDiv.appendChild(desc);
                gapAlerts.appendChild(alertDiv);
            }

            if (missingInfo.length > 0) {
                const alertDiv = document.createElement('div');
                alertDiv.className = 'alert';
                alertDiv.style.background = 'rgba(59, 130, 246, 0.1)';
                alertDiv.style.borderLeftColor = 'var(--info)';
                const title = document.createElement('div');
                title.className = 'alert-title';
                title.style.color = 'var(--info)';
                title.textContent = '💡 Authority Gap Detected';
                const desc = document.createElement('p');
                desc.style.color = 'var(--muted)';
                desc.style.fontSize = '0.8rem';
                desc.textContent = `The transactional nodes "${missingInfo.slice(0, 3).join(', ')}" lack corresponding informational support coverage guides.`;
                alertDiv.appendChild(title);
                alertDiv.appendChild(desc);
                gapAlerts.appendChild(alertDiv);
            }

            generatedBriefText = briefMarkdown.trim();
            briefBlock.textContent = generatedBriefText;
        }

        function copyBrief() {
            if (!generatedBriefText) return;
            navigator.clipboard.writeText(generatedBriefText);
            alert("Brief content securely saved to system buffer.");
        }

        function downloadBrief() {
            if (!generatedBriefText) return;
            const blob = new Blob([generatedBriefText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'seo-sprint-planner-export.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
