<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Mobile Sprint Workspace</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --warn: #f59e0b;
            --info: #3b82f6;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        header {
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
        }

        textarea:focus, select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 12px 8px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button.secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        button.secondary:hover {
            background: var(--border);
        }

        .hidden {
            display: none !important;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 10px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        /* Distribution Summary Grid */
        .dist-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }

        .dist-stat {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 4px;
            text-align: center;
        }

        .dist-val {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }

        .dist-lbl {
            font-size: 0.65rem;
            color: var(--muted);
            text-transform: uppercase;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Mobile Workspace Stacking Grid */
        .matrix-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        .planner-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
        }

        .planner-card input[type="text"] {
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .card-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .card-controls select {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px;
            border-radius: 4px;
            font-size: 0.75rem;
            width: 100%;
        }

        /* Gap Alerts */
        .alert {
            background: rgba(245, 158, 11, 0.1);
            border-left: 4px solid var(--warn);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .alert-title {
            font-weight: 600;
            color: var(--warn);
            margin-bottom: 2px;
            font-size: 0.85rem;
        }

        .alert p {
            color: var(--muted);
            font-size: 0.8rem;
        }

        /* Cluster Cards */
        .cluster-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cluster-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
        }

        .cluster-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .cluster-name {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(59, 130, 246, 0.2); 
            color: #93c5fd;
        }

        .kw-list {
            list-style: none;
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .kw-item {
            padding: 4px 0;
            border-bottom: 1px dashed rgba(51, 65, 85, 0.4);
            white-space: pre-wrap;
        }

        .kw-item:last-child {
            border-bottom: none;
        }

        .brief-output {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.75rem;
            white-space: pre-wrap;
            overflow-x: auto;
            max-height: 350px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SEO Mobile Sprint Tool</h1>
        <p class="subtitle">Zero horizontal scroll workspace</p>
    </header>

    <div class="container">
        <div class="card">
            <label for="kwInput">Keywords (One Per Line)</label>
            <textarea id="kwInput" placeholder="how to build a chicken coop&#10;chicken coop plans diy&#10;buy pre-built chicken coop&#10;best wood for chicken coop&#10;chicken coop nesting boxes setup"></textarea>
            <div class="actions">
                <button id="btnRun">Parse &amp; Build</button>
                <button id="btnSample" class="secondary">Load Sample</button>
            </div>
        </div>

        <div id="outputContainer" class="card hidden">
            
            <div class="section-title">Intent Balance</div>
            <div id="distSummary" class="dist-summary"></div>

            <div class="section-title">Sprint Planner Matrix</div>
            <div id="matrixStackContainer" class="matrix-stack"></div>
            
            <div class="actions" style="margin-bottom: 20px; grid-template-columns: 1fr;">
                <button id="btnRefresh" style="background-color: var(--panel); color: var(--accent); border: 1px solid var(--border);">Update Engine Metrics</button>
            </div>

            <div class="section-title">Gaps &amp; Warnings</div>
            <div id="gapAlerts"></div>

            <div class="section-title" style="margin-top: 16px;">Intent Clusters</div>
            <div id="clusterContainer" class="cluster-grid"></div>

            <div class="section-title" style="margin-top: 20px;">Content Sprint Brief</div>
            <div class="actions" style="margin-bottom: 10px;">
                <button id="btnCopy" class="secondary">Copy Brief</button>
                <button id="btnDownload" class="secondary">Download</button>
            </div>
            <pre id="briefBlock" class="brief-output"></pre>
        </div>
    </div>

    <script>
        const stopWords = new Set(['for', 'the', 'and', 'with', 'best', 'buy', 'how', 'to', 'what', 'is', 'a', 'in', 'on', 'of', 'near', 'me', 'online', 'top', 'vs', 'cheap', 'guide', 'review', 'reviews']);

        const intentRules = {
            informational: ['how', 'what', 'why', 'guide', 'tips', 'tutorial', 'ideas', 'diy', 'example', 'learn'],
            transactional: ['buy', 'price', 'cheap', 'cost', 'shop', 'sale', 'purchase', 'order', 'store'],
            investigational: ['best', 'vs', 'review', 'top', 'compare', 'alternative', 'rated']
        };

        const sampleData = [
            "how to build a chicken coop",
            "chicken coop plans diy",
            "buy pre-built chicken coop",
            "best wood for chicken coop",
            "chicken coop nesting boxes setup",
            "affordable chicken coops for sale",
            "chicken coop size calculator"
        ];

        let keywordsState = [];
        let generatedBriefText = "";

        const btnRun = document.getElementById('btnRun');
        const btnSample = document.getElementById('btnSample');
        const btnRefresh = document.getElementById('btnRefresh');
        const btnCopy = document.getElementById('btnCopy');
        const btnDownload = document.getElementById('btnDownload');
        const kwInput = document.getElementById('kwInput');
        const outputContainer = document.getElementById('outputContainer');
        const distSummary = document.getElementById('distSummary');
        const matrixStackContainer = document.getElementById('matrixStackContainer');
        const gapAlerts = document.getElementById('gapAlerts');
        const clusterContainer = document.getElementById('clusterContainer');
        const briefBlock = document.getElementById('briefBlock');

        btnRun.addEventListener('click', parseInitialKeywords);
        btnSample.addEventListener('click', loadSampleData);
        btnRefresh.addEventListener('click', triggerRecalculation);
        btnCopy.addEventListener('click', copyBrief);
        btnDownload.addEventListener('click', downloadBrief);

        function loadSampleData() {
            kwInput.value = sampleData.join('\n');
            parseInitialKeywords();
        }

        function parseInitialKeywords() {
            const rawInput = kwInput.value;
            const lines = rawInput.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);

            if (lines.length === 0) return;

            keywordsState = lines.map(line => {
                const intent = guessIntentString(line);
                let stage = "TOFU";
                if (intent === "Transactional") stage = "BOFU";
                if (intent === "Investigational") stage = "MOFU";

                return {
                    phrase: line,
                    intent: intent,
                    stage: stage,
                    difficulty: "Medium"
                };
            });

            outputContainer.classList.remove('hidden');
            buildPlannerMatrixStack();
            executeAnalysisEngine();
        }

        function guessIntentString(phrase) {
            const lower = phrase.toLowerCase();
            let info = 0, trans = 0, invest = 0;
            intentRules.informational.forEach(w => { if(lower.includes(w)) info++; });
            intentRules.transactional.forEach(w => { if(lower.includes(w)) trans++; });
            intentRules.investigational.forEach(w => { if(lower.includes(w)) invest++; });

            if (info > 0 && trans === 0 && invest === 0) return 'Informational';
            if (trans > 0 && info === 0 && invest === 0) return 'Transactional';
            if (invest > 0 && info === 0 && trans === 0) return 'Investigational';
            return 'Mixed';
        }

        function buildPlannerMatrixStack() {
            matrixStackContainer.textContent = '';

            keywordsState.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'planner-card';

                // Phrase Input field
                const inpPhrase = document.createElement('input');
                inpPhrase.type = 'text';
                inpPhrase.value = item.phrase;
                inpPhrase.addEventListener('change', (e) => {
                    keywordsState[index].phrase = e.target.value;
                });
                card.appendChild(inpPhrase);

                // Controls row configuration
                const controlsRow = document.createElement('div');
                controlsRow.className = 'card-controls';

                // Intent drop-menu
                const selIntent = document.createElement('select');
                ['Informational', 'Transactional', 'Investigational', 'Mixed'].forEach(opt => {
                    const o = document.createElement('option');
                    o.value = opt;
                    o.textContent = opt;
                    if (opt === item.intent) o.selected = true;
                    selIntent.appendChild(o);
                });
                selIntent.addEventListener('change', (e) => {
                    keywordsState[index].intent = e.target.value;
                });
                controlsRow.appendChild(selIntent);

                // Funnel Stage drop-menu
                const selStage = document.createElement('select');
                ['TOFU', 'MOFU', 'BOFU'].forEach(opt => {
                    const o = document.createElement('option');
                    o.value = opt;
                    o.textContent = opt;
                    if (opt === item.stage) o.selected = true;
                    selStage.appendChild(o);
                });
                selStage.addEventListener('change', (e) => {
                    keywordsState[index].stage = e.target.value;
                });
                controlsRow.appendChild(selStage);

                // Difficulty parameters drop-menu
                const selDiff = document.createElement('select');
                ['Low', 'Medium', 'High'].forEach(opt => {
                    const o = document.createElement('option');
                    o.value = opt;
                    o.textContent = opt;
                    if (opt === item.difficulty) o.selected = true;
                    selDiff.appendChild(o);
                });
                selDiff.addEventListener('change', (e) => {
                    keywordsState[index].difficulty = e.target.value;
                });
                controlsRow.appendChild(selDiff);

                card.appendChild(controlsRow);
                matrixStackContainer.appendChild(card);
            });
        }

        function triggerRecalculation() {
            executeAnalysisEngine();
        }

        function executeAnalysisEngine() {
            gapAlerts.textContent = '';
            clusterContainer.textContent = '';
            distSummary.textContent = '';

            let counts = { Informational: 0, Transactional: 0, Investigational: 0, Mixed: 0 };
            let clusters = {};

            keywordsState.forEach(item => {
                if(counts[item.intent] !== undefined) counts[item.intent]++;

                const words = item.phrase.toLowerCase()
                    .replace(/[^a-zA-Z0-9\s]/g, '')
                    .split(/\s+/)
                    .filter(w => w.length > 2 && !stopWords.has(w));
                
                let anchor = "general";
                if (words.length > 0) {
                    anchor = words[0]; 
                    for (let key in clusters) {
                        if (words.includes(key) || key.includes(words[0])) {
                            anchor = key;
                            break;
                        }
                    }
                }

                if (!clusters[anchor]) clusters[anchor] = [];
                clusters[anchor].push(item);
            });

            // Display distribution dashboard nodes
            for (let type in counts) {
                const statBox = document.createElement('div');
                statBox.className = 'dist-stat';
                const val = document.createElement('div');
                val.className = 'dist-val';
                val.textContent = counts[type];
                const lbl = document.createElement('div');
                lbl.className = 'dist-lbl';
                lbl.textContent = type.substring(0, 4);
                statBox.appendChild(val);
                statBox.appendChild(lbl);
                distSummary.appendChild(statBox);
            }

            let missingTrans = [];
            let missingInfo = [];
            let briefMarkdown = `=== SEO SPRINT PLANNING BRIEF ===\nMobile Workspace Output\n\n`;

            // Draw semantic clustering structures safely
            for (let key in clusters) {
                const items = clusters[key];
                
                let hasInfo = items.some(i => i.intent === 'Informational');
                let hasTrans = items.some(i => i.intent === 'Transactional');
                if (!hasTrans) missingTrans.push(key);
                if (!hasInfo) missingInfo.push(key);

                const clusterCard = document.createElement('div');
                clusterCard.className = 'cluster-card';

                const clusterHeader = document.createElement('div');
                clusterHeader.className = 'cluster-header';

                const clusterName = document.createElement('span');
                clusterName.className = 'cluster-name';
                clusterName.textContent = `Cluster: ${key.toUpperCase()}`;

                const badge = document.createElement('span');
                badge.className = 'badge';
                badge.textContent = `${items.length} Phrases`;

                clusterHeader.appendChild(clusterName);
                clusterHeader.appendChild(badge);
                clusterCard.appendChild(clusterHeader);

                const kwList = document.createElement('ul');
                kwList.className = 'kw-list';

                items.forEach(i => {
                    const kwItem = document.createElement('li');
                    kwItem.className = 'kw-item';
                    kwItem.textContent = `${i.phrase} (${i.intent} | ${i.stage} | Diff: ${i.difficulty})`;
                    kwList.appendChild(kwItem);
                });

                clusterCard.appendChild(kwList);
                clusterContainer.appendChild(clusterCard);

                // Build export brief contents blocks
                briefMarkdown += `## Cluster Group Focus: [${key.toUpperCase()}]\n`;
                briefMarkdown += `Target Strategy Structure Mapping:\n`;
                items.forEach(i => {
                    briefMarkdown += `  - Variant: ${i.phrase} [${i.intent} | ${i.stage} | ${i.difficulty}]\n`;
                });
                briefMarkdown += `\nRecommended Setup Structure:\n`;
                briefMarkdown += `  - H1 Execution Node: Deep-Dive Blueprint on ${key.charAt(0).toUpperCase() + key.slice(1)}\n`;
                briefMarkdown += `  - H2 Scenario Variant: Solving primary programmatic objectives.\n`;
                briefMarkdown += `\n--------------------------------------------------\n\n`;
            }

            // Generate actionable structural optimization alert elements
            if (missingTrans.length > 0) {
                const alertDiv = document.createElement('div');
                alertDiv.className = 'alert';
                const title = document.createElement('div');
                title.className = 'alert-title';
                title.textContent = '⚠️ Monetization/Conversion Gap';
                const desc = document.createElement('p');
                desc.textContent = `The clusters "${missingTrans.slice(0, 2).join(', ')}" lack bottom-of-funnel transaction intent elements.`;
                alertDiv.appendChild(title);
                alertDiv.appendChild(desc);
                gapAlerts.appendChild(alertDiv);
            }

            if (missingInfo.length > 0) {
                const alertDiv = document.createElement('div');
                alertDiv.className = 'alert';
                alertDiv.style.background = 'rgba(59, 130, 246, 0.1)';
                alertDiv.style.borderLeftColor = 'var(--info)';
                const title = document.createElement('div');
                title.className = 'alert-title';
                title.style.color = 'var(--info)';
                title.textContent = '💡 Contextual Authority Gap';
                const desc = document.createElement('p');
                desc.textContent = `The transactional nodes "${missingInfo.slice(0, 2).join(', ')}" lack upper-funnel informational support nodes.`;
                alertDiv.appendChild(title);
                alertDiv.appendChild(desc);
                gapAlerts.appendChild(alertDiv);
            }

            if (missingTrans.length === 0 && missingInfo.length === 0) {
                const cleanMsg = document.createElement('p');
                cleanMsg.style.color = 'var(--success)';
                cleanMsg.style.fontSize = '0.85rem';
                cleanMsg.textContent = '✓ Keyword profile demonstrates balanced pipeline intent mapping.';
                gapAlerts.appendChild(cleanMsg);
            }

            generatedBriefText = briefMarkdown.trim();
            briefBlock.textContent = generatedBriefText;
        }

        function copyBrief() {
            if (!generatedBriefText) return;
            navigator.clipboard.writeText(generatedBriefText);
            alert("Brief copied to system buffer.");
        }

        function downloadBrief() {
            if (!generatedBriefText) return;
            const blob = new Blob([generatedBriefText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'seo-mobile-brief-export.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
