<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mailroom Cart Route</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,Arial,sans-serif;
    background:#172033;
    color:#f4f7fb;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:14px;
    overflow-x:hidden;
  }
  .game{
    width:min(720px,100%);
    background:#202c45;
    border:1px solid #415173;
    border-radius:18px;
    padding:14px;
    box-shadow:0 18px 50px #0007;
  }
  h1{margin:0 0 8px;font-size:clamp(24px,5vw,38px)}
  .hud{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin:10px 0;
  }
  .box{
    background:#10192b;
    border:1px solid #394966;
    border-radius:12px;
    padding:8px;
    text-align:center;
    font-size:13px;
  }
  .box span{display:block;font-size:20px;font-weight:800}
  #grid{
    display:grid;
    grid-template-columns:repeat(9,1fr);
    gap:5px;
    touch-action:none;
    user-select:none;
  }
  .cell{
    aspect-ratio:1;
    border-radius:11px;
    background:#d7deea;
    color:#172033;
    display:grid;
    place-items:center;
    font-size:clamp(20px,6vw,34px);
    border:2px solid #0002;
    cursor:pointer;
  }
  .desk{background:#536278;color:#fff}
  .cart{background:#ffd15c}
  .parcel{background:#79e0a1}
  .done{background:#bfc9d8;color:#526071}
  .path{outline:3px solid #79b7ff}
  .controls{
    display:grid;
    grid-template-columns:repeat(3,58px);
    gap:8px;
    justify-content:center;
    margin-top:12px;
  }
  button{
    border:0;
    border-radius:12px;
    padding:12px;
    font-weight:800;
    background:#79b7ff;
    color:#102033;
    cursor:pointer;
  }
  .wide{
    width:100%;
    margin-top:12px;
    background:#ffd15c;
  }
  .msg{
    min-height:26px;
    margin-top:10px;
    color:#dce8ff;
    text-align:center;
  }
  @media(max-width:430px){
    .game{padding:10px;border-radius:14px}
    .hud{grid-template-columns:repeat(2,1fr)}
    #grid{gap:4px}
    .cell{border-radius:8px}
  }
</style>
</head>
<body>
<div class="game">
  <h1>Mailroom Cart Route</h1>
  <div>Deliver every parcel. Fewer steps and faster routes score higher.</div>

  <div class="hud">
    <div class="box">Parcels<span id="left">0</span></div>
    <div class="box">Steps<span id="steps">0</span></div>
    <div class="box">Time<span id="time">0</span></div>
    <div class="box">Best<span id="best">0</span></div>
  </div>

  <div id="grid" aria-label="Office delivery grid"></div>

  <div class="controls">
    <div></div><button onclick="move(0,-1)">↑</button><div></div>
    <button onclick="move(-1,0)">←</button><button onclick="newGame()">↻</button><button onclick="move(1,0)">→</button>
    <div></div><button onclick="move(0,1)">↓</button><div></div>
  </div>

  <button class="wide" onclick="newGame()">New office route</button>
  <div class="msg" id="msg">Use arrows/WASD, buttons, or tap a reachable square.</div>
</div>

<script>
const W=9,H=7;
const desks = new Set(["2,1","3,1","6,1","1,3","4,3","7,3","2,5","5,5","6,5"]);
const parcelStarts = [[8,0],[0,2],[5,2],[8,4],[3,6]];
let cart, parcels, delivered, steps, started, timer, seconds, queuedPath=[], autoMoving=false;

const grid=document.getElementById("grid");
const leftEl=document.getElementById("left");
const stepsEl=document.getElementById("steps");
const timeEl=document.getElementById("time");
const bestEl=document.getElementById("best");
const msg=document.getElementById("msg");
bestEl.textContent=localStorage.mailroomBest||0;

function key(x,y){return x+","+y}
function blocked(x,y){return x<0||y<0||x>=W||y>=H||desks.has(key(x,y))}
function hasParcel(x,y){return parcels.some(p=>p.x===x&&p.y===y&&!p.done)}

function newGame(){
  cart={x:0,y:6};
  parcels=parcelStarts.map(p=>({x:p[0],y:p[1],done:false}));
  delivered=0; steps=0; seconds=0; started=false; queuedPath=[]; autoMoving=false;
  clearInterval(timer);
  msg.textContent="Use arrows/WASD, buttons, or tap a reachable square.";
  render();
}
function startClock(){
  if(started)return;
  started=true;
  timer=setInterval(()=>{seconds++; timeEl.textContent=seconds},1000);
}
function render(){
  grid.innerHTML="";
  leftEl.textContent=parcels.length-delivered;
  stepsEl.textContent=steps;
  timeEl.textContent=seconds;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const c=document.createElement("div");
      c.className="cell";
      c.dataset.x=x; c.dataset.y=y;
      if(desks.has(key(x,y))){c.classList.add("desk"); c.textContent="▦"}
      else if(cart.x===x&&cart.y===y){c.classList.add("cart"); c.textContent="🛒"}
      else if(hasParcel(x,y)){c.classList.add("parcel"); c.textContent="📦"}
      else if(parcels.some(p=>p.x===x&&p.y===y&&p.done)){c.classList.add("done"); c.textContent="✓"}
      else c.textContent="";
      if(queuedPath.some(p=>p.x===x&&p.y===y)) c.classList.add("path");
      c.addEventListener("pointerdown",cellTap);
      grid.appendChild(c);
    }
  }
}
function move(dx,dy, keepQueuedPath=false){
  if(delivered===parcels.length)return;
  startClock();
  if(!keepQueuedPath){
    queuedPath=[];
    autoMoving=false;
  }
  const nx=cart.x+dx, ny=cart.y+dy;
  if(blocked(nx,ny)){
    msg.textContent="Desk jam. Route around the office furniture.";
    render();
    return false;
  }
  cart.x=nx; cart.y=ny; steps++;
  checkDelivery();
  render();
  return true;
}
function checkDelivery(){
  const p=parcels.find(p=>p.x===cart.x&&p.y===cart.y&&!p.done);
  if(p){
    p.done=true; delivered++;
    msg.textContent="Parcel delivered.";
    if(delivered===parcels.length) finish();
  }
}
function finish(){
  clearInterval(timer);
  queuedPath=[];
  autoMoving=false;
  const score=Math.max(100,1000-steps*18-seconds*6);
  const best=Number(localStorage.mailroomBest||0);
  if(score>best){
    localStorage.mailroomBest=score;
    bestEl.textContent=score;
    msg.textContent=`Route complete. Score ${score}. New best.`;
  } else {
    msg.textContent=`Route complete. Score ${score}. Best ${best}.`;
  }
  render();
}
function cellTap(e){
  if(delivered===parcels.length)return;
  const x=+e.currentTarget.dataset.x, y=+e.currentTarget.dataset.y;
  if(blocked(x,y))return;
  const path=findPath(cart,{x,y});
  if(path.length<2){
    msg.textContent="Already there.";
    return;
  }
  queuedPath=path.slice(1);
  autoMoving=true;
  msg.textContent="Following tapped route.";
  render();
  setTimeout(autoStep,90);
}
function autoStep(){
  if(!autoMoving || !queuedPath.length || delivered===parcels.length){
    autoMoving=false;
    queuedPath=[];
    render();
    return;
  }
  const next=queuedPath.shift();
  const dx=next.x-cart.x, dy=next.y-cart.y;
  const moved=move(dx,dy,true);
  if(moved && queuedPath.length){
    setTimeout(autoStep,110);
  } else {
    autoMoving=false;
    queuedPath=[];
    render();
  }
}
function findPath(a,b){
  const q=[{x:a.x,y:a.y}], prev={}, seen=new Set([key(a.x,a.y)]);
  while(q.length){
    const n=q.shift();
    if(n.x===b.x&&n.y===b.y)break;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const x=n.x+dx,y=n.y+dy,k=key(x,y);
      if(!blocked(x,y)&&!seen.has(k)){
        seen.add(k); prev[k]=n; q.push({x,y});
      }
    });
  }
  if(!seen.has(key(b.x,b.y)))return [];
  const path=[]; let cur={x:b.x,y:b.y};
  while(cur){path.unshift(cur); cur=prev[key(cur.x,cur.y)]}
  return path;
}
document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(k)) e.preventDefault();
  if(k==="arrowup"||k==="w")move(0,-1);
  if(k==="arrowdown"||k==="s")move(0,1);
  if(k==="arrowleft"||k==="a")move(-1,0);
  if(k==="arrowright"||k==="d")move(1,0);
  if(k==="r")newGame();
});
newGame();
</script>
</body>
</html>
