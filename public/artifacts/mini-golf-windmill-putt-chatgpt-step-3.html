<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tiny Windmill Mini Golf</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at top, #2d6a3b 0%, #12311c 58%, #08190f 100%);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #f4ffe8;
  }

  .wrap {
    width: min(94vw, 760px);
    text-align: center;
    padding: 10px 0 18px;
  }

  h1 {
    margin: 8px 0 6px;
    font-size: clamp(24px, 5vw, 40px);
    line-height: 1.05;
  }

  .instructions {
    margin: 0 auto 10px;
    max-width: 620px;
    opacity: 0.9;
    font-size: clamp(14px, 3.2vw, 16px);
    line-height: 1.35;
  }

  .hud {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 10px 0;
  }

  .pill {
    background: #244b2e;
    border: 1px solid #78b86b;
    border-radius: 999px;
    padding: 9px 10px;
    font-weight: 800;
    font-size: 14px;
    white-space: nowrap;
  }

  #status.hit {
    background: #8f2d22;
    border-color: #ffd0c8;
  }

  canvas {
    width: 100%;
    display: block;
    background: #6fc66b;
    border: 5px solid #d6b46c;
    border-radius: 18px;
    box-shadow: 0 20px 50px #0008;
    touch-action: none;
  }

  button {
    margin: 12px 6px 0;
    padding: 12px 18px;
    border: 0;
    border-radius: 12px;
    font-weight: 900;
    cursor: pointer;
    background: #ffe082;
    color: #243018;
    min-width: 130px;
  }

  @media (max-width: 520px) {
    .wrap { width: 96vw; padding-top: 6px; }
    h1 { margin-top: 4px; font-size: 25px; }
    .instructions { font-size: 13px; margin-bottom: 8px; }
    .hud { grid-template-columns: 1fr 1fr; gap: 6px; }
    .pill { padding: 8px; font-size: 13px; }
    #status { grid-column: 1 / -1; }
    canvas { border-width: 4px; border-radius: 14px; }
    button { width: 100%; margin: 10px 0 0; padding: 14px 18px; font-size: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tiny Windmill Mini Golf</h1>
  <p class="instructions">Drag back from the ball. The longer the pull, the stronger the putt. Time the blade. Par 3.</p>

  <div class="hud">
    <div class="pill">Strokes: <span id="strokes">0</span></div>
    <div class="pill">Par: 3</div>
    <div class="pill" id="status">Ready</div>
  </div>

  <canvas id="game" width="760" height="500"></canvas>
  <button onclick="resetGame()">Reset Hole</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const strokesEl = document.getElementById("strokes");
const statusEl = document.getElementById("status");

const ballStart = { x: 95, y: 250 };
const hole = { x: 680, y: 250, r: 18 };
const windmill = { x: 390, y: 250, r: 92, angle: 0, speed: 0.035 };

let ball, strokes, dragging, dragStart, dragNow, won;
let hitFlash = 0;
let shake = 0;

function resetGame() {
  ball = { x: ballStart.x, y: ballStart.y, vx: 0, vy: 0, r: 9 };
  strokes = 0;
  dragging = false;
  dragStart = null;
  dragNow = null;
  won = false;
  hitFlash = 0;
  shake = 0;
  strokesEl.textContent = strokes;
  setStatus("Ready");
}

function setStatus(text, hit = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle("hit", hit);
}

function pointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * canvas.width / rect.width,
    y: (e.clientY - rect.top) * canvas.height / rect.height
  };
}

function ballSpeed() {
  return Math.hypot(ball.vx, ball.vy);
}

function ballStopped() {
  return ballSpeed() < 0.08;
}

canvas.addEventListener("pointerdown", e => {
  if (won || !ballStopped()) return;
  const p = pointerPos(e);
  if (Math.hypot(p.x - ball.x, p.y - ball.y) < 52) {
    canvas.setPointerCapture(e.pointerId);
    dragging = true;
    dragStart = { x: ball.x, y: ball.y };
    dragNow = p;
    setStatus("Aim and release");
  }
});

canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  dragNow = pointerPos(e);
});

canvas.addEventListener("pointerup", () => {
  if (!dragging || won) return;

  const dx = dragStart.x - dragNow.x;
  const dy = dragStart.y - dragNow.y;
  const pull = Math.hypot(dx, dy);
  const power = Math.min(pull, 120);
  const scale = power / Math.max(pull, 1) * 0.13;

  ball.vx = dx * scale;
  ball.vy = dy * scale;

  strokes++;
  strokesEl.textContent = strokes;
  setStatus("Rolling");
  dragging = false;
});

canvas.addEventListener("pointercancel", () => {
  dragging = false;
  setStatus("Ready");
});

function drawCourse() {
  ctx.fillStyle = "#6fc66b";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "#3c8b43";
  ctx.lineWidth = 34;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(75, 250);
  ctx.lineTo(685, 250);
  ctx.stroke();

  ctx.fillStyle = "#4ca653";
  ctx.beginPath();
  ctx.arc(150, 128, 48, 0, Math.PI * 2);
  ctx.arc(600, 380, 55, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#213020";
  ctx.beginPath();
  ctx.arc(hole.x, hole.y, hole.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#f7f1d1";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(hole.x, hole.y, hole.r + 7, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = "#b57634";
  ctx.fillRect(windmill.x - 34, windmill.y - 55, 68, 110);

  ctx.fillStyle = "#f6d28a";
  ctx.beginPath();
  ctx.moveTo(windmill.x - 48, windmill.y - 55);
  ctx.lineTo(windmill.x, windmill.y - 105);
  ctx.lineTo(windmill.x + 48, windmill.y - 55);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#8d5d2a";
  ctx.fillRect(windmill.x - 52, windmill.y + 52, 104, 14);
}

function drawWindmill() {
  ctx.save();
  ctx.translate(windmill.x, windmill.y);
  ctx.rotate(windmill.angle);

  for (let i = 0; i < 4; i++) {
    ctx.rotate(Math.PI / 2);
    ctx.fillStyle = "#f9f0c7";
    ctx.fillRect(-8, -windmill.r, 16, windmill.r);
    ctx.strokeStyle = "#8d5d2a";
    ctx.lineWidth = 3;
    ctx.strokeRect(-8, -windmill.r, 16, windmill.r);
  }

  ctx.fillStyle = "#5b341d";
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function triggerBladeHit(px, py) {
  hitFlash = 18;
  shake = 12;
  setStatus("BLADE HIT!", true);

  ball.vx += px * 2.2;
  ball.vy += py * 2.2;
}

function bladeCollision() {
  const dx = ball.x - windmill.x;
  const dy = ball.y - windmill.y;
  const dist = Math.hypot(dx, dy);

  if (dist > windmill.r + ball.r || dist < 18 || ballSpeed() < 0.1) return;

  for (let i = 0; i < 4; i++) {
    const a = windmill.angle + i * Math.PI / 2;
    const px = Math.cos(a);
    const py = Math.sin(a);
    const along = dx * px + dy * py;
    const side = Math.abs(dx * -py + dy * px);

    if (along > 12 && along < windmill.r && side < ball.r + 8) {
      ball.vx = -ball.vx * 0.72;
      ball.vy = -ball.vy * 0.72;
      triggerBladeHit(px, py);
      return;
    }
  }
}

function updateBall() {
  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.vx *= 0.985;
  ball.vy *= 0.985;

  if (ballStopped()) {
    ball.vx = 0;
    ball.vy = 0;
    if (!won && hitFlash <= 0) setStatus("Ready");
  }

  if (ball.x < 35 || ball.x > canvas.width - 35) ball.vx *= -0.75;
  if (ball.y < 45 || ball.y > canvas.height - 45) ball.vy *= -0.75;

  ball.x = Math.max(35, Math.min(canvas.width - 35, ball.x));
  ball.y = Math.max(45, Math.min(canvas.height - 45, ball.y));

  const dHole = Math.hypot(ball.x - hole.x, ball.y - hole.y);

  if (dHole < hole.r && ballSpeed() < 2.6 && !won) {
    won = true;
    ball.x = hole.x;
    ball.y = hole.y;
    ball.vx = 0;
    ball.vy = 0;

    if (strokes === 1) setStatus("Hole in one!");
    else if (strokes <= 3) setStatus("Under par!");
    else setStatus("Over par");
  }
}

function drawBall() {
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#c9c9c9";
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawAim() {
  if (!dragging) return;

  const dx = dragStart.x - dragNow.x;
  const dy = dragStart.y - dragNow.y;
  const rawPull = Math.hypot(dx, dy);
  const pull = Math.min(rawPull, 120);
  const powerPct = pull / 120;
  const angle = Math.atan2(dy, dx);

  const endX = ball.x + Math.cos(angle) * pull * 1.45;
  const endY = ball.y + Math.sin(angle) * pull * 1.45;

  ctx.strokeStyle = "#17351dcc";
  ctx.lineWidth = 11;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(ball.x, ball.y);
  ctx.lineTo(endX, endY);
  ctx.stroke();

  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(ball.x, ball.y);
  ctx.lineTo(endX, endY);
  ctx.stroke();

  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(endX, endY, 8, 0, Math.PI * 2);
  ctx.fill();

  const meterX = 24;
  const meterY = 28;
  const meterW = 190;
  const meterH = 18;

  ctx.fillStyle = "#18331fdd";
  ctx.fillRect(meterX, meterY, meterW, meterH);

  ctx.fillStyle = powerPct < 0.45 ? "#dfffa1" : powerPct < 0.75 ? "#ffe082" : "#ff8b73";
  ctx.fillRect(meterX, meterY, meterW * powerPct, meterH);

  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.strokeRect(meterX, meterY, meterW, meterH);

  ctx.fillStyle = "#ffffff";
  ctx.font = "800 15px system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("POWER", meterX, meterY + 36);
}

function drawHitFeedback() {
  if (hitFlash <= 0) return;

  const alpha = hitFlash / 18;

  ctx.fillStyle = `rgba(255, 75, 55, ${0.18 * alpha})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, 24 + (18 - hitFlash) * 3, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  ctx.font = "900 34px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("BLADE HIT!", canvas.width / 2, 86);
}

function loop() {
  windmill.angle += windmill.speed;

  const sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  const sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;

  ctx.save();
  ctx.translate(sx, sy);

  drawCourse();
  drawWindmill();
  bladeCollision();
  updateBall();
  drawAim();
  drawBall();
  drawHitFeedback();

  ctx.restore();

  if (hitFlash > 0) hitFlash--;
  if (shake > 0) shake *= 0.82;

  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
</body>
</html>
