<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Signal Desk</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0e1117;--surface:#161b25;--surface2:#1e2535;--border:#2a3450;
  --text:#c8d4f0;--muted:#5a6a90;
  --red:#e84040;--red-glow:#e8404044;
  --blue:#3a9fea;--blue-glow:#3a9fea44;
  --green:#2ecf7a;--green-glow:#2ecf7a44;
  --amber:#f0a830;--amber-glow:#f0a83044;
  --purple:#a06af0;--purple-glow:#a06af044;
  --track:#2a3450;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Courier New',monospace;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;padding:8px;}
#hud{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;flex-shrink:0;}
#hud .title{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;flex:1;}
#score-box{text-align:right;}
#score-label{font-size:9px;color:var(--muted);letter-spacing:1px;}
#score{font-size:20px;font-weight:700;color:var(--text);line-height:1;}
#streak{font-size:9px;color:var(--amber);min-height:12px;}
#btn-reset{background:none;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:10px;letter-spacing:1px;padding:4px 10px;border-radius:4px;cursor:pointer;transition:all .15s;}
#btn-reset:hover{border-color:var(--text);color:var(--text);}
#canvas-wrap{flex:1;position:relative;min-height:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);}
canvas{display:block;width:100%;height:100%;}
#msg-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e111799;opacity:0;pointer-events:none;transition:opacity .3s;}
#msg-overlay.show{opacity:1;pointer-events:all;}
#msg-title{font-size:22px;letter-spacing:3px;color:var(--text);margin-bottom:6px;}
#msg-sub{font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:20px;}
#btn-start{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:11px;letter-spacing:2px;padding:10px 24px;border-radius:4px;cursor:pointer;transition:all .2s;}
#btn-start:hover{border-color:var(--text);}
#signals-row{display:flex;gap:6px;margin-top:8px;flex-shrink:0;}
.sig-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;user-select:none;}
.sig-btn:active{transform:scale(.95);}
.sig-dot{width:18px;height:18px;border-radius:50%;border:2px solid;transition:all .2s;}
.sig-label{font-size:9px;letter-spacing:1px;color:var(--muted);}
.sig-count{font-size:13px;font-weight:700;}
#status-bar{display:flex;gap:6px;margin-top:6px;flex-shrink:0;height:6px;}
.status-seg{flex:1;border-radius:3px;background:var(--border);transition:background .3s;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="title">Signal Desk</div>
    <div id="score-box">
      <div id="score-label">SCORE</div>
      <div id="score">0</div>
      <div id="streak"></div>
    </div>
    <button id="btn-reset">RESET</button>
  </div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="msg-overlay" class="show">
      <div id="msg-title">SIGNAL DESK</div>
      <div id="msg-sub">TOGGLE SIGNALS · ROUTE TRAINS</div>
      <button id="btn-start">START</button>
    </div>
  </div>
  <div id="signals-row"></div>
  <div id="status-bar"></div>
</div>

<script>
const COLORS={
  red:{hex:'#e84040',glow:'#e8404066',dark:'#8b0000'},
  blue:{hex:'#3a9fea',glow:'#3a9fea66',dark:'#0a3060'},
  green:{hex:'#2ecf7a',glow:'#2ecf7a66',dark:'#0a4020'},
  amber:{hex:'#f0a830',glow:'#f0a83066',dark:'#5a3000'},
  purple:{hex:'#a06af0',glow:'#a06af066',dark:'#2a1060'},
};
const COLOR_KEYS=Object.keys(COLORS);
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const wrap=document.getElementById('canvas-wrap');
const scoreEl=document.getElementById('score');
const streakEl=document.getElementById('streak');
const overlay=document.getElementById('msg-overlay');
const msgTitle=document.getElementById('msg-title');
const msgSub=document.getElementById('msg-sub');
const btnStart=document.getElementById('btn-start');
const btnReset=document.getElementById('btn-reset');
const sigRow=document.getElementById('signals-row');
const statusBar=document.getElementById('status-bar');

let W,H,dpr;
let score=0,combo=0,lives=5,running=false;
let trains=[],stations=[],signals={},spawnTimer=0,spawnInterval=180;
let animId;
let totalDelivered=0;

const SIGNAL_COLORS_ACTIVE=4;
const MAX_TRAINS=8;
const TRAIN_SPEED=1.4;
const STATION_RADIUS=18;
const TRAIN_SIZE=11;

function resize(){
  const rect=wrap.getBoundingClientRect();
  dpr=window.devicePixelRatio||1;
  W=rect.width;H=rect.height;
  canvas.width=W*dpr;canvas.height=H*dpr;
  ctx.scale(dpr,dpr);
}

function initSignals(){
  signals={};
  COLOR_KEYS.forEach(k=>{signals[k]=true;});
  rebuildSigUI();
}

function rebuildSigUI(){
  sigRow.innerHTML='';
  statusBar.innerHTML='';
  COLOR_KEYS.forEach(k=>{
    const c=COLORS[k];
    const btn=document.createElement('div');
    btn.className='sig-btn';
    btn.id='sig-'+k;
    btn.innerHTML=`<div class="sig-dot" id="dot-${k}"></div><div class="sig-count" id="cnt-${k}">0</div><div class="sig-label">${k.toUpperCase()}</div>`;
    btn.addEventListener('click',()=>toggleSignal(k));
    btn.addEventListener('touchend',e=>{e.preventDefault();toggleSignal(k);});
    sigRow.appendChild(btn);

    const seg=document.createElement('div');
    seg.className='status-seg';
    seg.id='seg-'+k;
    statusBar.appendChild(seg);
  });
  updateSigUI();
}

function updateSigUI(){
  COLOR_KEYS.forEach(k=>{
    const on=signals[k];
    const c=COLORS[k];
    const dot=document.getElementById('dot-'+k);
    const btn=document.getElementById('sig-'+k);
    const seg=document.getElementById('seg-'+k);
    if(dot){
      dot.style.background=on?c.hex:c.dark;
      dot.style.borderColor=c.hex;
      dot.style.boxShadow=on?`0 0 8px ${c.hex}`:'none';
    }
    if(btn){btn.style.borderColor=on?c.hex:'var(--border)';}
    if(seg){seg.style.background=on?c.hex:'var(--border)';}
    const cnt=document.getElementById('cnt-'+k);
    if(cnt){
      const n=trains.filter(t=>t.color===k&&t.state==='moving').length;
      cnt.textContent=n;
      cnt.style.color=on?c.hex:'var(--muted)';
    }
  });
}

function toggleSignal(k){
  if(!running)return;
  signals[k]=!signals[k];
  if(!signals[k]){
    trains.forEach(t=>{if(t.color===k&&t.state==='moving'){t.state='stopped';t.stopTimer=0;}});
  } else {
    trains.forEach(t=>{if(t.color===k&&t.state==='stopped'){t.state='moving';}});
  }
  updateSigUI();
}

function placeStations(){
  stations=[];
  const pad=STATION_RADIUS+20;
  COLOR_KEYS.forEach((k,i)=>{
    const angle=(i/COLOR_KEYS.length)*Math.PI*2-Math.PI/2;
    const rx=(W/2-pad)*0.72,ry=(H/2-pad)*0.72;
    const x=W/2+Math.cos(angle)*rx;
    const y=H/2+Math.sin(angle)*ry;
    stations.push({color:k,x,y,pulseT:0,arrivals:0});
  });
}

function spawnTrain(){
  if(trains.filter(t=>t.state!=='done').length>=MAX_TRAINS)return;
  const color=COLOR_KEYS[Math.floor(Math.random()*COLOR_KEYS.length)];
  const edge=Math.floor(Math.random()*4);
  let x,y,vx,vy;
  const spd=TRAIN_SPEED+(totalDelivered*0.015);
  if(edge===0){x=Math.random()*W;y=-TRAIN_SIZE;vx=0;vy=spd;}
  else if(edge===1){x=W+TRAIN_SIZE;y=Math.random()*H;vx=-spd;vy=0;}
  else if(edge===2){x=Math.random()*W;y=H+TRAIN_SIZE;vx=0;vy=-spd;}
  else{x=-TRAIN_SIZE;y=Math.random()*H;vx=spd;vy=0;}
  const target=stations.find(s=>s.color===color);
  if(!target)return;
  const dx=target.x-x,dy=target.y-y,dist=Math.hypot(dx,dy);
  const spd2=spd+(totalDelivered*0.015);
  trains.push({color,x,y,vx:(dx/dist)*spd2,vy:(dy/dist)*spd2,state:'moving',stopTimer:0,wobble:Math.random()*Math.PI*2,id:Math.random()});
}

function update(){
  spawnTimer++;
  const interval=Math.max(60,spawnInterval-totalDelivered*2);
  if(spawnTimer>=interval){spawnTimer=0;spawnTrain();}

  trains.forEach(t=>{
    if(t.state==='done')return;
    if(t.state==='stopped'){
      t.stopTimer++;
      if(t.stopTimer>300){
        loseLife(t.color);
        t.state='done';
      }
      return;
    }
    if(!signals[t.color]){
      t.state='stopped';t.stopTimer=0;return;
    }
    t.x+=t.vx;t.y+=t.vy;
    t.wobble+=0.08;
    const target=stations.find(s=>s.color===t.color);
    if(target){
      const dist=Math.hypot(t.x-target.x,t.y-target.y);
      if(dist<STATION_RADIUS+TRAIN_SIZE-2){
        score+=10*(combo>2?combo:1);
        combo++;
        totalDelivered++;
        target.pulseT=1;
        target.arrivals++;
        t.state='done';
        if(combo>1)streakEl.textContent=`×${combo} COMBO`;
        scoreEl.textContent=score;
        updateSigUI();
        return;
      }
    }
    if(t.x<-60||t.x>W+60||t.y<-60||t.y>H+60){
      loseLife(t.color);
      t.state='done';
    }
  });
  trains=trains.filter(t=>t.state!=='done'||t._fade>0);
  combo=trains.some(t=>t.state==='moving')?combo:Math.max(0,combo-0.02);
  if(combo<1){combo=0;streakEl.textContent='';}
}

function loseLife(color){
  lives=Math.max(0,lives-1);
  combo=0;streakEl.textContent='';
  flashScreen(COLORS[color].hex);
  if(lives<=0){gameOver();}
}

function flashScreen(hex){
  ctx.save();
  ctx.globalAlpha=0.35;
  ctx.fillStyle=hex;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawGrid();
  drawPaths();
  drawStations();
  drawTrains();
  drawLives();
}

function drawGrid(){
  ctx.strokeStyle='#1e2535';ctx.lineWidth=1;
  const step=40;
  for(let x=0;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

function drawPaths(){
  stations.forEach(s=>{
    const color=COLORS[s.color];
    const on=signals[s.color];
    ctx.save();
    ctx.strokeStyle=on?color.hex:color.dark;
    ctx.lineWidth=on?1.5:1;
    ctx.setLineDash([6,8]);
    ctx.globalAlpha=on?0.35:0.15;
    trains.filter(t=>t.color===s.color&&t.state==='moving').forEach(t=>{
      ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(s.x,s.y);ctx.stroke();
    });
    ctx.restore();
  });
}

function drawStations(){
  stations.forEach(s=>{
    const color=COLORS[s.color];
    if(s.pulseT>0){
      ctx.save();
      ctx.globalAlpha=s.pulseT*0.6;
      ctx.strokeStyle=color.hex;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(s.x,s.y,STATION_RADIUS+(1-s.pulseT)*30,0,Math.PI*2);
      ctx.stroke();
      ctx.restore();
      s.pulseT=Math.max(0,s.pulseT-0.04);
    }
    ctx.save();
    ctx.shadowColor=color.hex;
    ctx.shadowBlur=signals[s.color]?14:4;
    ctx.fillStyle=signals[s.color]?color.dark:'#12161e';
    ctx.strokeStyle=color.hex;
    ctx.lineWidth=signals[s.color]?2.5:1.5;
    ctx.globalAlpha=signals[s.color]?1:0.5;
    const r=STATION_RADIUS;
    ctx.beginPath();
    ctx.moveTo(s.x,s.y-r);
    ctx.lineTo(s.x+r*0.866,s.y+r*0.5);
    ctx.lineTo(s.x-r*0.866,s.y+r*0.5);
    ctx.closePath();
    ctx.fill();ctx.stroke();
    ctx.restore();
    ctx.fillStyle=color.hex;
    ctx.globalAlpha=signals[s.color]?1:0.4;
    ctx.font=`bold 10px 'Courier New'`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(s.color.toUpperCase().slice(0,3),s.x,s.y+2);
    ctx.globalAlpha=1;
  });
}

function drawTrains(){
  trains.forEach(t=>{
    if(t.state==='done')return;
    const color=COLORS[t.color];
    const wobX=Math.sin(t.wobble)*1.5,wobY=Math.cos(t.wobble*0.7)*1.5;
    ctx.save();
    if(t.state==='stopped'){
      ctx.globalAlpha=0.5+Math.sin(t.stopTimer*0.15)*0.3;
      ctx.shadowColor=color.hex;ctx.shadowBlur=6;
    } else {
      ctx.shadowColor=color.hex;ctx.shadowBlur=12;
    }
    ctx.fillStyle=color.hex;
    ctx.strokeStyle='#0e1117';ctx.lineWidth=1.5;
    const sz=TRAIN_SIZE;
    ctx.translate(t.x+wobX,t.y+wobY);
    const angle=Math.atan2(t.vy,t.vx);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(sz,0);
    ctx.lineTo(-sz*0.6,sz*0.7);
    ctx.lineTo(-sz*0.3,0);
    ctx.lineTo(-sz*0.6,-sz*0.7);
    ctx.closePath();
    ctx.fill();ctx.stroke();
    if(t.state==='stopped'){
      ctx.rotate(-angle);
      ctx.fillStyle='#fff';ctx.font=`bold 9px 'Courier New'`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('!',0,-sz-6);
    }
    ctx.restore();
  });
}

function drawLives(){
  const sz=8,gap=4,startX=W-((sz+gap)*5)+gap,y=12;
  for(let i=0;i<5;i++){
    ctx.fillStyle=i<lives?COLORS.red.hex:'#2a3450';
    ctx.shadowColor=i<lives?COLORS.red.hex:'transparent';
    ctx.shadowBlur=i<lives?6:0;
    ctx.beginPath();
    ctx.arc(startX+i*(sz+gap)+sz/2,y,sz/2,0,Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur=0;
}

function gameOver(){
  running=false;
  cancelAnimationFrame(animId);
  msgTitle.textContent='SIGNAL LOST';
  msgSub.textContent=`FINAL SCORE: ${score}`;
  btnStart.textContent='TRY AGAIN';
  overlay.classList.add('show');
}

function startGame(){
  score=0;combo=0;lives=5;trains=[];totalDelivered=0;spawnTimer=0;spawnInterval=180;
  scoreEl.textContent='0';streakEl.textContent='';
  running=true;
  overlay.classList.remove('show');
  resize();
  placeStations();
  initSignals();
  spawnTrain();spawnTrain();
  loop();
}

function loop(){
  update();draw();updateSigUI();
  animId=requestAnimationFrame(loop);
}

btnStart.addEventListener('click',startGame);
btnReset.addEventListener('click',()=>{if(running){cancelAnimationFrame(animId);}startGame();});

window.addEventListener('resize',()=>{if(running){resize();placeStations();}});

resize();
initSignals();
</script>
</body>
</html>
