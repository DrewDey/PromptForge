<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Rescue Mission Plan</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --accent-urgent: #e74c3c;
            --accent-warning: #f39c12;
            --accent-safe: #2ecc71;
            --border-color: #dcdde1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1.2fr 1.5fr;
            gap: 25px;
        }

        @media (max-width: 950px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            height: fit-content;
        }

        h1, h2, h3 {
            margin-top: 0;
            color: var(--text-main);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }

        input, select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            width: 100%;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--text-main);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 25px;
        }

        button {
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            box-sizing: border-box;
        }

        .btn-primary {
            flex: 2;
            background-color: var(--text-main);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: #1a252f;
        }

        .btn-secondary {
            flex: 1;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #eee;
        }

        .inventory-section {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .inventory-table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 600;
            background-color: #f8f9fa;
        }

        .tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 3px;
            background-color: #e2e8f0;
            color: #4a5568;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--accent-urgent);
            cursor: pointer;
            font-weight: bold;
            padding: 2px 6px;
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            padding: 40px 20px;
            font-style: italic;
        }

        .timeline-section {
            margin-bottom: 30px;
        }

        .timeline-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--border-color);
        }

        .badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 20px;
            color: white;
            text-transform: uppercase;
            font-weight: bold;
        }

        .badge.critical { background-color: var(--accent-urgent); }
        .badge.warning { background-color: var(--accent-warning); }
        .badge.flex { background-color: var(--accent-safe); }

        .recipe-card {
            background: #fdfdfd;
            border: 1px solid var(--border-color);
            border-left: 5px solid transparent;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .recipe-card.critical { border-left-color: var(--accent-urgent); }
        .recipe-card.warning { border-left-color: var(--accent-warning); }
        .recipe-card.flex { border-left-color: var(--accent-safe); }

        .recipe-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .used-ingredients {
            font-size: 13px;
            margin-bottom: 10px;
        }

        .used-ingredients span {
            background: #eee;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
            display: inline-block;
            margin-top: 4px;
        }

        .instructions {
            font-size: 14px;
            line-height: 1.4;
            color: #34495e;
            margin: 0;
            padding-left: 20px;
        }

        .instructions li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="panel">
        <h1>Kitchen Rescue</h1>
        <div class="subtitle">Log structured ingredients to engineer your real-time strategy.</div>

        <form id="ingredientForm" onsubmit="addIngredient(event)">
            <div class="form-group">
                <label for="itemName">Item Name</label>
                <input type="text" id="itemName" placeholder="e.g., Heavy Cream, Spinach, Black Beans" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="itemLocation">Location</label>
                    <select id="itemLocation">
                        <option value="Fridge">Fridge</option>
                        <option value="Pantry">Pantry</option>
                        <option value="Freezer">Freezer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="itemExpiry">Days Until Expiry</label>
                    <input type="number" id="itemExpiry" placeholder="e.g., 2" min="0" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="itemPortions">Portions / Vol</label>
                    <input type="text" id="itemPortions" placeholder="e.g., 2 cups, 1/2 pack">
                </div>
                <div class="form-group">
                    <label for="itemConstraints">Constraint Tags</label>
                    <input type="text" id="itemConstraints" placeholder="e.g., Dairy, Open, Canned">
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-primary">Add Item</button>
                <button type="button" class="btn-secondary" onclick="clearInventory()">Clear All</button>
            </div>
        </form>

        <div class="inventory-section">
            <h3>Current Inventory</h3>
            <div class="inventory-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Loc</th>
                            <th>Exp (Days)</th>
                            <th>Qty</th>
                            <th>Tags</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="panel" id="outputPanel">
        <div class="placeholder-text">Add ingredients to see your active rescue strategy auto-update here.</div>
    </div>
</div>

<script>
    let inventory = [];

    // Load inventory from localStorage on init
    window.addEventListener('DOMContentLoaded', () => {
        const stored = localStorage.getItem('kitchenRescueInventory');
        if (stored) {
            inventory = JSON.parse(stored);
            updateUI();
        }
    });

    function saveToStorage() {
        localStorage.setItem('kitchenRescueInventory', JSON.stringify(inventory));
    }

    function addIngredient(e) {
        e.preventDefault();

        const name = document.getElementById('itemName').value.trim();
        const location = document.getElementById('itemLocation').value;
        const expiry = parseInt(document.getElementById('itemExpiry').value);
        const portions = document.getElementById('itemPortions').value.trim() || '1 unit';
        const constraintsRaw = document.getElementById('itemConstraints').value;

        const constraints = constraintsRaw ? constraintsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0) : [];

        const newItem = {
            id: Date.now(),
            name,
            location,
            expiry,
            portions,
            constraints
        };

        inventory.push(newItem);
        saveToStorage();
        updateUI();

        // Reset form except location
        document.getElementById('itemName').value = '';
        document.getElementById('itemExpiry').value = '';
        document.getElementById('itemPortions').value = '';
        document.getElementById('itemConstraints').value = '';
        document.getElementById('itemName').focus();
    }

    function deleteItem(id) {
        inventory = inventory.filter(item => item.id !== id);
        saveToStorage();
        updateUI();
    }

    function clearInventory() {
        inventory = [];
        saveToStorage();
        updateUI();
    }

    function updateUI() {
        renderTable();
        generateRescuePlan();
    }

    function renderTable() {
        const tbody = document.getElementById('inventoryTableBody');
        tbody.innerHTML = '';

        if (inventory.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: #7f8c8d; font-style: italic;">No items tracking</td></tr>`;
            return;
        }

        // Sort table display by expiry days ascending
        const sortedDisplay = [...inventory].sort((a, b) => a.expiry - b.expiry);

        sortedDisplay.forEach(item => {
            const tr = document.createElement('tr');

            const tagsHtml = item.constraints.map(t => `<span class="tag">${t}</span>`).join('');

            tr.innerHTML = `
                <strong>${item.name}</strong>
                <td>${item.location}</td>
                <td style="color: ${item.expiry <= 2 ? 'var(--accent-urgent)' : 'inherit'}; font-weight: ${item.expiry <= 2 ? 'bold' : 'normal'};">${item.expiry}d</td>
                <td>${item.portions}</td>
                <td>${tagsHtml}</td>
                <td><button class="delete-btn" onclick="deleteItem(${item.id})">&times;</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function generateRescuePlan() {
        const outputPanel = document.getElementById('outputPanel');

        if (inventory.length === 0) {
            outputPanel.innerHTML = '<div class="placeholder-text">Add ingredients to see your active rescue strategy auto-update here.</div>';
            return;
        }

        // Group into Tiers based on strict expiration criteria
        const tier1 = inventory.filter(i => i.expiry <= 2);
        const tier2 = inventory.filter(i => i.expiry > 2 && i.expiry <= 5);
        const tier3 = inventory.filter(i => i.expiry > 5);

        let html = `<h2>Active Rescue Strategy</h2><div class="subtitle">Live culinary configuration mapping current tracking items.</div>`;

        // Tier 1: Immediate Execution (0-2 Days Remaining)
        if (tier1.length > 0) {
            const combinedTier1 = tier1.map(i => {
                const tagStr = i.constraints.length ? ` (${i.constraints.join(', ')})` : '';
                return `<span>${i.portions} ${i.name}${tagStr}</span>`;
            }).join('');

            html += `
            <div class="timeline-section">
                <div class="timeline-header">
                    <span class="badge critical">Tier 1</span> Use Within 12-24 Hours (Critical)
                </div>
                <div class="recipe-card critical">
                    <div class="recipe-title">The "Zero-Waste" Priority Assembly</div>
                    <div class="used-ingredients"><strong>High Alert:</strong> ${combinedTier1}</div>
                    <ul class="instructions">
                        <li><strong>The Deployment:</strong> These items have reached their operational limit. Consolidate them directly into immediate meals (e.g., egg scrambles, loaded stir-fry, skillet bakes, or a rustic soup base).</li>
                        <li><strong>Tactical Adjustments:</strong> Combine any open dairy products or wilting greens together first. Cook down proteins thoroughly to lock in structural integrity.</li>
                    </ul>
                </div>
            </div>`;
        }

        // Tier 2: Mid-Range Defensive Strategies (3-5 Days Remaining)
        if (tier2.length > 0) {
            const combinedTier2 = tier2.map(i => `<span>${i.name} (${i.portions})</span>`).join('');

            html += `
            <div class="timeline-section">
                <div class="timeline-header">
                    <span class="badge warning">Tier 2</span> Next 2-3 Days Setup
                </div>
                <div class="recipe-card warning">
                    <div class="recipe-title">Defensive Cooking & Prep Ahead</div>
                    <div class="used-ingredients"><strong>Staggered Action:</strong> ${combinedTier2}</div>
                    <ul class="instructions">
                        <li><strong>Lifespan Extension:</strong> If any tracking items here are fresh produce or vegetables, roast them at 400°F (200°C) with oil and spices to alter their moisture footprint and buy another 4 days.</li>
                        <li><strong>Pantry Intersect:</strong> Deploy these items alongside your canned configurations or dry stocks to stretch volume into casseroles or foundational stews.</li>
                    </ul>
                </div>
            </div>`;
        }

        // Tier 3: High Stability / Flexibility (6+ Days Remaining)
        if (tier3.length > 0) {
            const combinedTier3 = tier3.map(i => `<span>${i.name}</span>`).join('');

            html += `
            <div class="timeline-section">
                <div class="timeline-header">
                    <span class="badge flex">Tier 3</span> Stable Strategic Reserve
                </div>
                <div class="recipe-card flex">
                    <div class="recipe-title">Pantry Buffer & Preservation Timing</div>
                    <div class="used-ingredients"><strong>Flexible:</strong> ${combinedTier3}</div>
                    <ul class="instructions">
                        <li><strong>Standby Status:</strong> Leave unopened cans, cured products, or resilient items in place until Priority 1 and 2 items have been fully cleared from rotation.</li>
                        <li><strong>Pre-emptive Action:</strong> If you realize your schedule won't allow you to execute Priority 2 items later this week, migrate these Tier 3 items to the freezer immediately to halt the timeline.</li>
                    </ul>
                </div>
            </div>`;
        }

        outputPanel.innerHTML = html;
    }
</script>

</body>
</html>
