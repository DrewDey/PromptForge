<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantry Sub Helper</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --success: #4ade80;
            --warning: #facc15;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            max-width: 390px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.35rem;
            margin-bottom: 12px;
            text-align: center;
            color: var(--accent);
        }

        .section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%;
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background: var(--accent-hover);
        }

        .card {
            background: var(--bg);
            border-left: 4px solid var(--border);
            padding: 10px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 10px;
        }

        .card.high { border-left-color: var(--success); }
        .card.medium { border-left-color: var(--warning); }
        .card.low { border-left-color: var(--danger); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .high .badge { background: rgba(74, 222, 128, 0.2); color: var(--success); }
        .medium .badge { background: rgba(250, 204, 21, 0.2); color: var(--warning); }
        .low .badge { background: rgba(248, 113, 113, 0.2); color: var(--danger); }

        .card-ratio {
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .card-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .error-message {
            color: var(--danger);
            font-size: 0.9rem;
        }

        .output-box {
            background: var(--bg);
            border: 1px dashed var(--border);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <h1>Pantry Sub Helper</h1>

    <div class="section">
        <label for="target">Target Ingredient</label>
        <input type="text" id="target" placeholder="e.g., Buttermilk, Eggs, Soy Sauce">

        <label for="pantry">Your Pantry Options (comma separated)</label>
        <textarea id="pantry" rows="2" placeholder="e.g., Milk, Lemon juice, Yogurt, Tamari, Mayo"></textarea>

        <label for="cautions">Diet/Allergy Cautions (comma separated)</label>
        <input type="text" id="cautions" placeholder="e.g., Dairy-free, Gluten-free, Vegan">

        <button id="analyzeBtn">Analyze Options</button>
    </div>

    <div id="resultsSection" class="section" style="display: none;">
        <label>Confidence Cards</label>
        <div id="cardsContainer"></div>

        <label>Generated Lists</label>
        <div id="outputList" class="output-box"></div>
        <button id="copyBtn" class="copy-btn">Copy Lists to Clipboard</button>
    </div>

    <script>
        const subDatabase = {
            "buttermilk": [
                { sub: "milk + lemon juice/vinegar", ratio: "1 cup milk + 1 tbsp acid", confidence: "high", tags: ["veg"], flags: ["dairy"] },
                { sub: "yogurt", ratio: "3/4 cup yogurt + 1/4 cup water", confidence: "high", tags: ["veg"], flags: ["dairy"] }
            ],
            "eggs": [
                { sub: "mayo", ratio: "3 tbsp per egg", confidence: "medium", tags: ["veg"], flags: ["egg"] },
                { sub: "applesauce", ratio: "1/4 cup per egg", confidence: "medium", tags: ["vegan", "veg", "dairy-free", "gluten-free"], flags: [] },
                { sub: "flax egg", ratio: "1 tbsp ground flax + 3 tbsp water", confidence: "high", tags: ["vegan", "veg", "dairy-free", "gluten-free"], flags: [] }
            ],
            "soy sauce": [
                { sub: "tamari", ratio: "1:1 replacement", confidence: "high", tags: ["vegan", "veg", "dairy-free"], flags: ["soy"] },
                { sub: "coconut aminos", ratio: "1:1 replacement (slightly sweeter)", confidence: "high", tags: ["vegan", "veg", "dairy-free", "soy-free", "gluten-free"], flags: [] }
            ],
            "heavy cream": [
                { sub: "milk + butter", ratio: "3/4 cup milk + 1/4 cup melted butter", confidence: "high", tags: ["veg"], flags: ["dairy"] },
                { sub: "coconut milk (full fat)", ratio: "1:1 replacement", confidence: "high", tags: ["vegan", "veg", "dairy-free", "gluten-free"], flags: [] }
            ]
        };

        function normalize(str) {
            return str.toLowerCase().trim();
        }

        function analyzeSubstitutions() {
            const targetInput = document.getElementById('target').value;
            const target = normalize(targetInput);
            const pantry = document.getElementById('pantry').value.split(',').map(normalize);
            const cautions = document.getElementById('cautions').value.split(',').map(normalize);

            const container = document.getElementById('cardsContainer');
            const outputList = document.getElementById('outputList');
            const resultsSection = document.getElementById('resultsSection');

            container.textContent = '';
            
            let matches = subDatabase[target] || [];
            
            if (matches.length === 0 && target) {
                matches = [
                    { sub: "Check general ratio rules", ratio: "Varies by application", confidence: "low", tags: [], flags: [] }
                ];
            }

            let bestSub = null;
            let validCardCount = 0;

            matches.forEach(item => {
                let conflict = false;
                cautions.forEach(caution => {
                    if (caution && (item.flags.includes(caution) || (caution.includes('free') && item.flags.some(f => caution.includes(f))))) {
                        conflict = true;
                    }
                });

                if (conflict) return;

                validCardCount++;
                const inPantry = pantry.some(p => p && (item.sub.includes(p) || p.includes(item.sub)));
                
                if (inPantry && !bestSub) {
                    bestSub = item;
                }

                const card = document.createElement('div');
                card.classList.add('card', item.confidence);

                const cardHeader = document.createElement('div');
                cardHeader.classList.add('card-header');

                const nameSpan = document.createElement('span');
                nameSpan.textContent = item.sub.toUpperCase();

                const badgeSpan = document.createElement('span');
                badgeSpan.classList.add('badge');
                badgeSpan.textContent = `${item.confidence} match`;

                cardHeader.appendChild(nameSpan);
                cardHeader.appendChild(badgeSpan);

                const ratioDiv = document.createElement('div');
                ratioDiv.classList.add('card-ratio');
                ratioDiv.textContent = `Ratio: ${item.ratio}`;

                const statusDiv = document.createElement('div');
                statusDiv.classList.add('card-status');
                statusDiv.textContent = inPantry ? '✅ Available in pantry' : '❌ Missing from pantry';

                card.appendChild(cardHeader);
                card.appendChild(ratioDiv);
                card.appendChild(statusDiv);
                container.appendChild(card);
            });

            if (validCardCount === 0) {
                const noOptionsEl = document.createElement('p');
                noOptionsEl.classList.add('error-message');
                noOptionsEl.textContent = 'No safe options found based on diet/allergy restrictions.';
                container.appendChild(noOptionsEl);
            }

            let textOutput = '';
            if (bestSub) {
                textOutput += `RECIPE ADJUSTMENTS:\n- Use ${bestSub.sub} instead of ${targetInput}.\n- Adjustment ratio: ${bestSub.ratio}.\n\n`;
                textOutput += `GROCERY LIST:\n- No immediate items needed for substitution.`;
            } else if (matches.length > 0 && target && validCardCount > 0) {
                textOutput += `RECIPE ADJUSTMENTS:\n- Dynamic adjustment needed for ${targetInput}.\n\n`;
                textOutput += `GROCERY LIST:\n- Buy ingredients for alternative: ${matches[0].sub} (Ratio: ${matches[0].ratio})`;
            } else {
                textOutput += `GROCERY LIST:\n- ${targetInput || 'Specify target ingredient'}`;
            }

            outputList.textContent = textOutput;
            resultsSection.style.display = 'block';
        }

        function copyToClipboard() {
            const text = document.getElementById('outputList').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Lists copied to clipboard!');
            }).catch(() => {
                alert('Failed to copy text.');
            });
        }

        document.getElementById('analyzeBtn').addEventListener('click', analyzeSubstitutions);
        document.getElementById('copyBtn').addEventListener('click', copyToClipboard);
    </script>
</body>
</html>
