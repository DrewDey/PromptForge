<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pocket Pirate Map Puzzle</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;
  background:radial-gradient(circle at top,#4b2e16,#17100a 72%);
  color:#2b1a0d;display:grid;place-items:center;padding:12px;overflow-x:hidden;
}
.game{
  width:min(440px,100%);background:#ead19a;border:5px solid #3b210f;
  border-radius:22px;box-shadow:0 18px 45px #0009;overflow:hidden;
}
header{
  padding:14px;text-align:center;background:linear-gradient(#b87530,#7d431d);
  color:#fff0c0;border-bottom:4px solid #3b210f;
}
h1{margin:0;font-size:1.35rem}
.sub{font-size:.85rem;opacity:.95;margin-top:4px}
.panel{padding:12px}
.status,.cluebox,.decoder{
  background:#fff0c9;border:2px solid #8a5728;border-radius:14px;padding:10px;
}
.status{border-style:dashed;font-size:.92rem;line-height:1.35;margin-bottom:12px}
.map{
  display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#7d431d;
  border:4px solid #3b210f;border-radius:16px;padding:7px;touch-action:manipulation;
}
.cell{
  aspect-ratio:1;border:0;border-radius:10px;background:#f6dfaa;color:#3b210f;
  font-size:1.45rem;font-weight:bold;cursor:pointer;position:relative;
}
.cell.start{background:#a9d08e}
.cell.treasure{background:#ffd966}
.cell.path{background:#8ecae6}
.cell.preview{outline:4px solid #5d8aa8}
.cell.wrong{background:#d65a31;color:white}
.cell::after{
  content:attr(data-step);position:absolute;right:5px;bottom:3px;font-size:.7rem;color:#3b210f;
}
.cluebox,.decoder{margin-top:12px}
.label{font-weight:bold;margin-bottom:6px}
.symbols{font-size:1.55rem;letter-spacing:5px;line-height:1.7;word-break:break-word}
.mapName{font-size:.9rem;font-weight:bold;margin-bottom:6px;color:#5a3217}
.decoderGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dial{
  border:2px solid #8a5728;background:#f6dfaa;border-radius:12px;padding:8px;text-align:center;
}
.glyph{font-size:1.7rem;display:block;margin-bottom:4px}
.dial button,.action{
  width:100%;border:0;border-radius:10px;padding:9px;background:#3b210f;
  color:#ffe3a0;font-weight:bold;cursor:pointer;
}
.hint{font-size:.85rem;margin-top:8px;opacity:.85;line-height:1.3}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.action{border-radius:12px;padding:11px;font-size:.95rem}
.win{
  display:none;margin-top:12px;background:#244f26;color:#fff6c9;border-radius:14px;
  padding:12px;text-align:center;font-weight:bold;
}
@media(max-width:390px){
  body{padding:8px}.panel{padding:10px}.cell{font-size:1.25rem}
  .symbols{font-size:1.35rem;letter-spacing:3px}.decoderGrid{gap:6px}
}
</style>
</head>
<body>
<div class="game">
<header>
  <h1>🏴‍☠️ Pocket Pirate Map</h1>
  <div class="sub">Decode the glyphs, trace the route, claim the chest.</div>
</header>

<main class="panel">
  <div class="status" id="status"></div>
  <div class="map" id="map"></div>

  <div class="cluebox">
    <div class="mapName" id="mapName"></div>
    <div class="label" id="clueText"></div>
    <div class="symbols" id="routeSymbols"></div>
  </div>

  <div class="decoder">
    <div class="label">Decoder dials:</div>
    <div class="decoderGrid" id="decoderGrid"></div>
    <div class="hint">Rotate each glyph’s meaning. A valid decoded trail previews on the map.</div>
  </div>

  <div class="buttons">
    <button class="action" onclick="resetPath()">Reset Route</button>
    <button class="action" onclick="newMap()">New Map</button>
  </div>

  <div class="win" id="win">Treasure found! The chest is yours. 💰</div>
</main>
</div>

<script>
const mapEl=document.getElementById("map");
const statusEl=document.getElementById("status");
const routeSymbolsEl=document.getElementById("routeSymbols");
const decoderGridEl=document.getElementById("decoderGrid");
const winEl=document.getElementById("win");
const mapNameEl=document.getElementById("mapName");
const clueTextEl=document.getElementById("clueText");

const maps=[
  {
    name:"Map 1: Parrot Cove",
    clue:"The parrot scratched this route into driftwood:",
    route:["R","R","D","D","L","D","R","R"],
    glyphs:["☀","🌙","🦜","⭐"],
    terrain:["🌴","🪨","🐚","⚓","🦀","💀","🌊","🗿","☠️"]
  },
  {
    name:"Map 2: Skull Reef",
    clue:"The old captain marked this one in reef signs:",
    route:["D","D","R","R","U","R","D","L"],
    glyphs:["💀","🐚","🔥","⚓"],
    terrain:["🌊","🦀","🪨","🐚","⚓","🌴","☠️","🗿","🦑"]
  },
  {
    name:"Map 3: Moonlit Lagoon",
    clue:"The moon map hides the route in night symbols:",
    route:["R","D","D","R","U","R","D","D"],
    glyphs:["🌙","⭐","🦉","🕯️"],
    terrain:["🌴","🌊","🪨","🐚","🦀","🗿","⚓","☠️","🦜"]
  }
];

const dirs=["U","R","D","L"];
const dirNames=["Up","Right","Down","Left"];
const arrows={U:"↑",R:"→",D:"↓",L:"←"};
const moves={U:[-1,0],R:[0,1],D:[1,0],L:[0,-1]};

let mapIndex=-1,currentMap,trueRoute,encodedRoute=[],decoder={},cells=[],currentStep=0,solvedPreview=[];

function posToIndex(r,c){return r*5+c}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

function positionsFromRoute(route){
  let r=0,c=0,positions=[[r,c]];
  for(const d of route){
    r+=moves[d][0];c+=moves[d][1];
    if(r<0||r>4||c<0||c>4)return null;
    positions.push([r,c]);
  }
  return positions;
}
function truePositions(){return positionsFromRoute(trueRoute)}

function buildCells(){
  cells=Array.from({length:25},()=>({
    icon:currentMap.terrain[Math.floor(Math.random()*currentMap.terrain.length)],
    state:"",step:""
  }));
}

function setupCipher(){
  const shuffled=shuffle(currentMap.glyphs);
  const trueMap={};
  dirs.forEach((d,i)=>trueMap[d]=shuffled[i]);
  encodedRoute=trueRoute.map(d=>trueMap[d]);

  decoder={};
  currentMap.glyphs.forEach((g,i)=>{
    decoder[g]=dirs[(i+1+Math.floor(Math.random()*3))%4];
  });
}

function decodedDirections(){return encodedRoute.map(g=>decoder[g])}

function checkPreview(){
  const positions=positionsFromRoute(decodedDirections());
  if(!positions){solvedPreview=[];return false}
  const final=positions.at(-1),treasure=truePositions().at(-1);
  const valid=final[0]===treasure[0]&&final[1]===treasure[1];
  solvedPreview=valid?positions:[];
  return valid;
}

function renderDecoder(){
  decoderGridEl.innerHTML="";
  currentMap.glyphs.forEach(g=>{
    const card=document.createElement("div");
    card.className="dial";
    card.innerHTML=`<span class="glyph">${g}</span><button>${arrows[decoder[g]]} ${dirNames[dirs.indexOf(decoder[g])]}</button>`;
    card.querySelector("button").onclick=()=>rotateGlyph(g);
    decoderGridEl.appendChild(card);
  });
}

function render(){
  mapEl.innerHTML="";
  const tPos=truePositions(),startIndex=0,treasure=tPos.at(-1),treasureIndex=posToIndex(treasure[0],treasure[1]);
  const previews=new Set(solvedPreview.map(p=>posToIndex(p[0],p[1])));

  cells.forEach((cell,i)=>{
    const btn=document.createElement("button");
    btn.className="cell";
    btn.textContent=cell.icon;
    btn.dataset.step=cell.step||"";
    if(previews.has(i)&&i!==startIndex&&!cell.state)btn.classList.add("preview");
    if(i===startIndex){btn.classList.add("start");btn.textContent="🧭"}
    if(i===treasureIndex){btn.classList.add("treasure");btn.textContent="💰"}
    if(cell.state)btn.classList.add(cell.state);
    btn.onclick=()=>tapCell(i);
    mapEl.appendChild(btn);
  });

  mapNameEl.textContent=currentMap.name;
  clueTextEl.textContent=currentMap.clue;
  routeSymbolsEl.textContent=encodedRoute.join(" ");
  renderDecoder();
}

function rotateGlyph(g){
  decoder[g]=dirs[(dirs.indexOf(decoder[g])+1)%4];
  resetPath(false);
  const valid=checkPreview();
  statusEl.textContent=valid
    ?"The decoded trail reaches the chest. Trace the highlighted route."
    :"That route misses the treasure. Keep rotating the glyph meanings.";
  render();
}

function tapCell(index){
  if(!checkPreview()){
    statusEl.textContent="Decode the glyphs first. The route must preview before tracing.";
    render();
    return;
  }
  if(currentStep>=trueRoute.length)return;

  const needed=solvedPreview[currentStep+1];
  const neededIndex=posToIndex(needed[0],needed[1]);

  if(index===neededIndex){
    currentStep++;
    cells[index].state="path";
    cells[index].step=currentStep;
    statusEl.textContent=currentStep===trueRoute.length
      ?"X marks the spot. You solved this treasure map."
      :`Correct. Step ${currentStep} of ${trueRoute.length} traced.`;
    if(currentStep===trueRoute.length)winEl.style.display="block";
  }else{
    cells[index].state="wrong";
    statusEl.textContent="Wrong turn. Reset and follow the decoded trail.";
  }
  render();
}

function resetPath(showMessage=true){
  currentStep=0;
  winEl.style.display="none";
  cells.forEach(c=>{c.state="";c.step=""});
  if(showMessage)statusEl.textContent="Route cleared. Decode and trace again from the compass.";
  render();
}

function newMap(){
  mapIndex=(mapIndex+1)%maps.length;
  currentMap=maps[mapIndex];
  trueRoute=currentMap.route;
  buildCells();
  setupCipher();
  currentStep=0;
  solvedPreview=[];
  winEl.style.display="none";
  statusEl.textContent=`${currentMap.name} drawn. Rotate the glyphs until the route reaches the treasure.`;
  checkPreview();
  render();
}

newMap();
</script>
</body>
</html>
