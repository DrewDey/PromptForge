<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Tiny Rally Time Trial</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #101010;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: white;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #151515;
  }
  .hud {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    pointer-events: none;
    font-weight: 850;
    text-shadow: 0 2px 8px #000;
    z-index: 3;
  }
  .panel {
    background: rgba(0,0,0,.48);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 16px;
    padding: 9px 12px;
    backdrop-filter: blur(8px);
    min-width: 80px;
  }
  .small {
    font-size: 11px;
    opacity: .7;
    font-weight: 800;
    letter-spacing: .04em;
  }
  .big {
    font-size: clamp(17px, 4vw, 28px);
    line-height: 1.05;
  }
  .rightPanel {
    text-align: right;
  }
  .center {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 22px;
    z-index: 4;
    background: radial-gradient(circle, rgba(255,255,255,.07), rgba(0,0,0,.76));
  }
  .card {
    width: min(590px, 100%);
    background: rgba(10,10,10,.9);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 24px 80px rgba(0,0,0,.55);
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(30px, 8vw, 54px);
    letter-spacing: -1px;
  }
  p {
    margin: 8px 0;
    color: rgba(255,255,255,.83);
    line-height: 1.45;
  }
  .medals {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 16px 0 6px;
  }
  .medal {
    border-radius: 14px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    padding: 10px;
    font-weight: 900;
    text-align: center;
  }
  .medal span {
    display: block;
    font-size: 12px;
    opacity: .72;
    margin-top: 3px;
  }
  button {
    border: 0;
    border-radius: 16px;
    padding: 14px 18px;
    margin-top: 14px;
    font-weight: 900;
    font-size: 16px;
    background: #ffd84d;
    color: #1b1600;
    cursor: pointer;
    width: 100%;
  }
  .touch {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 14px;
    display: none;
    justify-content: space-between;
    align-items: end;
    padding: 0 16px;
    z-index: 5;
    pointer-events: none;
  }
  .pad, .pedals {
    display: grid;
    gap: 10px;
    pointer-events: auto;
  }
  .pad { grid-template-columns: 62px 62px; }
  .pedals { grid-template-columns: 72px; }
  .touch button {
    width: auto;
    height: 58px;
    margin: 0;
    padding: 0;
    border-radius: 18px;
    background: rgba(255,255,255,.16);
    color: white;
    border: 1px solid rgba(255,255,255,.24);
    backdrop-filter: blur(8px);
    font-size: 22px;
  }
  .touch .gas {
    height: 82px;
    background: rgba(255,216,77,.28);
  }
  @media (pointer: coarse), (max-width: 800px) {
    .touch { display: flex; }
    .hud { gap: 7px; }
    .panel { padding: 8px 9px; min-width: 65px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="panel">
    <div class="small">TIME</div>
    <div class="big" id="time">0.00</div>
  </div>
  <div class="panel">
    <div class="small">SPLIT</div>
    <div class="big" id="split">--</div>
  </div>
  <div class="panel">
    <div class="small">NEXT</div>
    <div class="big" id="cp">1 / 7</div>
  </div>
  <div class="panel rightPanel">
    <div class="small">BEST</div>
    <div class="big" id="best">--</div>
  </div>
</div>

<div class="center" id="overlay">
  <div class="card">
    <h1>Tiny Rally v2</h1>
    <p>Follow the painted racing line, chase the arrow, and hit each checkpoint in order.</p>
    <p><b>Keyboard</b> arrows or WASD. Space brakes. R restarts.</p>
    <p><b>Phone</b> use the touch steering and pedals.</p>
    <div class="medals">
      <div class="medal">🥉 Bronze<span>32.00s</span></div>
      <div class="medal">🥈 Silver<span>27.00s</span></div>
      <div class="medal">🥇 Gold<span>23.50s</span></div>
    </div>
    <button id="startBtn">Start run</button>
  </div>
</div>

<div class="touch">
  <div class="pad">
    <button data-key="left">◀</button>
    <button data-key="right">▶</button>
  </div>
  <div class="pedals">
    <button class="gas" data-key="up">▲</button>
    <button data-key="down">▼</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const timeEl = document.getElementById("time");
  const cpEl = document.getElementById("cp");
  const bestEl = document.getElementById("best");
  const splitEl = document.getElementById("split");
  const overlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");

  let W = 0, H = 0, scale = 1;

  function resize() {
    W = canvas.width = Math.floor(innerWidth * devicePixelRatio);
    H = canvas.height = Math.floor(innerHeight * devicePixelRatio);
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
    scale = Math.min(W / 980, H / 680);
  }
  addEventListener("resize", resize);
  resize();

  CanvasRenderingContext2D.prototype.roundRect ||= function(x, y, w, h, r) {
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };

  const medals = [
    { name: "Gold", t: 23.5, icon: "🥇" },
    { name: "Silver", t: 27, icon: "🥈" },
    { name: "Bronze", t: 32, icon: "🥉" }
  ];

  const bestKey = "tinyRallyBestV2";
  let best = Number(localStorage.getItem(bestKey) || 0);

  const keys = { up:false, down:false, left:false, right:false };
  const car = { x: 145, y: 520, a: -0.55, v: 0, trail: [] };
  const start = { x: 145, y: 520, a: -0.55 };

  const route = [
    { x: 145, y: 520 },
    { x: 210, y: 360 },
    { x: 365, y: 255 },
    { x: 555, y: 210 },
    { x: 780, y: 285 },
    { x: 835, y: 480 },
    { x: 650, y: 585 },
    { x: 390, y: 550 },
    { x: 210, y: 430 },
    { x: 145, y: 520 }
  ];

  const checkpoints = [
    { x: 210, y: 360, r: 34, target: 4.2 },
    { x: 365, y: 255, r: 34, target: 7.4 },
    { x: 555, y: 210, r: 34, target: 10.5 },
    { x: 780, y: 285, r: 34, target: 14.0 },
    { x: 835, y: 480, r: 34, target: 17.8 },
    { x: 650, y: 585, r: 34, target: 20.8 },
    { x: 390, y: 550, r: 34, target: 23.5 }
  ];

  const scenery = Array.from({ length: 95 }, (_, i) => ({
    x: (i * 137) % 1120 - 90,
    y: (i * 89) % 800 - 60,
    r: 3 + (i % 7),
    kind: i % 5
  }));

  let running = false;
  let done = false;
  let cp = 0;
  let t0 = 0;
  let elapsed = 0;
  let lastCpTime = 0;
  let splitText = "--";
  let message = "";
  let subMessage = "";
  let msgTimer = 0;

  function fmt(n) {
    return n.toFixed(2);
  }

  function medalFor(t) {
    if (t <= medals[0].t) return medals[0];
    if (t <= medals[1].t) return medals[1];
    if (t <= medals[2].t) return medals[2];
    return { name: "No medal", icon: "⏱️", t: Infinity };
  }

  function nextMedalText(t) {
    if (t <= medals[0].t) return "Gold pace. Now shave tenths.";
    if (t <= medals[1].t) return "Next target: Gold at 23.50s.";
    if (t <= medals[2].t) return "Next target: Silver at 27.00s.";
    return "Next target: Bronze at 32.00s.";
  }

  function updateHud() {
    timeEl.textContent = fmt(elapsed);
    cpEl.textContent = (Math.min(cp + 1, checkpoints.length)) + " / " + checkpoints.length;
    bestEl.textContent = best ? fmt(best) : "--";
    splitEl.textContent = splitText;
  }

  function reset(startNow = true) {
    car.x = start.x;
    car.y = start.y;
    car.a = start.a;
    car.v = 0;
    car.trail = [];
    cp = 0;
    elapsed = 0;
    lastCpTime = 0;
    splitText = "--";
    done = false;
    message = "";
    subMessage = "";
    msgTimer = 0;
    running = startNow;
    t0 = performance.now();
    overlay.style.display = startNow ? "none" : "grid";
    updateHud();
  }

  startBtn.onclick = () => reset(true);

  addEventListener("keydown", e => {
    if (["ArrowUp","w","W"].includes(e.key)) keys.up = true;
    if (["ArrowDown","s","S"," "].includes(e.key)) keys.down = true;
    if (["ArrowLeft","a","A"].includes(e.key)) keys.left = true;
    if (["ArrowRight","d","D"].includes(e.key)) keys.right = true;
    if (["r","R"].includes(e.key)) reset(true);
    if (!running && e.key === "Enter") reset(true);
  });

  addEventListener("keyup", e => {
    if (["ArrowUp","w","W"].includes(e.key)) keys.up = false;
    if (["ArrowDown","s","S"," "].includes(e.key)) keys.down = false;
    if (["ArrowLeft","a","A"].includes(e.key)) keys.left = false;
    if (["ArrowRight","d","D"].includes(e.key)) keys.right = false;
  });

  document.querySelectorAll(".touch button").forEach(btn => {
    const k = btn.dataset.key;
    const on = e => { e.preventDefault(); keys[k] = true; };
    const off = e => { e.preventDefault(); keys[k] = false; };
    btn.addEventListener("pointerdown", on);
    btn.addEventListener("pointerup", off);
    btn.addEventListener("pointercancel", off);
    btn.addEventListener("pointerleave", off);
  });

  function worldToScreen(x, y) {
    const ox = W / 2 - car.x * scale;
    const oy = H / 2 - car.y * scale;
    return { x: ox + x * scale, y: oy + y * scale };
  }

  function withWorld(fn) {
    ctx.save();
    ctx.scale(scale, scale);
    ctx.translate(W / 2 / scale - car.x, H / 2 / scale - car.y);
    fn();
    ctx.restore();
  }

  function drawRibbon(points, width, color, dash = null) {
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length - 1; i++) {
      const mx = (points[i].x + points[i + 1].x) / 2;
      const my = (points[i].y + points[i + 1].y) / 2;
      ctx.quadraticCurveTo(points[i].x, points[i].y, mx, my);
    }
    ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
    ctx.stroke();
    ctx.restore();
  }

  function drawTrack() {
    withWorld(() => {
      ctx.fillStyle = "#244323";
      ctx.fillRect(-450, -350, 1900, 1300);

      scenery.forEach(s => {
        if (s.kind === 0) {
          ctx.fillStyle = "rgba(8,25,10,.55)";
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r + 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(28,78,31,.85)";
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r + 3, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = "rgba(0,0,0,.16)";
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      drawRibbon(route, 178, "#2f2924");
      drawRibbon(route, 148, "#665d52");
      drawRibbon(route, 122, "#766d61");
      drawRibbon(route, 6, "rgba(255,255,255,.20)", [18, 20]);

      drawRibbon(route, 3, "rgba(255,216,77,.38)", [34, 26]);

      ctx.strokeStyle = "rgba(255,255,255,.35)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(106, 485);
      ctx.lineTo(177, 545);
      ctx.stroke();

      for (let i = 0; i < 8; i++) {
        ctx.fillStyle = i % 2 ? "#111" : "#fff";
        ctx.fillRect(108 + i * 8, 486 + i * 7, 10, 12);
      }

      route.slice(1, -1).forEach((p, i) => {
        ctx.fillStyle = "rgba(255,255,255,.18)";
        ctx.font = "900 18px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(i + 1, p.x, p.y - 52);
      });
    });
  }

  function drawCheckpoints() {
    checkpoints.forEach((c, i) => {
      const p = worldToScreen(c.x, c.y);
      const active = i === cp;
      const cleared = i < cp;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(scale, scale);
      ctx.globalAlpha = cleared ? .2 : 1;

      ctx.fillStyle = active ? "rgba(255,216,77,.20)" : "rgba(255,255,255,.08)";
      ctx.strokeStyle = active ? "#ffd84d" : "rgba(255,255,255,.72)";
      ctx.lineWidth = active ? 7 : 4;

      ctx.beginPath();
      ctx.arc(0, 0, c.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (active) {
        ctx.strokeStyle = "rgba(255,216,77,.36)";
        ctx.lineWidth = 17;
        ctx.beginPath();
        ctx.arc(0, 0, c.r + 13 + Math.sin(performance.now() / 120) * 5, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = active ? "#ffd84d" : "#fff";
      ctx.font = "900 26px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(i + 1, 0, 1);
      ctx.restore();
    });
  }

  function drawNextArrow() {
    if (done || cp >= checkpoints.length) return;
    const c = checkpoints[cp];
    const dx = c.x - car.x;
    const dy = c.y - car.y;
    const ang = Math.atan2(dy, dx);
    const dist = Math.hypot(dx, dy);

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(ang);
    ctx.translate(0, -68 * scale);

    ctx.fillStyle = "rgba(0,0,0,.38)";
    ctx.beginPath();
    ctx.roundRect(24 * scale, -22 * scale, 120 * scale, 44 * scale, 16 * scale);
    ctx.fill();

    ctx.fillStyle = "#ffd84d";
    ctx.beginPath();
    ctx.moveTo(70 * scale, 0);
    ctx.lineTo(25 * scale, -22 * scale);
    ctx.lineTo(34 * scale, -7 * scale);
    ctx.lineTo(-12 * scale, -7 * scale);
    ctx.lineTo(-12 * scale, 7 * scale);
    ctx.lineTo(34 * scale, 7 * scale);
    ctx.lineTo(25 * scale, 22 * scale);
    ctx.closePath();
    ctx.fill();

    ctx.rotate(-ang);
    ctx.fillStyle = "#fff";
    ctx.font = `900 ${Math.max(13, 15 * scale)}px system-ui`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(Math.round(dist) + "m", 84 * scale, 0);
    ctx.restore();
  }

  function drawCar() {
    const p = worldToScreen(car.x, car.y);

    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.18)";
    ctx.lineWidth = 3 * scale;
    ctx.beginPath();
    for (let i = 0; i < car.trail.length; i++) {
      const q = worldToScreen(car.trail[i].x, car.trail[i].y);
      if (i === 0) ctx.moveTo(q.x, q.y);
      else ctx.lineTo(q.x, q.y);
    }
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(car.a);
    ctx.scale(scale, scale);

    ctx.fillStyle = "rgba(0,0,0,.38)";
    ctx.fillRect(-17, -11, 36, 24);

    ctx.fillStyle = "#e74b3c";
    ctx.beginPath();
    ctx.roundRect(-17, -11, 34, 22, 6);
    ctx.fill();

    ctx.fillStyle = "#ffd84d";
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.lineTo(4, -8);
    ctx.lineTo(4, 8);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.fillRect(-5, -7, 9, 14);
    ctx.restore();
  }

  function drawMessage() {
    if (!message || msgTimer <= 0) return;

    ctx.save();
    ctx.globalAlpha = Math.min(1, msgTimer / 30);
    ctx.fillStyle = "rgba(0,0,0,.62)";
    ctx.beginPath();
    ctx.roundRect(W / 2 - 210, H * .22 - 42, 420, 84, 20);
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.font = `900 ${Math.max(22, 30 * scale)}px system-ui`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(message, W / 2, H * .22 - 10);

    if (subMessage) {
      ctx.fillStyle = "rgba(255,255,255,.74)";
      ctx.font = `800 ${Math.max(13, 15 * scale)}px system-ui`;
      ctx.fillText(subMessage, W / 2, H * .22 + 22);
    }

    ctx.restore();
  }

  function physics(dt) {
    if (!running || done) return;

    const accel = keys.up ? 255 : 0;
    const brake = keys.down ? 355 : 0;

    car.v += accel * dt;
    car.v -= brake * dt * Math.sign(car.v || 1);
    car.v *= Math.pow(.985, dt * 60);
    car.v = Math.max(-125, Math.min(365, car.v));

    const steer = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const grip = Math.min(1, Math.abs(car.v) / 180);
    car.a += steer * grip * 3.25 * dt * (car.v >= 0 ? 1 : -1);

    car.x += Math.cos(car.a) * car.v * dt;
    car.y += Math.sin(car.a) * car.v * dt;

    car.trail.push({ x: car.x, y: car.y });
    if (car.trail.length > 90) car.trail.shift();

    elapsed = (performance.now() - t0) / 1000;

    const c = checkpoints[cp];
    const d = Math.hypot(car.x - c.x, car.y - c.y);

    if (d < c.r) {
      const segment = elapsed - lastCpTime;
      const targetSegment = cp === 0 ? c.target : c.target - checkpoints[cp - 1].target;
      const delta = segment - targetSegment;
      splitText = (delta <= 0 ? "-" : "+") + fmt(Math.abs(delta));

      cp++;
      lastCpTime = elapsed;

      if (cp >= checkpoints.length) {
        running = false;
        done = true;

        const oldBest = best;
        const medal = medalFor(elapsed);
        let resultLine = `${medal.icon} ${medal.name}`;

        if (!best || elapsed < best) {
          best = elapsed;
          localStorage.setItem(bestKey, String(best));
          message = oldBest ? "NEW BEST" : "FIRST TIME SET";
          subMessage = oldBest ? `${fmt(oldBest - best)}s faster` : resultLine;
        } else {
          message = resultLine;
          subMessage = `${fmt(elapsed - best)}s off your best`;
        }

        msgTimer = 190;

        setTimeout(() => {
          overlay.style.display = "grid";
          overlay.querySelector("h1").textContent = `${medal.icon} ${fmt(elapsed)}s`;
          overlay.querySelectorAll("p")[0].innerHTML =
            `Best <b>${fmt(best)}</b>. ${nextMedalText(elapsed)}`;
          overlay.querySelectorAll("p")[1].innerHTML =
            `Last split <b>${splitText}</b>. Cleaner exits matter more than raw speed.`;
          overlay.querySelectorAll("p")[2].innerHTML =
            `Press <b>R</b> or tap below to run again.`;
          startBtn.textContent = "Retry";
        }, 900);
      } else {
        message = delta <= 0 ? "GOOD SPLIT" : "SLOW SPLIT";
        subMessage = splitText + " vs checkpoint target";
        msgTimer = 62;
      }
    }

    msgTimer--;
    updateHud();
  }

  let last = performance.now();

  function loop(now) {
    const dt = Math.min(.033, (now - last) / 1000);
    last = now;

    physics(dt);

    ctx.clearRect(0, 0, W, H);
    drawTrack();
    drawCheckpoints();
    drawNextArrow();
    drawCar();
    drawMessage();

    requestAnimationFrame(loop);
  }

  reset(false);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
