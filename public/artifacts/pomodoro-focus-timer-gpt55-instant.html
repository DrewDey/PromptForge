<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pomodoro Focus Timer</title>
<script
  src="/artifacts/pathforge-artifact-banner.js"
  data-pathforge-title="Pomodoro Focus Timer"
  data-pathforge-provider="GPT 5.5 Instant"
  data-pathforge-path="/pomodoro-timer-demo"
  defer
></script>
<style>
* {
box-sizing: border-box;
}

:root {
--bg: #0b1020;
--card: rgba(18, 25, 46, 0.88);
--card-border: rgba(255, 255, 255, 0.09);
--text: #f7f8fb;
--muted: #9ca8bd;
--muted-2: #6f7c91;
--accent: #8b5cf6;
--accent-2: #22d3ee;
--input: rgba(255, 255, 255, 0.06);
--input-border: rgba(255, 255, 255, 0.12);
--button: #f7f8fb;
--button-text: #111827;
--button-secondary: rgba(255, 255, 255, 0.08);
--button-secondary-text: #f7f8fb;
--ring-bg: rgba(255, 255, 255, 0.09);
}

body {
margin: 0;
min-height: 100vh;
display: grid;
place-items: center;
padding: 24px;
font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
background:
radial-gradient(circle at top left, rgba(139, 92, 246, 0.28), transparent 34%),
radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.18), transparent 34%),
var(--bg);
color: var(--text);
}

.timer-card {
width: min(460px, 100%);
padding: clamp(24px, 6vw, 38px);
text-align: center;
background: var(--card);
border: 1px solid var(--card-border);
border-radius: 28px;
box-shadow: 0 26px 70px rgba(0, 0, 0, 0.34);
backdrop-filter: blur(18px);
}

h1 {
margin: 0;
font-size: clamp(28px, 7vw, 38px);
font-weight: 800;
letter-spacing: -0.05em;
}

.mode {
margin-top: 10px;
margin-bottom: 24px;
font-size: 15px;
color: var(--muted);
font-weight: 650;
letter-spacing: 0.08em;
text-transform: uppercase;
}

.settings {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
margin-bottom: 24px;
}

label {
display: flex;
flex-direction: column;
gap: 8px;
text-align: left;
font-size: 13px;
color: var(--muted);
font-weight: 700;
}

input {
width: 100%;
padding: 13px 14px;
border: 1px solid var(--input-border);
border-radius: 16px;
font-size: 17px;
color: var(--text);
background: var(--input);
outline: none;
}

input:focus {
border-color: rgba(139, 92, 246, 0.75);
box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.16);
}

input:disabled {
opacity: 0.55;
cursor: not-allowed;
}

.timer-wrap {
position: relative;
width: min(280px, 72vw);
aspect-ratio: 1;
margin: 8px auto 28px;
display: grid;
place-items: center;
}

.progress-ring {
position: absolute;
inset: 0;
transform: rotate(-90deg);
filter: drop-shadow(0 0 18px rgba(139, 92, 246, 0.22));
}

.ring-bg,
.ring-progress {
fill: none;
stroke-width: 12;
}

.ring-bg {
stroke: var(--ring-bg);
}

.ring-progress {
stroke: url(#ringGradient);
stroke-linecap: round;
transition: stroke-dashoffset 0.35s linear;
}

.countdown {
position: relative;
font-size: clamp(54px, 16vw, 78px);
font-weight: 850;
letter-spacing: -0.07em;
font-variant-numeric: tabular-nums;
}

.sessions {
margin-bottom: 26px;
font-size: 15px;
color: var(--muted);
}

.sessions strong {
color: var(--text);
font-size: 18px;
}

.buttons {
display: grid;
grid-template-columns: 1.2fr 1fr 1fr;
gap: 11px;
}

button {
border: none;
border-radius: 999px;
padding: 14px 16px;
font-size: 15px;
font-weight: 800;
cursor: pointer;
background: var(--button);
color: var(--button-text);
transition: transform 0.14s ease, opacity 0.14s ease, background 0.14s ease;
}

button:hover {
transform: translateY(-1px);
opacity: 0.94;
}

button:active {
transform: translateY(0);
}

button.secondary {
background: var(--button-secondary);
color: var(--button-secondary-text);
}

.hint {
margin-top: 24px;
font-size: 13px;
color: var(--muted-2);
line-height: 1.45;
}

@media (max-width: 420px) {
body {
padding: 14px;
}

.timer-card {
border-radius: 24px;
}

.settings {
grid-template-columns: 1fr;
}

.buttons {
grid-template-columns: 1fr;
}

button {
width: 100%;
padding: 15px 16px;
}
}
</style>
</head>
<body>
<main class="timer-card">
<h1>Pomodoro Timer</h1>
<div class="mode" id="mode">Work session</div>

<div class="settings">
<label>
Work minutes
<input id="workInput" type="number" min="1" max="180" value="25" />
</label>

<label>
Break minutes
<input id="breakInput" type="number" min="1" max="60" value="5" />
</label>
</div>

<div class="timer-wrap">
<svg class="progress-ring" viewBox="0 0 260 260" aria-hidden="true">
<defs>
<linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#8b5cf6"></stop>
<stop offset="100%" stop-color="#22d3ee"></stop>
</linearGradient>
</defs>

<circle class="ring-bg" cx="130" cy="130" r="116"></circle>
<circle class="ring-progress" id="ringProgress" cx="130" cy="130" r="116"></circle>
</svg>

<div class="countdown" id="countdown">25:00</div>
</div>

<div class="sessions">
Work sessions completed <strong id="sessionCount">0</strong>
</div>

<div class="buttons">
<button id="startBtn">Start</button>
<button class="secondary" id="pauseBtn">Pause</button>
<button class="secondary" id="resetBtn">Reset</button>
</div>

<div class="hint">Set your times, start focusing, and let the chime mark each transition.</div>
</main>

<script>
let workSeconds = 25 * 60;
let breakSeconds = 5 * 60;
let isWorkSession = true;
let timeLeft = workSeconds;
let completedSessions = 0;
let timer = null;
let audioContext = null;

const countdown = document.getElementById("countdown");
const mode = document.getElementById("mode");
const sessionCount = document.getElementById("sessionCount");
const workInput = document.getElementById("workInput");
const breakInput = document.getElementById("breakInput");
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const resetBtn = document.getElementById("resetBtn");
const ringProgress = document.getElementById("ringProgress");

const radius = 116;
const circumference = 2 * Math.PI * radius;

ringProgress.style.strokeDasharray = `${circumference}`;
ringProgress.style.strokeDashoffset = "0";

function getMinutes(input, fallback) {
const value = parseInt(input.value, 10);
return Number.isFinite(value) && value > 0 ? value : fallback;
}

function getCurrentSessionSeconds() {
return isWorkSession ? workSeconds : breakSeconds;
}

function applySettings() {
const workMinutes = getMinutes(workInput, 25);
const breakMinutes = getMinutes(breakInput, 5);

workSeconds = workMinutes * 60;
breakSeconds = breakMinutes * 60;
timeLeft = getCurrentSessionSeconds();

updateDisplay();
}

function setInputsDisabled(disabled) {
workInput.disabled = disabled;
breakInput.disabled = disabled;
}

function formatTime(seconds) {
const minutes = Math.floor(seconds / 60);
const remainingSeconds = seconds % 60;
return `${minutes}:${remainingSeconds.toString().padStart(2, "0")}`;
}

function updateProgressRing() {
const total = getCurrentSessionSeconds();
const progress = total > 0 ? timeLeft / total : 0;
const offset = circumference * (1 - progress);
ringProgress.style.strokeDashoffset = `${offset}`;
}

function updateDisplay() {
countdown.textContent = formatTime(timeLeft);
mode.textContent = isWorkSession ? "Work session" : "Break time";
sessionCount.textContent = completedSessions;
document.title = `${formatTime(timeLeft)} - ${isWorkSession ? "Work" : "Break"}`;
updateProgressRing();
}

function unlockAudio() {
if (!audioContext) {
audioContext = new (window.AudioContext || window.webkitAudioContext)();
}

if (audioContext.state === "suspended") {
audioContext.resume();
}
}

function playChime() {
unlockAudio();

const now = audioContext.currentTime;
const masterGain = audioContext.createGain();

masterGain.gain.setValueAtTime(0.0001, now);
masterGain.gain.exponentialRampToValueAtTime(0.14, now + 0.04);
masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.25);
masterGain.connect(audioContext.destination);

const notes = [
{ frequency: 523.25, start: 0 },
{ frequency: 659.25, start: 0.12 },
{ frequency: 783.99, start: 0.24 }
];

notes.forEach(note => {
const oscillator = audioContext.createOscillator();
const noteGain = audioContext.createGain();

oscillator.type = "sine";
oscillator.frequency.setValueAtTime(note.frequency, now + note.start);

noteGain.gain.setValueAtTime(0.0001, now + note.start);
noteGain.gain.exponentialRampToValueAtTime(1, now + note.start + 0.03);
noteGain.gain.exponentialRampToValueAtTime(0.0001, now + note.start + 0.75);

oscillator.connect(noteGain);
noteGain.connect(masterGain);

oscillator.start(now + note.start);
oscillator.stop(now + note.start + 0.8);
});
}

function switchSession() {
playChime();

if (isWorkSession) {
completedSessions++;
}

isWorkSession = !isWorkSession;
timeLeft = getCurrentSessionSeconds();
updateDisplay();
}

function startTimer() {
if (timer) return;

unlockAudio();
applySettings();
setInputsDisabled(true);

timer = setInterval(() => {
if (timeLeft > 0) {
timeLeft--;
updateDisplay();
} else {
switchSession();
}
}, 1000);
}

function pauseTimer() {
clearInterval(timer);
timer = null;
}

function resetTimer() {
pauseTimer();
setInputsDisabled(false);
isWorkSession = true;
completedSessions = 0;
applySettings();
}

workInput.addEventListener("input", () => {
if (!timer) applySettings();
});

breakInput.addEventListener("input", () => {
if (!timer) applySettings();
});

startBtn.addEventListener("click", startTimer);
pauseBtn.addEventListener("click", pauseTimer);
resetBtn.addEventListener("click", resetTimer);

updateDisplay();
</script>
</body>
</html>
