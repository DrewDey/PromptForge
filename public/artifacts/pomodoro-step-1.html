<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Focus Timer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .timer-card {
      width: min(420px, 92vw);
      padding: 40px 28px;
      text-align: center;
      background: white;
      border-radius: 22px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 28px;
      font-weight: 700;
    }

    .mode {
      margin-bottom: 22px;
      font-size: 18px;
      color: #666;
    }

    .countdown {
      margin: 24px 0 34px;
      font-size: clamp(64px, 18vw, 96px);
      font-weight: 800;
      letter-spacing: -4px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 13px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #222;
      color: white;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    button.secondary {
      background: #e9e9e9;
      color: #222;
    }

    .hint {
      margin-top: 26px;
      font-size: 14px;
      color: #777;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="timer-card">
    <h1>Pomodoro Timer</h1>
    <div class="mode" id="mode">Work session</div>
    <div class="countdown" id="countdown">25:00</div>

    <div class="buttons">
      <button id="startBtn">Start</button>
      <button class="secondary" id="pauseBtn">Pause</button>
      <button class="secondary" id="resetBtn">Reset</button>
    </div>

    <div class="hint">25 minutes focus, then 5 minutes break.</div>
  </main>

  <script>
    const WORK_SECONDS = 25 * 60;
    const BREAK_SECONDS = 5 * 60;

    let isWorkSession = true;
    let timeLeft = WORK_SECONDS;
    let timer = null;

    const countdown = document.getElementById("countdown");
    const mode = document.getElementById("mode");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = seconds % 60;
      return `${minutes}:${remainingSeconds.toString().padStart(2, "0")}`;
    }

    function updateDisplay() {
      countdown.textContent = formatTime(timeLeft);
      mode.textContent = isWorkSession ? "Work session" : "Break time";
      document.title = `${formatTime(timeLeft)} - ${isWorkSession ? "Work" : "Break"}`;
    }

    function switchSession() {
      isWorkSession = !isWorkSession;
      timeLeft = isWorkSession ? WORK_SECONDS : BREAK_SECONDS;
      updateDisplay();
    }

    function startTimer() {
      if (timer) return;

      timer = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          switchSession();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timer);
      timer = null;
    }

    function resetTimer() {
      pauseTimer();
      isWorkSession = true;
      timeLeft = WORK_SECONDS;
      updateDisplay();
    }

    startBtn.addEventListener("click", startTimer);
    pauseBtn.addEventListener("click", pauseTimer);
    resetBtn.addEventListener("click", resetTimer);

    updateDisplay();
  </script>
</body>
</html>
