<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Focus Timer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .timer-card {
      width: min(460px, 92vw);
      padding: 40px 28px;
      text-align: center;
      background: white;
      border-radius: 22px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 28px;
      font-weight: 700;
    }

    .mode {
      margin-bottom: 18px;
      font-size: 18px;
      color: #666;
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0 0 24px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 7px;
      text-align: left;
      font-size: 14px;
      color: #555;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      color: #222;
      background: #fafafa;
    }

    input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .timer-wrap {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 10px auto 26px;
      display: grid;
      place-items: center;
    }

    .progress-ring {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    .ring-bg,
    .ring-progress {
      fill: none;
      stroke-width: 12;
    }

    .ring-bg {
      stroke: #eeeeee;
    }

    .ring-progress {
      stroke: #222;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.35s linear;
    }

    .countdown {
      position: relative;
      font-size: clamp(56px, 15vw, 76px);
      font-weight: 800;
      letter-spacing: -4px;
    }

    .sessions {
      margin-bottom: 24px;
      font-size: 16px;
      color: #555;
    }

    .sessions strong {
      color: #222;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 13px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #222;
      color: white;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    button.secondary {
      background: #e9e9e9;
      color: #222;
    }

    .hint {
      margin-top: 26px;
      font-size: 14px;
      color: #777;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="timer-card">
    <h1>Pomodoro Timer</h1>
    <div class="mode" id="mode">Work session</div>

    <div class="settings">
      <label>
        Work minutes
        <input id="workInput" type="number" min="1" max="180" value="25" />
      </label>

      <label>
        Break minutes
        <input id="breakInput" type="number" min="1" max="60" value="5" />
      </label>
    </div>

    <div class="timer-wrap">
      <svg class="progress-ring" viewBox="0 0 260 260" aria-hidden="true">
        <circle class="ring-bg" cx="130" cy="130" r="116"></circle>
        <circle class="ring-progress" id="ringProgress" cx="130" cy="130" r="116"></circle>
      </svg>

      <div class="countdown" id="countdown">25:00</div>
    </div>

    <div class="sessions">
      Work sessions completed: <strong id="sessionCount">0</strong>
    </div>

    <div class="buttons">
      <button id="startBtn">Start</button>
      <button class="secondary" id="pauseBtn">Pause</button>
      <button class="secondary" id="resetBtn">Reset</button>
    </div>

    <div class="hint">Set your times, start focusing, and completed work sessions will be counted.</div>
  </main>

  <script>
    let workSeconds = 25 * 60;
    let breakSeconds = 5 * 60;
    let isWorkSession = true;
    let timeLeft = workSeconds;
    let completedSessions = 0;
    let timer = null;
    let audioContext = null;

    const countdown = document.getElementById("countdown");
    const mode = document.getElementById("mode");
    const sessionCount = document.getElementById("sessionCount");
    const workInput = document.getElementById("workInput");
    const breakInput = document.getElementById("breakInput");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");
    const ringProgress = document.getElementById("ringProgress");

    const radius = 116;
    const circumference = 2 * Math.PI * radius;

    ringProgress.style.strokeDasharray = `${circumference}`;
    ringProgress.style.strokeDashoffset = "0";

    function getMinutes(input, fallback) {
      const value = parseInt(input.value, 10);
      return Number.isFinite(value) && value > 0 ? value : fallback;
    }

    function getCurrentSessionSeconds() {
      return isWorkSession ? workSeconds : breakSeconds;
    }

    function applySettings() {
      const workMinutes = getMinutes(workInput, 25);
      const breakMinutes = getMinutes(breakInput, 5);

      workSeconds = workMinutes * 60;
      breakSeconds = breakMinutes * 60;
      timeLeft = getCurrentSessionSeconds();

      updateDisplay();
    }

    function setInputsDisabled(disabled) {
      workInput.disabled = disabled;
      breakInput.disabled = disabled;
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = seconds % 60;
      return `${minutes}:${remainingSeconds.toString().padStart(2, "0")}`;
    }

    function updateProgressRing() {
      const total = getCurrentSessionSeconds();
      const progress = total > 0 ? timeLeft / total : 0;
      const offset = circumference * (1 - progress);
      ringProgress.style.strokeDashoffset = `${offset}`;
    }

    function updateDisplay() {
      countdown.textContent = formatTime(timeLeft);
      mode.textContent = isWorkSession ? "Work session" : "Break time";
      sessionCount.textContent = completedSessions;
      document.title = `${formatTime(timeLeft)} - ${isWorkSession ? "Work" : "Break"}`;
      updateProgressRing();
    }

    function unlockAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    function playChime() {
      unlockAudio();

      const now = audioContext.currentTime;
      const masterGain = audioContext.createGain();
      masterGain.gain.setValueAtTime(0.0001, now);
      masterGain.gain.exponentialRampToValueAtTime(0.16, now + 0.04);
      masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
      masterGain.connect(audioContext.destination);

      const notes = [
        { frequency: 523.25, start: 0 },
        { frequency: 659.25, start: 0.12 },
        { frequency: 783.99, start: 0.24 }
      ];

      notes.forEach(note => {
        const oscillator = audioContext.createOscillator();
        const noteGain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(note.frequency, now + note.start);

        noteGain.gain.setValueAtTime(0.0001, now + note.start);
        noteGain.gain.exponentialRampToValueAtTime(1, now + note.start + 0.03);
        noteGain.gain.exponentialRampToValueAtTime(0.0001, now + note.start + 0.75);

        oscillator.connect(noteGain);
        noteGain.connect(masterGain);

        oscillator.start(now + note.start);
        oscillator.stop(now + note.start + 0.8);
      });
    }

    function switchSession() {
      playChime();

      if (isWorkSession) {
        completedSessions++;
      }

      isWorkSession = !isWorkSession;
      timeLeft = getCurrentSessionSeconds();
      updateDisplay();
    }

    function startTimer() {
      if (timer) return;

      unlockAudio();
      applySettings();
      setInputsDisabled(true);

      timer = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          switchSession();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timer);
      timer = null;
    }

    function resetTimer() {
      pauseTimer();
      setInputsDisabled(false);
      isWorkSession = true;
      completedSessions = 0;
      applySettings();
    }

    workInput.addEventListener("input", () => {
      if (!timer) applySettings();
    });

    breakInput.addEventListener("input", () => {
      if (!timer) applySettings();
    });

    startBtn.addEventListener("click", startTimer);
    pauseBtn.addEventListener("click", pauseTimer);
    resetBtn.addEventListener("click", resetTimer);

    updateDisplay();
  </script>
</body>
</html>
