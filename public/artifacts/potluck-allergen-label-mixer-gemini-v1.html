<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potluck Host Helper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #printArea, #printArea * {
                visibility: visible;
            }
            #printArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none !important;
            }
            .card-break {
                break-inside: avoid;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pb-12">

    <!-- Main Interface (Hidden during Print) -->
    <div class="max-w-4xl mx-auto px-4 py-8 no-print">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-700">Potluck Host Helper</h1>
            <p class="text-gray-600 mt-2">Manage your menu, track logistics, and print display cards.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Form Column -->
            <div class="md:col-span-1 bg-white p-6 rounded-xl shadow-sm h-fit border border-gray-100">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Add New Dish</h2>
                <form id="dishForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Dish Name</label>
                        <input type="text" id="dishName" required class="w-full p-2 border rounded-md focus:ring-2 focus:ring-indigo-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Ingredients / Allergens</label>
                        <input type="text" id="allergens" placeholder="e.g., Nuts, Dairy, Gluten-free" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-indigo-400 outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Servings</label>
                            <input type="number" id="servings" placeholder="12" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-indigo-400 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Temp/Setup</label>
                            <input type="text" id="tempNotes" placeholder="e.g., Serve hot, needs outlet" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-indigo-400 outline-none">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md transition duration-150">
                        Add to List
                    </button>
                </form>
            </div>

            <!-- Dashboard/Checklist Column -->
            <div class="md:col-span-2 space-y-6">
                <!-- Actions -->
                <div class="flex flex-wrap gap-3 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-md font-medium text-sm transition">
                        Print Label Cards
                    </button>
                    <button onclick="copyChecklist()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-md font-medium text-sm transition">
                        Copy Text Checklist
                    </button>
                    <button onclick="downloadJSON()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-md font-medium text-sm transition ml-auto">
                        Export Backup
                    </button>
                </div>

                <!-- Host Mobile Checklist -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-semibold mb-4 text-gray-700 flex justify-between items-center">
                        <span>Host Checklist (Mobile-Friendly)</span>
                        <span id="counter" class="text-sm bg-indigo-100 text-indigo-800 px-2 py-1 rounded-full font-normal">0 items</span>
                    </h2>
                    <div id="checklistContainer" class="space-y-3 divide-y divide-gray-100">
                        <p class="text-gray-400 text-center py-4">No dishes added yet. Fill out the form to start.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Print Only Area (Formatted for Labels) -->
    <div id="printArea" class="hidden print:block p-4">
        <div id="printCardsContainer" class="grid grid-cols-2 gap-4">
            <!-- Cards dynamically inject here -->
        </div>
    </div>

    <script>
        let dishes = [];

        const dishForm = document.getElementById('dishForm');
        const checklistContainer = document.getElementById('checklistContainer');
        const printCardsContainer = document.getElementById('printCardsContainer');
        const counter = document.getElementById('counter');

        dishForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const dish = {
                id: Date.now(),
                name: document.getElementById('dishName').value,
                allergens: document.getElementById('allergens').value || 'None specified',
                servings: document.getElementById('servings').value || 'N/A',
                tempNotes: document.getElementById('tempNotes').value || 'None',
                arrived: false
            };

            dishes.push(dish);
            dishForm.reset();
            render();
        });

        function deleteDish(id) {
            dishes = dishes.filter(d => d.id !== id);
            render();
        }

        function toggleArrived(id) {
            const dish = dishes.find(d => d.id === id);
            if (dish) dish.arrived = !dish.arrived;
            render();
        }

        function render() {
            // Update counter
            counter.innerText = `${dishes.length} dish${dishes.length === 1 ? '' : 'es'}`;

            if (dishes.length === 0) {
                checklistContainer.innerHTML = `<p class="text-gray-400 text-center py-4">No dishes added yet. Fill out the form to start.</p>`;
                printCardsContainer.innerHTML = '';
                return;
            }

            // Render Mobile Checklist
            checklistContainer.innerHTML = dishes.map(dish => `
                <div class="flex items-start justify-between pt-3 dialog-item ${dish.arrived ? 'opacity-60' : ''}">
                    <div class="flex items-start space-x-3 flex-1 min-w-0">
                        <input type="checkbox" ${dish.arrived ? 'checked' : ''} onclick="toggleArrived(${dish.id})" 
                               class="mt-1 h-5 w-5 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500 cursor-pointer">
                        <div class="text-sm">
                            <p class="font-semibold text-gray-900 ${dish.arrived ? 'line-through text-gray-400' : ''}">${dish.name}</p>
                            <p class="text-gray-500"><strong class="text-gray-700">Allergens:</strong> ${dish.allergens}</p>
                            <p class="text-gray-500"><strong class="text-gray-700">Servings:</strong> ${dish.servings} | <strong class="text-gray-700">Setup:</strong> ${dish.tempNotes}</p>
                        </div>
                    </div>
                    <button onclick="deleteDish(${dish.id})" class="text-red-500 hover:text-red-700 text-sm font-medium ml-2 px-2 py-1">
                        Remove
                    </button>
                </div>
            `).join('');

            // Render Print Cards (Standard tent card size ratio)
            printCardsContainer.innerHTML = dishes.map(dish => `
                <div class="border-2 border-dashed border-gray-400 p-6 rounded-lg bg-white card-break flex flex-col justify-between h-48 shadow-sm">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900 border-b-2 border-indigo-100 pb-1 mb-2">${dish.name}</h2>
                        <p class="text-sm text-gray-700"><strong class="text-indigo-900">Ingredients/Allergens:</strong> ${dish.allergens}</p>
                    </div>
                    <div class="flex justify-between items-end border-t border-gray-200 pt-2 text-xs text-gray-500">
                        <span>Est. Servings: ${dish.servings}</span>
                        <span class="italic">${dish.tempNotes !== 'None' ? dish.tempNotes : ''}</span>
                    </div>
                </div>
            `).join('');
        }

        function copyChecklist() {
            if (dishes.length === 0) return;
            const text = dishes.map(d => 
                `[${d.arrived ? 'X' : ' '}] ${d.name}\n   Allergens: ${d.allergens}\n   Servings: ${d.servings}\n   Notes: ${d.tempNotes}`
            ).join('\n\n');
            
            navigator.clipboard.writeText(text);
            alert('Checklist copied to clipboard!');
        }

        function downloadJSON() {
            if (dishes.length === 0) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dishes, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "potluck_checklist.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
