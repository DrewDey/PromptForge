<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Framing Workshop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .task-input-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .task-input-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .task-input-section textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        .task-input-section textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .patterns-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .pattern-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border-left: 4px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .pattern-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
        }

        .pattern-card.pattern-2 {
            border-left-color: #764ba2;
        }

        .pattern-card.pattern-3 {
            border-left-color: #f093fb;
        }

        .pattern-card h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .pattern-type {
            display: inline-block;
            background: #f0f0f0;
            color: #666;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .pattern-card textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .pattern-card textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .tradeoff-meter {
            margin-bottom: 15px;
        }

        .meter-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 6px;
        }

        .meter-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .meter-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .pattern-card.pattern-2 .meter-fill {
            background: linear-gradient(90deg, #764ba2, #f093fb);
        }

        .pattern-card.pattern-3 .meter-fill {
            background: linear-gradient(90deg, #f093fb, #4facfe);
        }

        .preview-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .preview-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .prompt-preview {
            background: #f8f8f8;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 200px;
            overflow-y: auto;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .export-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .export-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .export-formats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-content h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .modal-content textarea {
            width: 100%;
            height: 300px;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: vertical;
            margin-bottom: 15px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 10px 15px;
            border: none;
            background: none;
            cursor: pointer;
            color: #999;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .json-export {
            background: #f8f8f8;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            color: #333;
        }

        .copy-btn {
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .patterns-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 22px;
            }

            header {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🎯 Prompt Framing Workshop</h1>
            <p class="subtitle">Compare prompt patterns, adjust tradeoffs, and export your custom prompt card</p>
        </header>

        <!-- Task Input -->
        <div class="task-input-section">
            <label for="userTask">Your Task or Goal</label>
            <textarea id="userTask" placeholder="Example: Write a compelling product description for a sustainable water bottle..."></textarea>
        </div>

        <!-- Pattern Cards -->
        <div class="patterns-grid" id="patternsGrid"></div>

        <!-- Export Section -->
        <div class="export-section">
            <h2>📤 Export Your Custom Prompt Card</h2>
            
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-value" id="charCount">0</div>
                    <div class="stat-label">Characters</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="wordCount">0</div>
                    <div class="stat-label">Words</div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="view">View</button>
                <button class="tab" data-tab="json">JSON</button>
                <button class="tab" data-tab="markdown">Markdown</button>
            </div>

            <div id="view" class="tab-content active">
                <div class="preview-section">
                    <h3>Final Prompt Preview</h3>
                    <div class="prompt-preview" id="finalPreview">Select a pattern and enter your task to see the final prompt...</div>
                </div>
            </div>

            <div id="json" class="tab-content">
                <div class="json-export" id="jsonExport"></div>
                <button class="btn-primary copy-btn" onclick="copyToClipboard('#jsonExport')">📋 Copy JSON</button>
            </div>

            <div id="markdown" class="tab-content">
                <div class="json-export" id="markdownExport"></div>
                <button class="btn-primary copy-btn" onclick="copyToClipboard('#markdownExport')">📋 Copy Markdown</button>
            </div>

            <div class="actions" style="margin-top: 20px;">
                <button class="btn-success" onclick="downloadPromptCard()">⬇️ Download as Text</button>
                <button class="btn-secondary" onclick="saveToLocalStorage()">💾 Save to Browser</button>
                <button class="btn-secondary" onclick="loadFromLocalStorage()">📂 Load from Browser</button>
                <button class="btn-danger" onclick="clearAll()">🗑️ Clear All</button>
            </div>
        </div>
    </div>

    <!-- Modal for viewing full patterns -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>Edit Pattern</h3>
            <textarea id="modalTextarea"></textarea>
            <div class="modal-actions">
                <button class="btn-primary" onclick="saveModalEdit()">Save</button>
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Define prompt framing patterns
        const patterns = [
            {
                id: 1,
                name: "Direct & Clear",
                type: "Straightforward",
                template: "Task: {task}\n\nProvide a clear, concise response focused on the core requirement.",
                clarity: 95,
                flexibility: 60,
                creativity: 40,
                description: "Best for: Technical tasks, documentation, factual queries"
            },
            {
                id: 2,
                name: "Context-Rich",
                type: "Detailed",
                template: "Context: I need help with the following task.\n\nTask: {task}\n\nBackground: Consider relevant context, constraints, and best practices. Provide nuanced output that accounts for multiple perspectives.",
                clarity: 75,
                flexibility: 85,
                creativity: 70,
                description: "Best for: Complex problems, strategy, analysis"
            },
            {
                id: 3,
                name: "Persona & Role",
                type: "Roleplay",
                template: "You are an expert consultant specializing in this domain.\n\nClient request: {task}\n\nApproach this with your professional expertise, considering industry standards and innovative solutions.",
                clarity: 70,
                flexibility: 75,
                creativity: 90,
                description: "Best for: Creative work, specialized advice, brainstorming"
            }
        ];

        let selectedPattern = null;
        let currentEditingPatternId = null;

        // Initialize the workshop
        function init() {
            renderPatterns();
            setupEventListeners();
            updateStats();
        }

        function renderPatterns() {
            const grid = document.getElementById('patternsGrid');
            grid.innerHTML = '';

            patterns.forEach(pattern => {
                const card = document.createElement('div');
                card.className = `pattern-card pattern-${pattern.id}`;
                card.innerHTML = `
                    <span class="pattern-type">${pattern.type}</span>
                    <h3>${pattern.name}</h3>
                    <p style="font-size: 12px; color: #666; margin-bottom: 12px;">${pattern.description}</p>
                    
                    <textarea id="template-${pattern.id}" data-pattern-id="${pattern.id}">${pattern.template}</textarea>
                    
                    <div class="tradeoff-meter">
                        <div class="meter-label">
                            <span>Clarity</span>
                            <span id="clarity-${pattern.id}">${pattern.clarity}%</span>
                        </div>
                        <div class="meter-bar">
                            <div class="meter-fill" style="width: ${pattern.clarity}%"></div>
                        </div>
                    </div>
                    
                    <div class="tradeoff-meter">
                        <div class="meter-label">
                            <span>Flexibility</span>
                            <span id="flexibility-${pattern.id}">${pattern.flexibility}%</span>
                        </div>
                        <div class="meter-bar">
                            <div class="meter-fill" style="width: ${pattern.flexibility}%"></div>
                        </div>
                    </div>
                    
                    <div class="tradeoff-meter">
                        <div class="meter-label">
                            <span>Creativity</span>
                            <span id="creativity-${pattern.id}">${pattern.creativity}%</span>
                        </div>
                        <div class="meter-bar">
                            <div class="meter-fill" style="width: ${pattern.creativity}%"></div>
                        </div>
                    </div>

                    <div class="actions">
                        <button class="btn-primary" onclick="selectPattern(${pattern.id})">Use Pattern</button>
                        <button class="btn-secondary" onclick="editPattern(${pattern.id})">Edit</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selectPattern(patternId) {
            selectedPattern = patternId;
            const pattern = patterns.find(p => p.id === patternId);
            updateFinalPreview();
            document.querySelectorAll('.pattern-card').forEach(card => {
                card.style.opacity = '0.5';
            });
            document.querySelector(`.pattern-${patternId}`).style.opacity = '1';
        }

        function editPattern(patternId) {
            currentEditingPatternId = patternId;
            const textarea = document.getElementById(`template-${patternId}`);
            document.getElementById('modalTextarea').value = textarea.value;
            document.getElementById('modal').classList.add('active');
        }

        function saveModalEdit() {
            const newTemplate = document.getElementById('modalTextarea').value;
            const pattern = patterns.find(p => p.id === currentEditingPatternId);
            if (pattern) {
                pattern.template = newTemplate;
                document.getElementById(`template-${currentEditingPatternId}`).value = newTemplate;
                updateFinalPreview();
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            currentEditingPatternId = null;
        }

        function updateFinalPreview() {
            const task = document.getElementById('userTask').value;
            if (!selectedPattern || !task) {
                document.getElementById('finalPreview').textContent = 'Select a pattern and enter your task to see the final prompt...';
                return;
            }

            const pattern = patterns.find(p => p.id === selectedPattern);
            const finalPrompt = pattern.template.replace('{task}', task);
            document.getElementById('finalPreview').textContent = finalPrompt;
            
            updateExports(finalPrompt, pattern);
            updateStats();
        }

        function updateStats() {
            const task = document.getElementById('userTask').value;
            if (!selectedPattern) {
                document.getElementById('charCount').textContent = task.length;
                document.getElementById('wordCount').textContent = task.split(/\s+/).filter(w => w).length;
                return;
            }

            const pattern = patterns.find(p => p.id === selectedPattern);
            const finalPrompt = pattern.template.replace('{task}', task);
            
            document.getElementById('charCount').textContent = finalPrompt.length;
            document.getElementById('wordCount').textContent = finalPrompt.split(/\s+/).filter(w => w).length;
        }

        function updateExports(prompt, pattern) {
            // JSON Export
            const jsonData = {
                name: pattern.name,
                type: pattern.type,
                prompt: prompt,
                tradeoffs: {
                    clarity: pattern.clarity,
                    flexibility: pattern.flexibility,
                    creativity: pattern.creativity
                },
                timestamp: new Date().toISOString()
            };
            document.getElementById('jsonExport').textContent = JSON.stringify(jsonData, null, 2);

            // Markdown Export
            const markdown = `# ${pattern.name}

**Type:** ${pattern.type}

## Prompt
\`\`\`
${prompt}
\`\`\`

## Tradeoff Analysis
- **Clarity:** ${pattern.clarity}%
- **Flexibility:** ${pattern.flexibility}%
- **Creativity:** ${pattern.creativity}%

---
*Generated: ${new Date().toLocaleString()}*`;
            document.getElementById('markdownExport').textContent = markdown;
        }

        function copyToClipboard(selector) {
            const text = document.querySelector(selector).textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            });
        }

        function downloadPromptCard() {
            const task = document.getElementById('userTask').value;
            if (!selectedPattern || !task) {
                alert('Please select a pattern and enter a task');
                return;
            }

            const pattern = patterns.find(p => p.id === selectedPattern);
            const finalPrompt = pattern.template.replace('{task}', task);
            
            const content = `Prompt Framing Workshop - Exported Card
=====================================

Pattern: ${pattern.name}
Type: ${pattern.type}
Date: ${new Date().toLocaleString()}

FINAL PROMPT:
---
${finalPrompt}
---

TRADEOFF ANALYSIS:
- Clarity: ${pattern.clarity}%
- Flexibility: ${pattern.flexibility}%
- Creativity: ${pattern.creativity}%

Original Task:
${task}`;

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `prompt-card-${pattern.name.replace(/\s+/g, '-').toLowerCase()}-${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function saveToLocalStorage() {
            const task = document.getElementById('userTask').value;
            if (!selectedPattern) {
                alert('Please select a pattern');
                return;
            }

            const pattern = patterns.find(p => p.id === selectedPattern);
            const finalPrompt = pattern.template.replace('{task}', task);
            
            const data = {
                patternId: selectedPattern,
                patternName: pattern.name,
                template: pattern.template,
                task: task,
                finalPrompt: finalPrompt,
                tradeoffs: {
                    clarity: pattern.clarity,
                    flexibility: pattern.flexibility,
                    creativity: pattern.creativity
                },
                savedAt: new Date().toISOString()
            };

            localStorage.setItem('promptCard', JSON.stringify(data));
            alert('Saved to browser storage!');
        }

        function loadFromLocalStorage() {
            const stored = localStorage.getItem('promptCard');
            if (!stored) {
                alert('No saved prompt card found');
                return;
            }

            const data = JSON.parse(stored);
            document.getElementById('userTask').value = data.task;
            selectPattern(data.patternId);
            alert(`Loaded: "${data.patternName}" from ${new Date(data.savedAt).toLocaleString()}`);
        }

        function clearAll() {
            if (confirm('Are you sure? This will clear all inputs.')) {
                document.getElementById('userTask').value = '';
                selectedPattern = null;
                document.querySelectorAll('.pattern-card').forEach(card => {
                    card.style.opacity = '1';
                });
                document.getElementById('finalPreview').textContent = 'Select a pattern and enter your task to see the final prompt...';
                updateStats();
            }
        }

        function setupEventListeners() {
            document.getElementById('userTask').addEventListener('input', updateFinalPreview);

            // Tab switching
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    const tabName = e.target.dataset.tab;
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                    e.target.classList.add('active');
                    document.getElementById(tabName).classList.add('active');
                });
            });

            // Close modal on outside click
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target.id === 'modal') {
                    closeModal();
                }
            });
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
