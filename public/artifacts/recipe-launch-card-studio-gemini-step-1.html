<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Launch Studio</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --border: #333333;
            --text: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent: #ff9800;
            --accent-dim: #b36b00;
            --card-bg: #252525;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 10px;
            font-size: 14px;
            line-height: 1.4;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.4rem;
            color: var(--accent);
        }

        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #000;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }

        button {
            background: var(--accent-dim);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        button:active {
            background: var(--accent);
        }

        .output-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
        }

        .editable-box {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 8px;
            min-height: 40px;
            white-space: pre-wrap;
            margin-bottom: 8px;
        }

        .editable-box:focus {
            outline: 1px solid var(--accent);
            background: #000;
        }

        .checklist-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .checklist-item input {
            margin-right: 8px;
            margin-top: 3px;
            transform: scale(1.1);
        }

        .tag {
            display: inline-block;
            background: #333;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-right: 5px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .tag.diet { border: 1px solid #4caf50; color: #4caf50; }
        .tag.allergen { border: 1px solid #f44336; color: #f44336; }

        .caption-option {
            background: #151515;
            padding: 8px;
            border-left: 3px solid var(--accent);
            margin-bottom: 8px;
            border-radius: 0 4px 4px 0;
            position: relative;
        }

        .btn-copy-mini {
            background: #333;
            padding: 2px 6px;
            font-size: 0.7rem;
            width: auto;
            display: inline-block;
            margin-top: 4px;
        }

        #launch-card-print {
            background: #fff;
            color: #000;
            padding: 20px;
            border-radius: 0;
            border: 2px dashed #000;
        }

        #launch-card-print .card-title {
            color: #000;
            border-bottom: 2px solid #000;
            font-size: 1.3rem;
        }

        #launch-card-print .editable-box {
            background: #fff;
            border: none;
            color: #000;
            padding: 0;
        }

        #launch-card-print label {
            color: #555;
            margin-top: 10px;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #launch-card-print, #launch-card-print * {
                visibility: visible;
            }
            #launch-card-print {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                border: none;
            }
            .btn-copy-mini, button {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Recipe Launch Studio</h1>
    </header>

    <div class="section">
        <label for="rawNotes">Paste Raw Launch Notes</label>
        <textarea id="rawNotes" placeholder="Drop messy notes here... e.g.
Smash Burgers. need 80/20 beef, brioche buns, cheddar, secret sauce. chop onions before starting. toast buns first. 
gluten allergy warning for buns. keto friendly without bun.
'The ultimate crust' or 'Weeknight burger magic'"></textarea>
        <button onclick="processNotes()">Parse & Generate Studio</button>
    </div>

    <div class="output-grid" id="studioOutput" style="display: none;">
        
        <!-- RECIPE CARD SECTIONS -->
        <div class="card">
            <div class="card-title">Recipe Card Sections</div>
            <label>Ingredients</label>
            <div class="editable-box" contenteditable="true" id="outIngredients"></div>
            <label>Directions</label>
            <div class="editable-box" contenteditable="true" id="outDirections"></div>
        </div>

        <!-- PREP CHECKLIST -->
        <div class="card">
            <div class="card-title">Prep Checklist</div>
            <div id="outChecklist"></div>
        </div>

        <!-- DIET & ALLERGEN FLAGS -->
        <div class="card">
            <div class="card-title">Diet & Allergen Flags</div>
            <div id="outTags"></div>
        </div>

        <!-- GROCERY GROUPS -->
        <div class="card">
            <div class="card-title">Grocery Groups</div>
            <div class="editable-box" contenteditable="true" id="outGroceries"></div>
        </div>

        <!-- CAPTION OPTIONS -->
        <div class="card">
            <div class="card-title">Short Captions</div>
            <div id="outCaptions"></div>
        </div>

        <!-- PRINTABLE LAUNCH CARD -->
        <div class="card" style="background: #2e2e2e;">
            <div class="card-title" style="color: #fff;">Printable Launch Card Preview</div>
            <button onclick="window.print()" style="background: #4caf50; margin-bottom: 15px;">Print / Save PDF</button>
            <button onclick="copyLaunchCard()" class="btn-copy-mini" style="margin-bottom: 15px; width: 100%;">Copy Plain Text Card</button>
            
            <div id="launch-card-print">
                <div class="card-title" id="printTitle">RECIPE LAUNCH CARD</div>
                <label>DIET / ALLERGENS</label>
                <div id="printTags" style="margin-bottom: 10px; font-weight: bold;"></div>
                <label>INGREDIENTS</label>
                <div class="editable-box" contenteditable="true" id="printIngredients"></div>
                <label>PREP & DIRECTIONS</label>
                <div class="editable-box" contenteditable="true" id="printDirections"></div>
                <label>GROCERY LIST</label>
                <div class="editable-box" contenteditable="true" id="printGroceries"></div>
            </div>
        </div>

    </div>
</div>

<script>
    function processNotes() {
        const raw = document.getElementById('rawNotes').value;
        if (!raw.trim()) return;

        // Simple Regex Parsing logic
        const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        
        let title = "Recipe Launch Card";
        let ingredients = [];
        let directions = [];
        let prepItems = [];
        let diets = [];
        let allergens = [];
        let captions = [];
        
        // Keywords for filtering
        const allergenKeywords = ['allergy', 'allergens', 'contains', 'allergen', 'gluten', 'dairy', 'nuts'];
        const dietKeywords = ['keto', 'vegan', 'vegetarian', 'paleo', 'low carb', 'diet', 'friendly'];
        const prepKeywords = ['prep', 'chop', 'slice', 'dice', 'before', ' thaw', 'preheat'];

        // Extract Title from first line if short
        if (lines[0] && lines[0].length < 40) {
            title = lines[0].replace(/[:#]/g, '').trim();
        }

        lines.forEach((line, index) => {
            const lower = line.toLowerCase();
            
            // Check quotes or short lines for captions
            if ((line.startsWith('"') || line.startsWith("'")) || (lower.includes('caption') || lower.includes('hook'))) {
                captions.push(line.replace(/['"']/g, ''));
                return;
            }

            // Flags
            let isFlagged = false;
            allergenKeywords.forEach(k => {
                if (lower.includes(k) && !isFlagged) {
                    allergens.push(line);
                    isFlagged = true;
                }
            });
            dietKeywords.forEach(k => {
                if (lower.includes(k) && !isFlagged) {
                    diets.push(line);
                    isFlagged = true;
                }
            });
            if (isFlagged) return;

            // Prep vs Directions
            let isPrep = false;
            prepKeywords.forEach(k => {
                if (lower.includes(k)) {
                    prepItems.push(line);
                    isPrep = true;
                }
            });

            // Fallback heuristics for lists vs instructions
            if (!isPrep) {
                if (lower.includes('need') || lower.includes('ingredients') || line.includes(',') || lower.startsWith('-') || lower.match(/^\d/)) {
                    ingredients.push(line);
                } else {
                    directions.push(line);
                }
            }
        });

        // Fallbacks if parsing yields empty blocks
        if (ingredients.length === 0) ingredients = ["- Enter ingredients here"];
        if (directions.length === 0) directions = ["1. Enter directions here"];
        if (prepItems.length === 0) prepItems = ["Check tools", "Mise en place"];
        if (captions.length === 0) captions = [`Fresh ${title} ready for launch.`, `Level up your menu with this ${title}.`];

        // Format Outputs
        const formattedIngredients = ingredients.join('\n').replace(/^[,\s. ]+/g, '');
        const formattedDirections = directions.join('\n');
        
        // Populate DOM
        document.getElementById('outIngredients').innerText = formattedIngredients;
        document.getElementById('outDirections').innerText = formattedDirections;

        // Build Prep Checklist
        const checklistHtml = prepItems.map((item, i) => `
            <div class="checklist-item">
                <input type="checkbox" id="prep_${i}">
                <label for="prep_${i}" style="color:var(--text); font-weight:normal; text-transform:none; font-size:13px; margin:0;">${item}</label>
            </div>
        `).join('');
        document.getElementById('outChecklist').innerHTML = checklistHtml;

        // Build Tags
        let tagsHtml = '';
        diets.forEach(d => tagsHtml += `<span class="tag diet">${d}</span>`);
        allergens.forEach(a => tagsHtml += `<span class="tag allergen">${a}</span>`);
        if (!tagsHtml) tagsHtml = '<span class="text-muted">None detected</span>';
        document.getElementById('outTags').innerHTML = tagsHtml;
        document.getElementById('printTags').innerText = [...diets, ...allergens].join(' | ') || 'None';

        // Build Grocery Groups (naive breakdown by comma/lines)
        const groceryLines = ingredients.flatMap(i => i.split(',')).map(g => g.replace(/[-•\d]/g, '').trim()).filter(g => g.length > 2);
        document.getElementById('outGroceries').innerText = groceryLines.map(g => `[ ] ${g}`).join('\n');

        // Build Captions
        const captionsHtml = captions.map(c => `
            <div class="caption-option">
                <div>${c}</div>
                <button class="btn-copy-mini" onclick="navigator.clipboard.writeText('${c.replace(/'/g, "\\'")}')">Copy</button>
            </div>
        `).join('');
        document.getElementById('outCaptions').innerHTML = captionsHtml;

        // Sync to Printable Card
        document.getElementById('printTitle').innerText = title.toUpperCase() + ' LAUNCH CARD';
        document.getElementById('printIngredients').innerText = formattedIngredients;
        document.getElementById('printDirections').innerText = (prepItems.map(p => `[PREP] ${p}`).concat(directions)).join('\n');
        document.getElementById('printGroceries').innerText = groceryLines.map(g => `_ ${g}`).join('\n');

        // Reveal Output Grid
        document.getElementById('studioOutput').style.display = 'grid';
        window.scrollTo({ top: document.getElementById('studioOutput').offsetTop, behavior: 'smooth' });
    }

    function copyLaunchCard() {
        const title = document.getElementById('printTitle').innerText;
        const tags = document.getElementById('printTags').innerText;
        const ing = document.getElementById('printIngredients').innerText;
        const dir = document.getElementById('printDirections').innerText;
        const groc = document.getElementById('printGroceries').innerText;

        const textBlock = `${title}\n\nDIET/ALLERGENS:\n${tags}\n\nINGREDIENTS:\n${ing}\n\nDIRECTIONS & PREP:\n${dir}\n\nGROCERY:\n${groc}`;
        navigator.clipboard.writeText(textBlock);
    }
</script>

</body>
</html>
