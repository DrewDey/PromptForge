<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apartment Walkthrough Scorecard</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f4f4f9; color: #333; line-height: 1.5; box-sizing: border-box; }
  h1, h2 { text-align: center; }
  .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; width: 100%; box-sizing: border-box; }
  label { display: block; margin-top: 15px; font-weight: 600; font-size: 14px; }
  input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
  .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .checkbox-grid label { font-weight: normal; margin-top: 0; display: flex; align-items: flex-start; gap: 8px; font-size: 14px; line-height: 1.2; }
  .checkbox-grid input { width: auto; margin-top: 0; }
  button { background: #000; color: #fff; border: none; padding: 12px 15px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 20px; box-sizing: border-box; }
  button.secondary { background: #e0e0e0; color: #000; }
  button.danger { background: #ffecec; color: #d32f2f; margin-top: 30px; }
  .room-entry { border-left: 4px solid #000; padding-left: 15px; margin-bottom: 20px; background: #fafafa; padding: 10px; border-radius: 0 6px 6px 0; }
  #briefContainer, #clearConfirmArea, #summaryCard { display: none; }
  pre { background: #222; color: #fff; padding: 15px; border-radius: 6px; white-space: pre-wrap; font-size: 14px; overflow-x: auto; margin-top: 10px; }
  #validationMsg { color: #d32f2f; font-size: 12px; margin-top: 5px; display: none; }
  .summary-stat { margin: 10px 0; font-size: 16px; }
</style>
</head>
<body>

  <h1>Walkthrough Scorecard</h1>

  <div class="card">
    <label for="address">Property Address / Unit</label>
    <input type="text" id="address" placeholder="123 Main St, Apt 4B">
  </div>

  <div class="card">
    <h2>Assess a Room</h2>
    <label for="roomName">Room Name</label>
    <input type="text" id="roomName" placeholder="e.g. Master Bedroom">
    <div id="validationMsg">Room name is required.</div>

    <label for="rating">Overall Condition (1-5)</label>
    <select id="rating">
      <option value="5">5 - Excellent</option>
      <option value="4">4 - Good</option>
      <option value="3">3 - Average</option>
      <option value="2">2 - Poor</option>
      <option value="1">1 - Unacceptable</option>
    </select>

    <label>Hazards & Lease Risks</label>
    <div class="checkbox-grid" id="hazards">
      <label><input type="checkbox" value="Water Damage/Stains"> Water Damage</label>
      <label><input type="checkbox" value="Mold/Mildew"> Mold/Mildew</label>
      <label><input type="checkbox" value="Drafty Windows"> Drafty Windows</label>
      <label><input type="checkbox" value="Pest Signs"> Pest Signs</label>
      <label><input type="checkbox" value="Plumbing Leaks"> Plumbing Leaks</label>
      <label><input type="checkbox" value="Bad Outlets"> Bad Outlets</label>
    </div>

    <label for="photoNotes">Photo Notes & Observations</label>
    <textarea id="photoNotes" rows="3"></textarea>

    <button id="addRoomBtn">Save Room to Report</button>
  </div>

  <div class="card" id="summaryCard">
    <h2>Overall Assessment</h2>
    <div class="summary-stat"><strong>Average Rating:</strong> <span id="avgRatingOut"></span> / 5.0</div>
    <div class="summary-stat"><strong>Global Risks:</strong> <span id="globalRisksOut" style="color:#d32f2f; font-weight:bold;"></span></div>
  </div>

  <div class="card">
    <h2>Logged Rooms</h2>
    <div id="roomList"></div>
    <button id="genBriefBtn" class="secondary">Generate Inspection Brief</button>
  </div>

  <div class="card" id="briefContainer">
    <h2>Inspection Brief</h2>
    <button id="copyBriefBtn" style="margin-top: 0;">Copy to Clipboard</button>
    <pre id="briefOutput"></pre>
  </div>

  <div class="card">
    <button id="clearDataBtn" class="danger">Clear All Data</button>
    <div id="clearConfirmArea">
      <p style="text-align:center; color:#d32f2f; font-weight:bold;">Are you sure? This will delete all saved data.</p>
      <button id="confirmClear" style="background:#d32f2f;">Confirm Delete</button>
      <button id="cancelClear" class="secondary">Cancel</button>
    </div>
  </div>

<script>
  let inspectionData = { address: "", rooms: [] };

  const addressInput = document.getElementById('address');
  const roomName = document.getElementById('roomName');
  const validationMsg = document.getElementById('validationMsg');
  const addRoomBtn = document.getElementById('addRoomBtn');
  const roomList = document.getElementById('roomList');
  const summaryCard = document.getElementById('summaryCard');
  const avgRatingOut = document.getElementById('avgRatingOut');
  const globalRisksOut = document.getElementById('globalRisksOut');
  const genBriefBtn = document.getElementById('genBriefBtn');
  const briefContainer = document.getElementById('briefContainer');
  const briefOutput = document.getElementById('briefOutput');
  const copyBriefBtn = document.getElementById('copyBriefBtn');
  const clearDataBtn = document.getElementById('clearDataBtn');
  const clearConfirmArea = document.getElementById('clearConfirmArea');
  const confirmClear = document.getElementById('confirmClear');
  const cancelClear = document.getElementById('cancelClear');

  const loadData = () => {
    const saved = localStorage.getItem('walkthroughData');
    if (saved) {
      inspectionData = JSON.parse(saved);
      addressInput.value = inspectionData.address || "";
      renderRooms();
    }
  };

  const saveData = () => {
    inspectionData.address = addressInput.value;
    localStorage.setItem('walkthroughData', JSON.stringify(inspectionData));
  };

  const updateSummary = () => {
    if (inspectionData.rooms.length === 0) {
      summaryCard.style.display = 'none';
      return;
    }
    
    summaryCard.style.display = 'block';
    let totalScore = 0;
    let allHazards = new Set();
    
    inspectionData.rooms.forEach(room => {
      totalScore += parseInt(room.rating);
      room.hazards.forEach(h => allHazards.add(h));
    });
    
    const avgScore = (totalScore / inspectionData.rooms.length).toFixed(1);
    avgRatingOut.textContent = avgScore;
    globalRisksOut.textContent = allHazards.size > 0 ? Array.from(allHazards).join(', ') : 'None';
  };

  const renderRooms = () => {
    roomList.textContent = '';
    
    if (inspectionData.rooms.length === 0) {
      const p = document.createElement('p');
      p.textContent = 'No rooms logged yet.';
      roomList.appendChild(p);
      updateSummary();
      return;
    }
    
    inspectionData.rooms.forEach((room, index) => {
      const div = document.createElement('div');
      div.className = 'room-entry';
      
      const h3 = document.createElement('h3');
      h3.textContent = `${room.name} (${room.rating}/5)`;
      
      const hazards = document.createElement('div');
      hazards.style.cssText = 'color:#d32f2f; font-weight:bold; margin-top: 4px;';
      hazards.textContent = room.hazards.length ? `⚠️ ${room.hazards.join(', ')}` : '';
      
      const notes = document.createElement('p');
      notes.style.cssText = 'font-size:13px; margin: 4px 0 0 0;';
      notes.textContent = room.photoNotes ? `📷 ${room.photoNotes}` : '';
      
      const delBtn = document.createElement('button');
      delBtn.style.cssText = 'background:none; color:#d32f2f; padding:0; width:auto; font-size:12px; cursor:pointer; margin-top: 8px;';
      delBtn.textContent = 'Remove';
      delBtn.addEventListener('click', () => {
        inspectionData.rooms.splice(index, 1);
        saveData();
        renderRooms();
      });
      
      div.append(h3, hazards, notes, delBtn);
      roomList.appendChild(div);
    });
    
    updateSummary();
  };

  addRoomBtn.addEventListener('click', () => {
    if (!roomName.value.trim()) {
      validationMsg.style.display = 'block';
      return;
    }
    validationMsg.style.display = 'none';
    
    const checkedHazards = Array.from(document.querySelectorAll('#hazards input:checked')).map(cb => cb.value);
    
    inspectionData.rooms.push({
      name: roomName.value.trim(),
      rating: document.getElementById('rating').value,
      hazards: checkedHazards,
      photoNotes: document.getElementById('photoNotes').value.trim()
    });
    
    saveData();
    renderRooms();
    
    // Reset inputs
    roomName.value = '';
    document.getElementById('rating').value = '5';
    document.getElementById('photoNotes').value = '';
    document.querySelectorAll('#hazards input:checked').forEach(cb => cb.checked = false);
  });

  addressInput.addEventListener('input', saveData);

  genBriefBtn.addEventListener('click', () => {
    let brief = `INSPECTION BRIEF\nProperty: ${inspectionData.address || 'N/A'}\nDate: ${new Date().toLocaleDateString()}\n----------------------------------------\n\n`;
    
    let totalScore = 0;
    let allHazards = new Set();
    
    inspectionData.rooms.forEach(r => {
      totalScore += parseInt(r.rating);
      r.hazards.forEach(h => allHazards.add(h));
      
      brief += `[${r.name.toUpperCase()}] - Rating: ${r.rating}/5\n`;
      if (r.hazards.length) brief += `Risks: ${r.hazards.join(', ')}\n`;
      if (r.photoNotes) brief += `Notes: ${r.photoNotes}\n`;
      brief += `\n`;
    });

    if (inspectionData.rooms.length > 0) {
      const avg = (totalScore / inspectionData.rooms.length).toFixed(1);
      brief += `----------------------------------------\nSUMMARY\nAverage Rating: ${avg} / 5.0\nGlobal Risks: ${allHazards.size > 0 ? Array.from(allHazards).join(', ') : 'None'}\n`;
    }

    briefOutput.textContent = brief;
    briefContainer.style.display = 'block';
  });

  copyBriefBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(briefOutput.textContent);
    copyBriefBtn.textContent = 'Copied!';
    setTimeout(() => copyBriefBtn.textContent = 'Copy to Clipboard', 2000);
  });

  clearDataBtn.addEventListener('click', () => {
    clearDataBtn.style.display = 'none';
    clearConfirmArea.style.display = 'block';
  });

  confirmClear.addEventListener('click', () => {
    localStorage.removeItem('walkthroughData');
    inspectionData = { address: "", rooms: [] };
    addressInput.value = '';
    briefContainer.style.display = 'none';
    clearConfirmArea.style.display = 'none';
    clearDataBtn.style.display = 'block';
    renderRooms();
  });

  cancelClear.addEventListener('click', () => {
    clearConfirmArea.style.display = 'none';
    clearDataBtn.style.display = 'block';
  });

  loadData();
</script>
</body>
</html>
