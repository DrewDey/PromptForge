<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roommate Freezer Board</title>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e2538;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2e3748;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats {
            display: flex;
            gap: 16px;
            font-size: 14px;
        }

        .stat-item {
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            margin-bottom: 20px;
            align-items: center;
        }

        .search-bar {
            width: 100%;
            padding: 10px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .meal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            margin-right: 8px;
        }

        .urgency-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .urgency-high { background-color: rgba(244, 63, 94, 0.2); color: var(--accent-rose); }
        .urgency-medium { background-color: rgba(245, 158, 11, 0.2); color: var(--accent-amber); }
        .urgency-low { background-color: rgba(16, 185, 129, 0.2); color: var(--accent-green); }

        .card-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .portions-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-counter {
            background: var(--border-color);
            color: var(--text-main);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .claims-section {
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
            margin-top: auto;
        }

        .claims-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .claims-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .claim-tag {
            background-color: var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .claim-remove {
            cursor: pointer;
            color: var(--accent-rose);
            font-weight: bold;
        }

        .claim-input-group {
            display: flex;
            gap: 6px;
        }

        .claim-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
            color: var(--text-main);
            font-size: 12px;
        }

        .btn-claim {
            background: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-claim:hover {
            background: #3a4559;
        }

        .card-actions {
            position: absolute;
            top: 16px;
            right: 16px;
            display: none;
        }

        .card:hover .card-actions {
            display: block;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }

        .btn-delete:hover {
            color: var(--accent-rose);
        }

        /* Modal styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }

        .modal-title {
            margin-bottom: 16px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <header>
        <h1>❄️ Freezer Board</h1>
        <div class="stats">
            <div class="stat-item" id="total-meals">Meals: 0</div>
            <div class="stat-item" id="total-portions">Portions: 0</div>
        </div>
    </header>

    <div class="controls">
        <input type="text" id="search" class="search-bar" placeholder="Search meals or roommates...">
        <button class="btn" onclick="openModal()">+ Add Meal</button>
    </div>

    <div class="grid" id="meal-grid"></div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h3 class="modal-title">Log New Freezer Meal</h3>
            <form id="meal-form" onsubmit="saveMeal(event)">
                <div class="form-group">
                    <label for="meal-name">Meal Name</label>
                    <input type="text" id="meal-name" class="form-control" required placeholder="e.g., Lasagna, Chili">
                </div>
                <div class="form-group">
                    <label for="meal-maker">Cooked By</label>
                    <input type="text" id="meal-maker" class="form-control" required placeholder="Your name">
                </div>
                <div class="form-group">
                    <label for="meal-portions">Initial Portions</label>
                    <input type="number" id="meal-portions" class="form-control" min="1" value="4" required>
                </div>
                <div class="form-group">
                    <label for="meal-urgency">Eat-By Urgency</label>
                    <select id="meal-urgency" class="form-control">
                        <option value="low">Low (Freshly Frozen)</option>
                        <option value="medium">Medium (Eat Soon)</option>
                        <option value="high">High (Eat Now!)</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn">Freeze It</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let meals = JSON.parse(localStorage.getItem('freezer_meals')) || [
            { id: 1, name: "Spaghetti Bolognese", maker: "Sarah", portions: 3, urgency: "medium", date: "2026-05-15", claims: ["Alex"] },
            { id: 2, name: "Vegetable Curry", maker: "Alex", portions: 5, urgency: "low", date: "2026-06-01", claims: [] },
            { id: 3, name: "Chicken Noodle Soup", maker: "Jamie", portions: 1, urgency: "high", date: "2026-04-10", claims: [] }
        ];

        const grid = document.getElementById('meal-grid');
        const searchInput = document.getElementById('search');

        function render() {
            const query = searchInput.value.toLowerCase();
            grid.innerHTML = '';
            
            let filteredMeals = meals.filter(meal => 
                meal.name.toLowerCase().includes(query) || 
                meal.maker.toLowerCase().includes(query) ||
                meal.claims.some(c => c.toLowerCase().includes(query))
            );

            // Sort high urgency to top
            const urgencyOrder = { high: 1, medium: 2, low: 3 };
            filteredMeals.sort((a, b) => urgencyOrder[a.urgency] - urgencyOrder[b.urgency]);

            filteredMeals.forEach(meal => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const claimsHtml = meal.claims.map((claim, idx) => `
                    <div class="claim-tag">
                        <span>${claim}</span>
                        <span class="claim-remove" onclick="removeClaim(${meal.id}, ${idx})">&times;</span>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="card-header">
                        <div class="meal-title">${meal.name}</div>
                        <span class="urgency-badge urgency-${meal.urgency}">${meal.urgency}</span>
                    </div>
                    <div class="card-meta">
                        <div>Made by: <strong>${meal.maker}</strong></div>
                        <div>Date: ${meal.date}</div>
                    </div>
                    <div class="portions-control">
                        <span>Portions left:</span>
                        <div class="counter">
                            <button class="btn-counter" onclick="updatePortions(${meal.id}, -1)">-</button>
                            <strong>${meal.portions}</strong>
                            <button class="btn-counter" onclick="updatePortions(${meal.id}, 1)">+</button>
                        </div>
                    </div>
                    <div class="claims-section">
                        <div class="claims-title">Claimed By</div>
                        <div class="claims-list">${claimsHtml || '<span style="font-size:12px; color:var(--text-muted); font-style:italic;">No claims yet</span>'}</div>
                        <div class="claim-input-group">
                            <input type="text" placeholder="Name" class="claim-input" id="input-claim-${meal.id}">
                            <button class="btn-claim" onclick="addClaim(${meal.id})">Claim</button>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-delete" onclick="deleteMeal(${meal.id})">&times;</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            updateStats();
            localStorage.setItem('freezer_meals', JSON.stringify(meals));
        }

        function updateStats() {
            document.getElementById('total-meals').textContent = `Meals: ${meals.length}`;
            document.getElementById('total-portions').textContent = `Portions: ${meals.reduce((sum, m) => sum + m.portions, 0)}`;
        }

        function updatePortions(id, amount) {
            const meal = meals.find(m => m.id === id);
            if (meal) {
                meal.portions = Math.max(0, meal.portions + amount);
                render();
            }
        }

        function addClaim(id) {
            const input = document.getElementById(`input-claim-${id}`);
            const name = input.value.trim();
            if (name) {
                const meal = meals.find(m => m.id === id);
                if (meal) {
                    meal.claims.push(name);
                    input.value = '';
                    render();
                }
            }
        }

        function removeClaim(id, index) {
            const meal = meals.find(m => m.id === id);
            if (meal) {
                meal.claims.splice(index, 1);
                render();
            }
        }

        function deleteMeal(id) {
            meals = meals.filter(m => m.id !== id);
            render();
        }

        function openModal() {
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('meal-form').reset();
        }

        function saveMeal(e) {
            e.preventDefault();
            const name = document.getElementById('meal-name').value;
            const maker = document.getElementById('meal-maker').value;
            const portions = parseInt(document.getElementById('meal-portions').value);
            const urgency = document.getElementById('meal-urgency').value;
            const date = new Date().toISOString().split('T')[0];

            meals.push({
                id: Date.now(),
                name,
                maker,
                portions,
                urgency,
                date,
                claims: []
            });

            closeModal();
            render();
        }

        searchInput.addEventListener('input', render);
        render();
    </script>
</body>
</html>
