<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope Change Evaluator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 font-sans selection:bg-teal-500 selection:text-gray-900">

    <div class="max-w-md mx-auto bg-gray-800 rounded-xl shadow-2xl border border-gray-700 p-5 space-y-6">
        
        <div>
            <h1 class="text-xl font-bold text-teal-400">Scope Change Evaluator</h1>
            <p class="text-xs text-gray-400 mt-1">Assess new requests and generate change orders instantly.</p>
        </div>

        <hr class="border-gray-700">

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1">Project/Client Name</label>
                <input id="clientName" type="text" placeholder="Acme Corp Website" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-sm text-gray-100 focus:outline-none focus:border-teal-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1">Original Agreed Scope</label>
                <textarea id="originalScope" rows="2" placeholder="3 landing pages with standard contact form" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-sm text-gray-100 focus:outline-none focus:border-teal-500"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1">New Client Request</label>
                <textarea id="newRequest" rows="2" placeholder="Add custom user dashboard with auth and database" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-sm text-gray-100 focus:outline-none focus:border-teal-500"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1">Base Added Hours</label>
                    <input id="baseHours" type="number" value="5" min="0" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-sm text-gray-100 focus:outline-none focus:border-teal-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1">Hourly Rate ($)</label>
                    <input id="hourlyRate" type="number" value="100" min="0" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-sm text-gray-100 focus:outline-none focus:border-teal-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1">Risk Level (Scope Creep/Complexity)</label>
                <select id="riskLevel" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-sm text-gray-100 focus:outline-none focus:border-teal-500">
                    <option value="1">Low (+0% buffer)</option>
                    <option value="1.25" selected>Medium (+25% buffer)</option>
                    <option value="1.5">High (+50% buffer)</option>
                </select>
            </div>
        </div>

        <button onclick="calculateChangeOrder()" class="w-full bg-teal-500 hover:bg-teal-400 text-gray-950 font-bold py-2.5 px-4 rounded text-sm transition duration-150">
            Generate Change Order
        </button>

        <div id="outputSection" class="hidden space-y-5 pt-2">
            <hr class="border-gray-700">
            
            <div class="bg-gray-950 p-4 rounded border border-gray-800 space-y-2">
                <h3 class="text-xs font-bold text-teal-400 uppercase tracking-wider">Internal Metrics</h3>
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <div>Total Billable Hours: <span id="outHours" class="font-bold text-white">0</span></div>
                    <div>Total Added Cost: <span id="outCost" class="font-bold text-white">$0</span></div>
                </div>
            </div>

            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-gray-300 uppercase tracking-wider">Client-Ready Note</label>
                    <button onclick="copyNote()" class="text-xs text-teal-400 hover:text-teal-300 font-medium focus:outline-none">
                        Copy Note
                    </button>
                </div>
                <textarea id="clientNote" rows="8" readonly class="w-full bg-gray-950 border border-gray-800 rounded p-3 text-xs text-gray-300 focus:outline-none leading-relaxed select-all"></textarea>
            </div>
            
            <div id="toast" class="hidden text-center text-xs text-teal-400 font-medium">Note copied to clipboard!</div>
        </div>
    </div>

    <script>
        function calculateChangeOrder() {
            // Get inputs
            const clientName = document.getElementById('clientName').value || 'Project';
            const originalScope = document.getElementById('originalScope').value || 'As previously outlined';
            const newRequest = document.getElementById('newRequest').value || 'Additional features';
            const baseHours = parseFloat(document.getElementById('baseHours').value) || 0;
            const hourlyRate = parseFloat(document.getElementById('hourlyRate').value) || 0;
            const riskMultiplier = parseFloat(document.getElementById('riskLevel').value) || 1;

            // Calculations
            const finalHours = Math.round((baseHours * riskMultiplier) * 10) / 10;
            const finalCost = Math.round(finalHours * hourlyRate);

            // Update Metrics
            document.getElementById('outHours').innerText = finalHours + ' hrs';
            document.getElementById('outCost').innerText = '$' + finalCost.toLocaleString();

            // Generate Client Note
            const noteText = `Hi Team,\n\nThanks for reaching out about adding these features to ${clientName}. \n\nTo ensure we maintain the timeline and quality of the original agreement (${originalScope}), we will treat this new request (${newRequest}) as a formal change order.\n\nHere is the estimate for the additional work:\n• Estimated Added Effort: ${finalHours} hours\n• Total Additional Cost: $${finalCost.toLocaleString()}\n\nIf you would like to proceed with adding this to the scope, let me know and I will send over an updated invoice/addendum so we can kick off this portion of the build.\n\nBest regards,`;

            document.getElementById('clientNote').value = noteText;

            // Reveal Output
            document.getElementById('outputSection').classList.remove('hidden');
        }

        function copyNote() {
            const copyText = document.getElementById("clientNote");
            copyText.select();
            copyText.setSelectionRange(0, 99999); // For mobile devices
            navigator.clipboard.writeText(copyText.value);

            // Toast feedback
            const toast = document.getElementById("toast");
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2000);
        }
    </script>
</body>
</html>
