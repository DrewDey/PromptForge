<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope Change Evaluator</title>
    <style>
        /* Modern Dark Theme Variables & Base Styles */
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #020617;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #14b8a6;
            --accent-hover: #2dd4bf;
            --accent-dim: #0f766e;
            --danger: #ef4444;
            --danger-hover: #f87171;
            
            /* Risk Badge Colors */
            --badge-low-bg: #065f46;
            --badge-low-text: #34d399;
            --badge-med-bg: #92400e;
            --badge-med-text: #fbbf24;
            --badge-high-bg: #991b1b;
            --badge-high-text: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 32rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Typography & Layout */
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        hr {
            border: 0;
            border-top: 1px solid var(--border-color);
            margin: 1.25rem 0;
        }

        .space-y {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }

        /* Form Controls */
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        input, textarea, select {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 0.25rem;
            padding: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-main);
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Dynamic Line Item Container Styles */
        .item-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .line-item-row {
            display: grid;
            grid-template-columns: 1fr 4.5rem 5.5rem 2rem;
            gap: 0.5rem;
            align-items: center;
            background-color: rgba(2, 6, 23, 0.4);
            padding: 0.5rem;
            border-radius: 0.25rem;
            border: 1px solid var(--border-color);
            margin-bottom: 0.5rem;
        }

        /* Buttons */
        .btn {
            width: 100%;
            background-color: var(--accent);
            color: var(--bg-input);
            font-weight: 700;
            font-size: 0.875rem;
            padding: 0.625rem 1rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            font-weight: 500;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            border-radius: 0.25rem;
            cursor: pointer;
            width: auto;
        }

        .btn-secondary:hover {
            background-color: rgba(20, 184, 166, 0.1);
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            font-weight: 700;
            font-size: 0.875rem;
            height: 2.125rem;
            width: 100%;
            border-radius: 0.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-danger:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* Output Area */
        .hidden {
            display: none !important;
        }

        .metrics-panel {
            background-color: var(--bg-input);
            padding: 1rem;
            border-radius: 0.25rem;
            border: 1px solid #1e293b;
        }

        .metrics-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .metrics-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Risk Badges */
        .risk-badge {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            letter-spacing: 0.05em;
        }

        .risk-low { background-color: var(--badge-low-bg); color: var(--badge-low-text); }
        .risk-med { background-color: var(--badge-med-bg); color: var(--badge-med-text); }
        .risk-high { background-color: var(--badge-high-bg); color: var(--badge-high-text); }

        .metrics-grid {
            display: grid;
            grid-template-cols: repeat(2, minmax(0, 1fr));
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .val {
            font-weight: 700;
            color: #ffffff;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem;
        }

        .action-group {
            display: flex;
            gap: 0.5rem;
        }

        #toast {
            text-align: center;
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 500;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <h1>Scope Change Evaluator</h1>
            <p class="subtitle">Assess custom multi-item requests and track cumulative project risk.</p>
        </div>

        <hr>

        <div class="space-y">
            <div class="grid-2">
                <div>
                    <label for="clientName">Client/Project</label>
                    <input id="clientName" type="text" placeholder="Acme Corp Website">
                </div>
                <div>
                    <label for="hourlyRate">Hourly Rate ($)</label>
                    <input id="hourlyRate" type="number" value="100" min="0">
                </div>
            </div>

            <div>
                <label for="originalScope">Original Scope Context</label>
                <input id="originalScope" type="text" placeholder="3 landing pages with standard contact form">
            </div>

            <div>
                <div class="item-list-header">
                    <label>Requested Additions</label>
                    <button id="addItemBtn" type="button" class="btn-secondary">+ Add Item</button>
                </div>
                <div id="lineItemsContainer">
                    </div>
            </div>

            <button id="calcBtn" class="btn">Generate Change Order</button>
        </div>

        <div id="outputSection" class="hidden">
            <hr>
            <div class="space-y">
                <div class="metrics-panel">
                    <div class="metrics-header">
                        <div class="metrics-title">Internal Cumulative Profile</div>
                        <span id="riskBadge" class="risk-badge">Low</span>
                    </div>
                    <div class="metrics-grid">
                        <div>Total Billable Hours: <span id="outHours" class="val">0 hrs</span></div>
                        <div>Total Added Cost: <span id="outCost" class="val">$0</span></div>
                    </div>
                </div>

                <div>
                    <div class="output-header">
                        <label for="clientNote">Client-Ready Note</label>
                        <div class="action-group">
                            <button id="copyBtn" class="btn-secondary">Copy Note</button>
                            <button id="exportBtn" class="btn-secondary">Export TXT</button>
                        </div>
                    </div>
                    <textarea id="clientNote" rows="9" readonly></textarea>
                </div>
                
                <div id="toast" class="hidden"></div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // Elements
            const calcBtn = document.getElementById('calcBtn');
            const copyBtn = document.getElementById('copyBtn');
            const exportBtn = document.getElementById('exportBtn');
            const addItemBtn = document.getElementById('addItemBtn');
            const lineItemsContainer = document.getElementById('lineItemsContainer');
            const outputSection = document.getElementById('outputSection');
            const toast = document.getElementById('toast');

            const clientNameInput = document.getElementById('clientName');
            const originalScopeInput = document.getElementById('originalScope');
            const hourlyRateInput = document.getElementById('hourlyRate');

            const riskBadge = document.getElementById('riskBadge');
            const outHours = document.getElementById('outHours');
            const outCost = document.getElementById('outCost');
            const clientNote = document.getElementById('clientNote');

            let toastTimeout;

            // Initial row configuration mapping values to human text
            const riskMap = {
                "1": "Low",
                "1.25": "Med",
                "1.5": "High"
            };

            // Inject an editable line item row row logic safely with vanilla elements
            function createLineItemRow(description = "", hours = "5", risk = "1.25") {
                const row = document.createElement('div');
                row.className = 'line-item-row';

                const descInput = document.createElement('input');
                descInput.type = 'text';
                descInput.placeholder = 'e.g., Custom user dashboard';
                descInput.value = description;
                descInput.className = 'item-desc';

                const hoursInput = document.createElement('input');
                hoursInput.type = 'number';
                hoursInput.min = '0';
                hoursInput.value = hours;
                hoursInput.className = 'item-hours';

                const riskSelect = document.createElement('select');
                riskSelect.className = 'item-risk';
                
                Object.keys(riskMap).forEach(val => {
                    const option = document.createElement('option');
                    option.value = val;
                    option.textContent = riskMap[val];
                    if(val === risk) option.selected = true;
                    riskSelect.appendChild(option);
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'btn-danger';
                deleteBtn.textContent = '×';
                deleteBtn.addEventListener('click', function() {
                    row.remove();
                });

                row.appendChild(descInput);
                row.appendChild(hoursInput);
                row.appendChild(riskSelect);
                row.appendChild(deleteBtn);

                lineItemsContainer.appendChild(row);
            }

            // Calculations & Aggregations
            function calculateChangeOrder() {
                const clientName = clientNameInput.value.trim() || 'Project';
                const originalScope = originalScopeInput.value.trim() || 'As previously outlined';
                const hourlyRate = parseFloat(hourlyRateInput.value) || 0;

                const targetRows = lineItemsContainer.querySelectorAll('.line-item-row');
                
                let combinedRawHours = 0;
                let combinedCalculatedHours = 0;
                let textItemsList = [];

                targetRows.forEach(row => {
                    const desc = row.querySelector('.item-desc').value.trim() || 'Additional Feature Modification';
                    const baseHours = parseFloat(row.querySelector('.item-hours').value) || 0;
                    const multiplier = parseFloat(row.querySelector('.item-risk').value) || 1;

                    const evaluatedItemHours = Math.round((baseHours * multiplier) * 10) / 10;
                    
                    combinedRawHours += baseHours;
                    combinedCalculatedHours += evaluatedItemHours;

                    textItemsList.push(`• ${desc}: ~${evaluatedItemHours} hours`);
                });

                // Fail-safe handling for empty requests list
                if(textItemsList.length === 0) {
                    textItemsList.push('• General scope modifications');
                }

                const finalCost = Math.round(combinedCalculatedHours * hourlyRate);

                // Update UI numerical metrics
                outHours.textContent = combinedCalculatedHours.toFixed(1) + ' hrs';
                outCost.textContent = '$' + finalCost.toLocaleString();

                // Dynamic Risk Badge Assignment Metrics Logic
                // Evaluated using the average risk weight added across inputs
                const aggregateRiskFactor = combinedRawHours > 0 ? (combinedCalculatedHours / combinedRawHours) : 1;
                
                riskBadge.className = 'risk-badge'; // reset class
                if (aggregateRiskFactor <= 1.1) {
                    riskBadge.textContent = 'Low Risk';
                    riskBadge.classList.add('risk-low');
                } else if (aggregateRiskFactor <= 1.35) {
                    riskBadge.textContent = 'Medium Risk';
                    riskBadge.classList.add('risk-med');
                } else {
                    riskBadge.textContent = 'High Risk';
                    riskBadge.classList.add('risk-high');
                }

                // Construct Note Structure
                const noteText = `Hi Team,\n\nThanks for reaching out about adding these features to ${clientName}.\n\nTo ensure we maintain the timeline and quality of the original agreement (${originalScope}), we will treat these additions as a formal change order:\n\n${textItemsList.join('\n')}\n\nSummary total for scope update:\n• Total Estimated Effort: ${combinedCalculatedHours.toFixed(1)} hours\n• Total Additional Cost: $${finalCost.toLocaleString()}\n\nIf you would like to proceed with modifying the scope to include these items, let me know and I will send over an updated project addendum.\n\nBest regards,`;

                clientNote.value = noteText;
                outputSection.classList.remove('hidden');
            }

            // Clipboard Action
            function copyToClipboard() {
                clientNote.select();
                clientNote.setSelectionRange(0, 99999);
                
                try {
                    navigator.clipboard.writeText(clientNote.value);
                    showToast('Note copied to clipboard!');
                } catch (err) {
                    showToast('Failed to copy text.');
                }
            }

            // File Export Action
            function exportAsFile() {
                const text = clientNote.value;
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                
                const cleanName = (clientNameInput.value.trim() || 'Project')
                    .replace(/[^a-z0-9]/gi, '_')
                    .toLowerCase();
                
                const link = document.createElement('a');
                link.href = url;
                link.download = `change_order_${cleanName}.txt`;
                document.body.appendChild(link);
                link.click();
                
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast('TXT file downloaded successfully.');
            }

            // Feedback Display
            function showToast(message) {
                clearTimeout(toastTimeout);
                toast.textContent = message;
                toast.classList.remove('hidden');
                toastTimeout = setTimeout(() => {
                    toast.classList.add('hidden');
                }, 2500);
            }

            // Initialize App Event Listeners
            calcBtn.addEventListener('click', calculateChangeOrder);
            copyBtn.addEventListener('click', copyToClipboard);
            exportBtn.addEventListener('click', exportAsFile);
            addItemBtn.addEventListener('click', function() {
                createLineItemRow();
            });

            // Populate document with an initial item structure default row configuration
            createLineItemRow("Custom User Dashboard", "8", "1.25");

        })();
    </script>
</body>
</html>
