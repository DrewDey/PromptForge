<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roommate Errand Board</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --surface-hover: #2a2a2a;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --danger-color: #cf6679;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--secondary-color);
            border: 1px solid var(--secondary-color);
        }

        .btn-secondary:hover {
            background-color: rgba(3, 218, 198, 0.1);
        }

        .form-container {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .errand-form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
        }

        @media (max-width: 600px) {
            .errand-form {
                grid-template-columns: 1fr;
            }
        }

        input {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .errand-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .errand-item {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .errand-item.dragging {
            opacity: 0.4;
            transform: scale(0.98);
        }

        .drag-handle {
            color: var(--text-muted);
            font-size: 1.2rem;
            user-select: none;
            cursor: grab;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .errand-details {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 2fr 1fr 2fr;
            align-items: center;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .errand-details {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }

        /* Inline Edit Fields */
        .editable-field {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 4px;
            width: 100%;
            font-size: 0.95rem;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .editable-field:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: #444;
        }

        .editable-field:focus {
            background-color: var(--bg-color);
            border-color: var(--primary-color);
            outline: none;
        }

        .editable-field.stop-name {
            font-weight: 500;
        }

        .editable-field.assignee {
            color: var(--secondary-color);
        }

        .editable-field.notes {
            color: var(--text-muted);
            font-style: italic;
        }

        .actions {
            display: flex;
            align-items: center;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background-color: rgba(207, 102, 121, 0.1);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-style: italic;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--secondary-color);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Roommate Errand Board</h1>
            <button class="btn btn-secondary" onclick="copyRoutePlan()">Copy Route Plan</button>
        </header>

        <div class="form-container">
            <form id="errandForm" class="errand-form" onsubmit="addErrand(event)">
                <input type="text" id="stopName" placeholder="Where to? (e.g., Kroger, Post Office)" required>
                <input type="text" id="assignee" placeholder="Who's going?" required>
                <input type="text" id="notes" placeholder="Notes (e.g., milk, return package)">
                <button type="submit" class="btn">Add Stop</button>
            </form>
        </div>

        <div id="errandList" class="errand-list"></div>
        <div id="emptyState" class="empty-state" style="display: none;">No errands listed. Add one above to get started.</div>
    </div>

    <div id="toast" class="toast">Route plan copied to clipboard!</div>

    <script>
        let errands = JSON.parse(localStorage.getItem('roommateErrands')) || [];

        function saveErrands() {
            localStorage.setItem('roommateErrands', JSON.stringify(errands));
        }

        function addErrand(e) {
            e.preventDefault();
            const stopName = document.getElementById('stopName').value.trim();
            const assignee = document.getElementById('assignee').value.trim();
            const notes = document.getElementById('notes').value.trim();

            if (!stopName || !assignee) return;

            errands.push({
                id: Date.now().toString(),
                stopName,
                assignee,
                notes
            });

            document.getElementById('errandForm').reset();
            saveErrands();
            renderErrands();
        }

        function updateField(id, field, value) {
            const errand = errands.find(e => e.id === id);
            if (errand) {
                errand[field] = value.trim();
                saveErrands();
            }
        }

        function deleteErrand(id) {
            errands = errands.filter(errand => errand.id !== id);
            saveErrands();
            renderErrands();
        }

        function renderErrands() {
            const list = document.getElementById('errandList');
            const emptyState = document.getElementById('emptyState');
            list.innerHTML = '';

            if (errands.length === 0) {
                emptyState.style.display = 'block';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            errands.forEach((errand) => {
                const item = document.createElement('div');
                item.className = 'errand-item';
                item.dataset.id = errand.id;

                item.innerHTML = `
                    <div class="drag-handle" draggable="true">☰</div>
                    <div class="errand-details">
                        <input type="text" class="editable-field stop-name" value="${escapeHtml(errand.stopName)}" placeholder="Stop name" onchange="updateField('${errand.id}', 'stopName', this.value)">
                        <input type="text" class="editable-field assignee" value="${escapeHtml(errand.assignee)}" placeholder="Assignee" onchange="updateField('${errand.id}', 'assignee', this.value)">
                        <input type="text" class="editable-field notes" value="${escapeHtml(errand.notes)}" placeholder="Add notes..." onchange="updateField('${errand.id}', 'notes', this.value)">
                    </div>
                    <div class="actions">
                        <button class="delete-btn" onclick="deleteErrand('${errand.id}')" title="Remove stop">✕</button>
                    </div>
                `;

                setupDragAndDrop(item);
                list.appendChild(item);
            });
        }

        function setupDragAndDrop(item) {
            const handle = item.querySelector('.drag-handle');

            handle.addEventListener('dragstart', (e) => {
                item.classList.add('dragging');
                e.dataTransfer.setData('text/plain', item.dataset.id);
            });

            handle.addEventListener('dragend', () => {
                item.classList.remove('dragging');
                reorderErrands();
            });
        }

        const listContainer = document.getElementById('errandList');
        listContainer.addEventListener('dragover', e => {
            e.preventDefault();
            const dragging = document.querySelector('.dragging');
            if (!dragging) return;

            const afterElement = getDragAfterElement(listContainer, e.clientY);
            if (afterElement == null) {
                listContainer.appendChild(dragging);
            } else {
                listContainer.insertBefore(dragging, afterElement);
            }
        });

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.errand-item:not(.dragging)')];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: -Infinity }).element;
        }

        function reorderErrands() {
            const currentIds = [...listContainer.querySelectorAll('.errand-item')].map(item => item.dataset.id);
            errands = currentIds.map(id => errands.find(errand => errand.id === id));
            saveErrands();
        }

        function copyRoutePlan() {
            if (errands.length === 0) return;

            let planText = `📍 ERRAND ROUTE PLAN - ${new Date().toLocaleDateString()}\n`;
            planText += `====================================\n\n`;

            errands.forEach((errand, index) => {
                const stop = errand.stopName || '(Unspecified Stop)';
                const driver = errand.assignee || '(Unassigned)';

                planText += `${index + 1}. ${stop.toUpperCase()}\n`;
                planText += `   Driver: ${driver}\n`;
                if (errand.notes) {
                    planText += `   Notes: ${errand.notes}\n`;
                }
                planText += `\n`;
            });

            navigator.clipboard.writeText(planText).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initial render
        renderErrands();
    </script>
</body>
</html>
