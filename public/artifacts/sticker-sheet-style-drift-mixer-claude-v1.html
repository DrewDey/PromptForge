<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticker Sheet Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,700;1,400&display=swap');

  :root {
    --ink: #1A1A2E;
    --ink-mid: #2D2D4E;
    --ink-soft: #3D3D60;
    --canvas: #F7F5EE;
    --canvas-dim: #EEEBe1;
    --coral: #FF6B6B;
    --mint: #00D9A3;
    --lavender: #C4B5FD;
    --amber: #FFB347;
    --text-on-ink: #E8E6FF;
    --text-dim: #9B98BB;
    --border: rgba(196,181,253,0.18);
    --card-bg: #22224A;
    --drift-good: #00D9A3;
    --drift-warn: #FFB347;
    --drift-bad: #FF6B6B;
    --radius: 10px;
    --font-ui: 'Space Grotesk', system-ui, sans-serif;
    --font-display: 'Fraunces', Georgia, serif;
    --panel-w: 260px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    background: var(--ink);
    color: var(--text-on-ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ── TOP BAR ── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: var(--ink);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar-logo {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--lavender);
    letter-spacing: -0.3px;
  }
  .topbar-logo em { font-style: italic; color: var(--coral); }
  .topbar-spacer { flex: 1; }
  .topbar-sheet-name {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    color: var(--text-on-ink);
    font-family: var(--font-ui);
    font-size: 13px;
    width: 180px;
    outline: none;
  }
  .topbar-sheet-name:focus { border-color: var(--lavender); }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 7px;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .btn-ghost:hover { border-color: var(--lavender); color: var(--lavender); }
  .btn-coral { background: var(--coral); color: #fff; }
  .btn-coral:hover { opacity: .88; }
  .btn-mint { background: var(--mint); color: var(--ink); }
  .btn-mint:hover { opacity: .88; }

  /* ── LAYOUT ── */
  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── LEFT SIDEBAR ── */
  .sidebar {
    width: var(--panel-w);
    min-width: var(--panel-w);
    background: var(--ink-mid);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 18px 14px 80px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .sidebar-section { display: flex; flex-direction: column; gap: 10px; }
  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-dim);
    padding-bottom: 2px;
    border-bottom: 1px solid var(--border);
  }
  .field-row { display: flex; flex-direction: column; gap: 4px; }
  .field-label { font-size: 11px; color: var(--text-dim); font-weight: 500; }
  .field-input {
    background: var(--ink-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 9px;
    color: var(--text-on-ink);
    font-family: var(--font-ui);
    font-size: 12px;
    outline: none;
    width: 100%;
    transition: border-color .15s;
  }
  .field-input:focus { border-color: var(--lavender); }
  textarea.field-input { resize: vertical; min-height: 62px; line-height: 1.5; }
  select.field-input { cursor: pointer; }

  /* Color palette editor */
  .palette-row {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    align-items: center;
  }
  .swatch-wrap { position: relative; }
  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: border-color .15s, transform .12s;
    padding: 0;
    overflow: hidden;
    display: block;
  }
  .swatch:hover { transform: scale(1.15); border-color: rgba(255,255,255,0.4); }
  .swatch input[type=color] {
    opacity: 0;
    position: absolute;
    inset: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
    border: none;
    padding: 0;
  }
  .swatch-add {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px dashed var(--text-dim);
    background: transparent;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, color .15s;
    line-height: 1;
  }
  .swatch-add:hover { border-color: var(--lavender); color: var(--lavender); }

  /* Constraint chips */
  .chips-area { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: var(--ink-soft);
    color: var(--text-on-ink);
    border: 1px solid var(--border);
    cursor: default;
    user-select: none;
  }
  .chip-remove {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 12px;
    padding: 0;
    line-height: 1;
    display: flex;
    align-items: center;
  }
  .chip-remove:hover { color: var(--coral); }
  .chip-add-row { display: flex; gap: 6px; margin-top: 2px; }
  .chip-input {
    flex: 1;
    background: var(--ink-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    color: var(--text-on-ink);
    font-family: var(--font-ui);
    font-size: 11px;
    outline: none;
  }
  .chip-input:focus { border-color: var(--lavender); }
  .btn-chip-add {
    background: var(--lavender);
    color: var(--ink);
    border: none;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 700;
    transition: opacity .15s;
  }
  .btn-chip-add:hover { opacity: .8; }

  /* Style presets */
  .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .preset-btn {
    background: var(--ink-soft);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 8px 6px;
    color: var(--text-on-ink);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: border-color .15s, background .15s;
  }
  .preset-btn:hover, .preset-btn.active {
    border-color: var(--lavender);
    background: rgba(196,181,253,0.12);
    color: var(--lavender);
  }

  /* ── MAIN GRID ── */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px 100px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .grid-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .grid-title {
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--canvas);
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .sticker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }

  /* ── STICKER CARD ── */
  .sticker-card {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    transition: border-color .2s, box-shadow .2s;
    position: relative;
  }
  .sticker-card:hover { border-color: rgba(196,181,253,0.45); }
  .sticker-card.drifting { border-color: rgba(255,107,107,0.55); }
  .sticker-card.aligned { border-color: rgba(0,217,163,0.45); }

  .card-top { display: flex; align-items: center; gap: 8px; }
  .card-num {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    min-width: 18px;
  }
  .card-title {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-on-ink);
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 600;
  }
  .card-title::placeholder { color: var(--text-dim); font-weight: 400; }

  /* Drift meter pill */
  .drift-meter {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
    flex-shrink: 0;
  }
  .drift-label { font-size: 9px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
  .drift-bar-wrap {
    width: 48px;
    height: 5px;
    background: rgba(255,255,255,0.1);
    border-radius: 999px;
    overflow: hidden;
  }
  .drift-bar {
    height: 100%;
    border-radius: 999px;
    transition: width .4s, background .4s;
  }

  .card-desc {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
    color: var(--text-on-ink);
    font-family: var(--font-ui);
    font-size: 12px;
    resize: none;
    outline: none;
    min-height: 54px;
    line-height: 1.5;
    width: 100%;
    transition: border-color .15s;
  }
  .card-desc:focus { border-color: var(--lavender); }
  .card-desc::placeholder { color: var(--text-dim); }

  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(196,181,253,0.15);
    color: var(--lavender);
    font-weight: 600;
    border: 1px solid rgba(196,181,253,0.25);
    cursor: pointer;
    transition: background .15s;
  }
  .tag:hover { background: rgba(196,181,253,0.28); }
  .tag-add {
    font-size: 11px;
    background: transparent;
    border: 1px dashed var(--text-dim);
    border-radius: 999px;
    color: var(--text-dim);
    padding: 2px 7px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .tag-add:hover { border-color: var(--lavender); color: var(--lavender); }

  .card-meta {
    display: flex;
    gap: 7px;
    align-items: center;
  }
  .card-meta select {
    flex: 1;
    background: var(--ink-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 7px;
    color: var(--text-on-ink);
    font-family: var(--font-ui);
    font-size: 11px;
    outline: none;
    cursor: pointer;
  }
  .card-flag {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: opacity .15s;
  }
  .card-flag.flagged { background: rgba(255,107,107,0.2); color: var(--coral); }
  .card-flag.ok { background: rgba(0,217,163,0.15); color: var(--mint); }

  /* ── BRIEF PANEL (bottom) ── */
  .brief-bar {
    position: fixed;
    bottom: 0;
    left: var(--panel-w);
    right: 0;
    background: var(--ink-mid);
    border-top: 1px solid var(--border);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 40;
  }
  .brief-bar-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .brief-preview {
    flex: 1;
    font-size: 12px;
    color: var(--text-on-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: .7;
  }

  /* ── BRIEF MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,28,0.82);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 0;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--ink-mid);
    border: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    width: 100%;
    max-width: 680px;
    padding: 24px 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--canvas);
    font-weight: 700;
  }
  .modal-close {
    background: var(--ink-soft);
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .brief-output {
    background: var(--ink);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    font-size: 12px;
    line-height: 1.75;
    color: var(--text-on-ink);
    white-space: pre-wrap;
    font-family: 'Courier New', monospace;
    max-height: 340px;
    overflow-y: auto;
  }
  .brief-actions { display: flex; gap: 10px; }

  /* Toast */
  .toast {
    position: fixed;
    top: 60px;
    right: 20px;
    background: var(--mint);
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
    padding: 9px 18px;
    border-radius: 8px;
    z-index: 9999;
    transform: translateX(120%);
    transition: transform .25s;
    pointer-events: none;
  }
  .toast.show { transform: translateX(0); }

  /* Drift legend */
  .drift-legend {
    display: flex;
    gap: 12px;
    font-size: 10px;
    color: var(--text-dim);
    align-items: center;
    margin-left: auto;
  }
  .drift-legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 3px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--ink-soft); border-radius: 10px; }

  /* Focus ring */
  *:focus-visible { outline: 2px solid var(--lavender); outline-offset: 2px; }
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <span class="topbar-logo"><em>sticker</em>sheet</span>
  <input class="topbar-sheet-name" id="sheetName" type="text" value="My Brand Sheet" placeholder="Sheet name…">
  <div class="topbar-spacer"></div>
  <button class="btn btn-ghost" onclick="loadSample()">⚡ Load Sample</button>
  <button class="btn btn-mint" onclick="openBriefModal()">📋 Production Brief</button>
</header>

<!-- WORKSPACE -->
<div class="workspace">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- THEME -->
    <div class="sidebar-section">
      <div class="section-label">Theme</div>
      <div class="field-row">
        <div class="field-label">Brand Name</div>
        <input class="field-input" id="brandName" type="text" value="" placeholder="e.g. Mossy Peak Co.">
      </div>
      <div class="field-row">
        <div class="field-label">Vibe / Aesthetic</div>
        <input class="field-input" id="vibe" type="text" value="" placeholder="e.g. cottagecore, bold retro…">
      </div>
      <div class="field-row">
        <div class="field-label">Target Audience</div>
        <input class="field-input" id="audience" type="text" value="" placeholder="e.g. outdoor enthusiasts, teens…">
      </div>
    </div>

    <!-- STYLE PRESETS -->
    <div class="sidebar-section">
      <div class="section-label">Style Preset</div>
      <div class="preset-grid" id="presetGrid">
        <button class="preset-btn" data-preset="retro" onclick="applyPreset(this)">🎠 Retro</button>
        <button class="preset-btn" data-preset="minimal" onclick="applyPreset(this)">◻ Minimal</button>
        <button class="preset-btn" data-preset="cottage" onclick="applyPreset(this)">🌿 Cottage</button>
        <button class="preset-btn" data-preset="cyber" onclick="applyPreset(this)">⚡ Cyber</button>
        <button class="preset-btn" data-preset="kawaii" onclick="applyPreset(this)">🌸 Kawaii</button>
        <button class="preset-btn" data-preset="bold" onclick="applyPreset(this)">🔥 Bold</button>
      </div>
    </div>

    <!-- STYLE RULES -->
    <div class="sidebar-section">
      <div class="section-label">Style Rules</div>
      <div class="field-row">
        <div class="field-label">Mood words (comma-sep)</div>
        <input class="field-input" id="moodWords" type="text" value="" placeholder="e.g. playful, warm, cozy…">
      </div>
      <div class="field-row">
        <div class="field-label">Design rules (one per line)</div>
        <textarea class="field-input" id="styleRules" placeholder="No harsh lines&#10;Rounded shapes only&#10;Nature motifs preferred"></textarea>
      </div>
    </div>

    <!-- PALETTE -->
    <div class="sidebar-section">
      <div class="section-label">Brand Palette</div>
      <div class="palette-row" id="paletteRow"></div>
    </div>

    <!-- CONSTRAINTS -->
    <div class="sidebar-section">
      <div class="section-label">Constraints</div>
      <div class="chips-area" id="constraintChips"></div>
      <div class="chip-add-row">
        <input class="chip-input" id="newChipInput" type="text" placeholder="Add constraint…" onkeydown="if(event.key==='Enter') addChip()">
        <button class="btn-chip-add" onclick="addChip()">+</button>
      </div>
    </div>

  </aside>

  <!-- MAIN GRID -->
  <main class="main">
    <div class="grid-header">
      <div class="grid-title" id="gridTitle">Sticker Ideas</div>
      <div class="drift-legend">
        <span><span class="drift-legend-dot" style="background:var(--drift-good)"></span>On-brand</span>
        <span><span class="drift-legend-dot" style="background:var(--drift-warn)"></span>Check</span>
        <span><span class="drift-legend-dot" style="background:var(--drift-bad)"></span>Drifting</span>
      </div>
      <button class="btn btn-ghost" style="font-size:11px;" onclick="recalcAllDrift()">↻ Re-score</button>
    </div>
    <div class="sticker-grid" id="stickerGrid"></div>
  </main>
</div>

<!-- BRIEF BAR -->
<div class="brief-bar">
  <div class="brief-bar-label">📋 Brief</div>
  <div class="brief-preview" id="briefPreview">Set your theme & sticker ideas to generate a brief…</div>
  <button class="btn btn-coral" onclick="openBriefModal()">View &amp; Copy</button>
</div>

<!-- BRIEF MODAL -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="closeBriefModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">Production Brief</div>
      <button class="modal-close" onclick="closeBriefModal()">✕</button>
    </div>
    <div class="brief-output" id="briefOutput"></div>
    <div class="brief-actions">
      <button class="btn btn-mint" onclick="copyBrief()">📋 Copy to Clipboard</button>
      <button class="btn btn-ghost" onclick="closeBriefModal()">Close</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">Copied!</div>

<script>
// ── STATE ──────────────────────────────────────────────
const state = {
  palette: ['#FF6B6B','#FFB347','#00D9A3','#C4B5FD','#1A1A2E'],
  constraints: ['Max 3 colors per sticker','Thick outlines (3px+)','White fill background'],
  stickers: []
};

const STICKER_DEFAULTS = [
  { title: 'Mountain Sunrise', desc: 'A tiny mountain peak with a rising sun behind it, warm gradient sky.', mood: 'cozy', format: 'circle', flagged: false, tags:['nature','gradient'] },
  { title: 'Mushroom Trio', desc: 'Three different mushrooms side by side, illustrated style.', mood: 'playful', format: 'die-cut', flagged: false, tags:['nature','food'] },
  { title: 'Busy Bee', desc: 'A plump honeybee with dotted flight trail, bold black stripes.', mood: 'bold', format: 'circle', flagged: false, tags:['animal','bold'] },
  { title: 'Pine Branch', desc: 'Single pine branch with 2–3 pinecones, minimal linework.', mood: 'minimal', format: 'rectangle', flagged: false, tags:['nature','minimal'] },
  { title: 'Crescent Moon', desc: 'Crescent moon with a sleepy face, star accent, pastel tones.', mood: 'cozy', format: 'die-cut', flagged: false, tags:['celestial','cute'] },
  { title: 'Wild Strawberry', desc: 'Oversized cartoon strawberry with seeds and leaf top.', mood: 'playful', format: 'die-cut', flagged: false, tags:['food','bold'] },
  { title: 'Vintage Compass', desc: 'Classic compass rose in aged brass tones, hatching detail.', mood: 'retro', format: 'circle', flagged: false, tags:['retro','tool'] },
  { title: 'Cloud Burst', desc: 'Happy cloud with cartoon lightning bolt shooting down.', mood: 'playful', format: 'die-cut', flagged: false, tags:['weather','fun'] },
];

// ── INIT ──────────────────────────────────────────────
function init() {
  state.stickers = STICKER_DEFAULTS.map(s => ({ ...s }));
  renderPalette();
  renderConstraints();
  renderGrid();
  bindSidebarListeners();
}

// ── PALETTE ──────────────────────────────────────────
function renderPalette() {
  const row = document.getElementById('paletteRow');
  row.innerHTML = '';
  state.palette.forEach((hex, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'swatch-wrap';
    wrap.title = hex;
    wrap.innerHTML = `
      <label class="swatch" style="background:${hex}">
        <input type="color" value="${hex}" data-idx="${i}" onchange="updatePaletteColor(this)">
      </label>`;
    row.appendChild(wrap);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'swatch-add';
  addBtn.textContent = '+';
  addBtn.title = 'Add color';
  addBtn.onclick = () => {
    if (state.palette.length >= 8) return;
    state.palette.push('#FFFFFF');
    renderPalette();
  };
  row.appendChild(addBtn);
}

function updatePaletteColor(input) {
  const i = parseInt(input.dataset.idx);
  state.palette[i] = input.value;
  input.closest('.swatch').style.background = input.value;
}

// ── CONSTRAINTS ──────────────────────────────────────
function renderConstraints() {
  const area = document.getElementById('constraintChips');
  area.innerHTML = '';
  state.constraints.forEach((c, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `${c} <button class="chip-remove" title="Remove" onclick="removeChip(${i})">✕</button>`;
    area.appendChild(chip);
  });
}

function addChip() {
  const input = document.getElementById('newChipInput');
  const val = input.value.trim();
  if (!val) return;
  state.constraints.push(val);
  renderConstraints();
  input.value = '';
}

function removeChip(i) {
  state.constraints.splice(i, 1);
  renderConstraints();
}

  },
  cottage: {

  },

    rules: 'Dark background always\nNeon/glow accents\nAngular geometric shapes\nCyberspace motifs'
  },
  kawaii: {

function applyPreset(btn) {
  const key = btn.dataset.preset;
  const p = PRESETS[key];
  if (!p) return;
  state.palette = [...p.palette];
  state.constraints = [...p.constraints];
  document.getElementById('moodWords').value = p.mood;
  document.getElementById('styleRules').value = p.rules;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPalette();
  renderConstraints();
  recalcAllDrift();
  updateBriefPreview();
}

// ── DRIFT SCORING ─────────────────────────────────────
function calcDrift(sticker) {
  const mood = document.getElementById('moodWords').value.toLowerCase();
  const rules = document.getElementById('styleRules').value.toLowerCase();
  const moodWords = mood.split(',').map(w => w.trim()).filter(Boolean);
  const ruleWords = rules.split('\n').join(' ');
  const stickerText = (sticker.title + ' ' + sticker.desc + ' ' + sticker.mood + ' ' + sticker.tags.join(' ')).toLowerCase();

  // Check how many mood words appear in the sticker text
  let hits = 0;
  moodWords.forEach(w => { if (w && stickerText.includes(w)) hits++; });
  const moodScore = moodWords.length ? hits / moodWords.length : 0.5;

  // Check for constraint violations via keyword flags
  let constraintScore = 1.0;
  const bad_signals = {
    'no gradient': ['gradient','gradients'],
    'no neon': ['neon','electric','glow'],
    'no texture': ['texture','halftone','grain'],
    'no sharp': ['sharp','angular','geometric'],
    'pastel only': ['neon','black','bold','dark'],
    'no harsh': ['harsh','sharp','angular'],
    'earth tones': ['neon','pastel','bright'],
  };
  state.constraints.forEach(c => {
    const cl = c.toLowerCase();
    Object.entries(bad_signals).forEach(([trigger, words]) => {
      if (cl.includes(trigger.replace('no ','').replace(' only',''))) {
        words.forEach(w => { if (stickerText.includes(w)) constraintScore = Math.max(0.1, constraintScore - 0.25); });
      }
    });
  });

  // Flagged cards always drift
  if (sticker.flagged) return 0.15;

  const score = (moodScore * 0.6 + constraintScore * 0.4);
  return Math.min(1, Math.max(0, score));
}

function driftColor(score) {
  if (score >= 0.65) return getComputedStyle(document.documentElement).getPropertyValue('--drift-good').trim();
  if (score >= 0.35) return getComputedStyle(document.documentElement).getPropertyValue('--drift-warn').trim();
  return getComputedStyle(document.documentElement).getPropertyValue('--drift-bad').trim();
}

function driftLabel(score) {
  if (score >= 0.65) return 'ON';
  if (score >= 0.35) return 'CHK';
  return 'OFF';
}

function recalcAllDrift() {
  state.stickers.forEach((s, i) => {
    const card = document.querySelector(`.sticker-card[data-idx="${i}"]`);
    if (!card) return;
    const score = calcDrift(s);
    const bar = card.querySelector('.drift-bar');
    const label = card.querySelector('.drift-label');
    const col = driftColor(score);
    bar.style.width = (score * 100) + '%';
    bar.style.background = col;
    label.textContent = driftLabel(score);
    label.style.color = col;
    card.classList.remove('drifting','aligned');
    if (score >= 0.65) card.classList.add('aligned');
    else if (score < 0.35) card.classList.add('drifting');
  });
}

// ── STICKER GRID ─────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('stickerGrid');
  grid.innerHTML = '';
  state.stickers.forEach((s, i) => {
    const score = calcDrift(s);
    const col = driftColor(score);
    const pct = score * 100;
    const card = document.createElement('div');
    card.className = `sticker-card ${score >= 0.65 ? 'aligned' : score < 0.35 ? 'drifting' : ''}`;
    card.dataset.idx = i;
    card.innerHTML = `
      <div class="card-top">
        <span class="card-num">#${String(i+1).padStart(2,'0')}</span>
        <input class="card-title" type="text" value="${esc(s.title)}" placeholder="Sticker name…"
          onchange="updateSticker(${i},'title',this.value)">
        <div class="drift-meter">
          <span class="drift-label" style="color:${col}">${driftLabel(score)}</span>
          <div class="drift-bar-wrap">
            <div class="drift-bar" style="width:${pct}%;background:${col}"></div>
          </div>
        </div>
      </div>
      <textarea class="card-desc" rows="3" placeholder="Describe this sticker concept…"
        onchange="updateSticker(${i},'desc',this.value)">${esc(s.desc)}</textarea>
      <div class="card-tags" id="tags-${i}"></div>
      <div class="card-meta">
        <select onchange="updateSticker(${i},'mood',this.value)">
          <option value="">— Mood —</option>
          ${['cozy','playful','bold','minimal','retro','cute','nostalgic','sharp','natural','electric'].map(m =>
            `<option value="${m}" ${s.mood===m?'selected':''}>${m}</option>`).join('')}
        </select>
        <select onchange="updateSticker(${i},'format',this.value)">
          <option value="">— Format —</option>
          ${['circle','die-cut','rectangle','oval','kiss-cut'].map(f =>
            `<option value="${f}" ${s.format===f?'selected':''}>${f}</option>`).join('')}
        </select>
        <button class="card-flag ${s.flagged?'flagged':'ok'}"
          onclick="toggleFlag(${i})">${s.flagged?'⚑ Flag':'✓ OK'}</button>
      </div>`;
    grid.appendChild(card);
    renderTags(i);
  });
  updateBriefPreview();
}

function renderTags(i) {
  const s = state.stickers[i];
  const wrap = document.getElementById(`tags-${i}`);
  if (!wrap) return;
  wrap.innerHTML = '';
  s.tags.forEach((t, ti) => {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = '#' + t;
    tag.title = 'Click to remove';
    tag.onclick = () => { s.tags.splice(ti,1); renderTags(i); recalcAllDrift(); updateBriefPreview(); };
    wrap.appendChild(tag);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'tag-add';
  addBtn.textContent = '+ tag';
  addBtn.onclick = () => {
    const val = prompt('Add tag:','');
    if (val && val.trim()) { s.tags.push(val.trim().replace(/^#/,'')); renderTags(i); recalcAllDrift(); updateBriefPreview(); }
  };
  wrap.appendChild(addBtn);
}

function updateSticker(i, key, val) {
  state.stickers[i][key] = val;
  recalcAllDrift();
  updateBriefPreview();
}

function toggleFlag(i) {
  state.stickers[i].flagged = !state.stickers[i].flagged;
  const card = document.querySelector(`.sticker-card[data-idx="${i}"]`);
  const btn = card.querySelector('.card-flag');
  btn.textContent = state.stickers[i].flagged ? '⚑ Flag' : '✓ OK';
  btn.className = `card-flag ${state.stickers[i].flagged ? 'flagged' : 'ok'}`;
  recalcAllDrift();
  updateBriefPreview();
}

// ── SIDEBAR LISTENERS ─────────────────────────────────
function bindSidebarListeners() {
  ['moodWords','styleRules','brandName','vibe','audience'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      recalcAllDrift();
      updateBriefPreview();
    });
  });
  document.getElementById('sheetName').addEventListener('input', updateBriefPreview);
}

// ── BRIEF ─────────────────────────────────────────────
function buildBriefText() {
  const name = document.getElementById('sheetName').value || 'Untitled Sheet';
  const brand = document.getElementById('brandName').value || '—';
  const vibe = document.getElementById('vibe').value || '—';
  const audience = document.getElementById('audience').value || '—';
  const mood = document.getElementById('moodWords').value || '—';
  const rules = document.getElementById('styleRules').value || '—';
  const palette = state.palette.join(', ');
  const constraints = state.constraints.map(c => `• ${c}`).join('\n');
  const stickersText = state.stickers.map((s, i) => {
    const score = calcDrift(s);
    const flag = s.flagged ? ' ⚑ FLAGGED' : score < 0.35 ? ' ⚠ DRIFTING' : '';
    return `  ${i+1}. ${s.title}${flag}\n     Format: ${s.format || '?'} | Mood: ${s.mood || '?'} | Tags: ${s.tags.length ? s.tags.map(t=>'#'+t).join(' ') : 'none'}\n     ${s.desc}`;
  }).join('\n\n');

  return `STICKER SHEET PRODUCTION BRIEF
════════════════════════════════════════
Sheet: ${name}
Generated: ${new Date().toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'})}

BRAND
  Name: ${brand}
  Vibe: ${vibe}
  Audience: ${audience}

STYLE
  Mood: ${mood}
  Rules:
${rules.split('\n').map(r => '    • '+r).join('\n')}

PALETTE
  ${palette}

CONSTRAINTS
${constraints}

STICKERS (8)
${stickersText}

════════════════════════════════════════
END OF BRIEF`;
}

function updateBriefPreview() {
  const text = buildBriefText();
  const preview = document.getElementById('briefPreview');
  const brand = document.getElementById('brandName').value;
  const count = state.stickers.filter(s => !s.flagged).length;
  preview.textContent = `${brand || 'Unnamed brand'} · ${count} active stickers · ${state.palette.length} colors · ${state.constraints.length} constraints`;
}

function openBriefModal() {
  document.getElementById('briefOutput').textContent = buildBriefText();
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function closeBriefModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.add('hidden');
  }
}

async function copyBrief() {
  const text = document.getElementById('briefOutput').textContent;
  try {
    await navigator.clipboard.writeText(text);
    showToast('Brief copied!');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Brief copied!');
  }
}

// ── TOAST ─────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── UTIL ──────────────────────────────────────────────
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── KEYBOARD SHORTCUTS ────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeBriefModal();
  if ((e.metaKey || e.ctrlKey) && e.key === 'b') { e.preventDefault(); openBriefModal(); }
});

// ── START ─────────────────────────────────────────────
init();
</script>
