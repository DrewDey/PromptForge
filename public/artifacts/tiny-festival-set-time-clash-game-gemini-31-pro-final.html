<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Survival Planner ⛺🎸</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e2f;
            --primary: #ff477e;
            --accent: #00f5d4;
            --text: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            padding-top: 100px;
            box-sizing: border-box;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 15px;
            border-bottom: 2px solid var(--primary);
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .stat {
            text-align: center;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }
        .stat-value {
            display: block;
            font-size: 1.8em;
            font-weight: bold;
            color: var(--accent);
            margin-top: 5px;
        }
        .stat-value.danger { color: #ff3333; }
        .stat-value.warning { color: #ffaa00; }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 40px;
        }
        .time-slot {
            margin-bottom: 40px;
            background: #1a1a24;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .time-header {
            font-size: 1.5em;
            font-weight: 800;
            margin-bottom: 15px;
            color: var(--accent);
            border-bottom: 1px dashed #444;
            padding-bottom: 10px;
        }
        .acts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .act-card {
            background: var(--card-bg);
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        .act-card:hover {
            transform: translateY(-3px);
            border-color: #666;
        }
        .act-card.selected {
            border-color: var(--primary);
            background: rgba(255, 71, 126, 0.1);
            box-shadow: 0 0 15px rgba(255, 71, 126, 0.3);
        }
        .act-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .act-stage {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 10px;
            display: inline-block;
            background: #000;
            padding: 3px 8px;
            border-radius: 12px;
        }
        .act-effects {
            font-size: 0.9em;
            color: #bbb;
            line-height: 1.5;
        }
        .must-see-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ffd700;
            color: #000;
            font-size: 0.7em;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 10px;
            transform: rotate(10deg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .export-section {
            text-align: center;
            margin: 50px 0;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            background: #ff2a6d;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #00f5d4;
            color: #000;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="stat">⚡ Energy <span id="val-energy" class="stat-value">100%</span></div>
        <div class="stat">🤝 Squad Loyalty <span id="val-loyalty" class="stat-value">100%</span></div>
        <div class="stat">👟 Distance <span id="val-distance" class="stat-value">0 mi</span></div>
        <div class="stat">⭐ Must-See <span id="val-mustsee" class="stat-value">0/3</span></div>
    </div>

    <div class="container">
        <h1>🎡 Create Your Festival Route</h1>
        <div id="schedule"></div>
        
        <div class="export-section">
            <button id="export-btn" disabled>Pick a full route to export!</button>
        </div>
    </div>

    <div id="toast">Route copied to clipboard! 📋</div>

    <script>
        // Stages and their physical locations (0 to 3 to calculate distance)
        const STAGES = {
            "Main Stage": 0,
            "Sahara Tent": 1,
            "Indie Woods": 2,
            "Food Truck Oasis": 1.5 // Middle of the grounds
        };

        const scheduleData = [
            {
                time: "3:00 PM - The Arrival",
                acts: [
                    { id: "1a", name: "Local Garage Band", stage: "Indie Woods", energy: -10, loyalty: -5, desc: "Your friends don't know them, but you swear they're the next big thing." },
                    { id: "1b", name: "TikTok DJ Warmup", stage: "Sahara Tent", energy: -20, loyalty: +15, desc: "High energy, friends love the hype, but it's exhausting early." },
                    { id: "1c", name: "Nap Under a Tree", stage: "Food Truck Oasis", energy: +15, loyalty: 0, desc: "Pace yourself. The sun is hot." }
                ]
            },
            {
                time: "4:30 PM - The Vibe Shift",
                acts: [
                    { id: "2a", name: "Critical Darling", stage: "Indie Woods", energy: -15, loyalty: -10, isMustSee: true, desc: "Pitchfork gave them a 9.2. Your friends want to leave." },
                    { id: "2b", name: "Overpriced Tacos", stage: "Food Truck Oasis", energy: +25, loyalty: +10, desc: "Carbs restore your life force and squad morale." },
                    { id: "2c", name: "Mid-Tier EDM", stage: "Main Stage", energy: -25, loyalty: +20, desc: "You are stuck in the middle of a mosh pit." }
                ]
            },
            {
                time: "6:00 PM - Golden Hour",
                acts: [
                    { id: "3a", name: "Legacy Rock Act", stage: "Main Stage", energy: -15, loyalty: +5, isMustSee: true, desc: "They only play their hits from 2004. Perfect sunset vibes." },
                    { id: "3b", name: "Secret B2B Set", stage: "Sahara Tent", energy: -30, loyalty: -20, desc: "A techno set so deep your friends literally abandoned you." },
                    { id: "3c", name: "Merch Tent Line", stage: "Food Truck Oasis", energy: -10, loyalty: +10, desc: "Stood in line for 90 minutes for a $45 tote bag." }
                ]
            },
            {
                time: "8:30 PM - The Headliners",
                acts: [
                    { id: "4a", name: "Global Pop Superstar", stage: "Main Stage", energy: -40, loyalty: +30, isMustSee: true, desc: "The reason everyone bought a ticket. Maximum hype." },
                    { id: "4b", name: "Mind-Bending Lasers", stage: "Sahara Tent", energy: -35, loyalty: 0, desc: "Visuals so bright you forgot your own name." },
                    { id: "4c", name: "Acoustic Come-down", stage: "Indie Woods", energy: -5, loyalty: -10, desc: "Sitting on the grass swaying quietly." }
                ]
            }
        ];

        let selectedActs = {}; // key: timeIndex, value: act object
        const totalMustSees = scheduleData.reduce((acc, slot) => acc + slot.acts.filter(a => a.isMustSee).length, 0);

        function init() {
            const container = document.getElementById('schedule');
            
            scheduleData.forEach((slot, timeIndex) => {
                const slotDiv = document.createElement('div');
                slotDiv.className = 'time-slot';
                
                const header = document.createElement('div');
                header.className = 'time-header';
                header.textContent = slot.time;
                slotDiv.appendChild(header);

                const actsGrid = document.createElement('div');
                actsGrid.className = 'acts-grid';

                slot.acts.forEach(act => {
                    const card = document.createElement('div');
                    card.className = 'act-card';
                    card.id = `act-${act.id}`;
                    card.onclick = () => selectAct(timeIndex, act);

                    // Must-See Badge
                    if (act.isMustSee) {
                        const badge = document.createElement('div');
                        badge.className = 'must-see-badge';
                        badge.textContent = '⭐ MUST-SEE';
                        card.appendChild(badge);
                    }

                    // Act Title
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'act-title';
                    titleDiv.textContent = act.name;
                    card.appendChild(titleDiv);

                    // Act Stage
                    const stageDiv = document.createElement('div');
                    stageDiv.className = 'act-stage';
                    stageDiv.textContent = `📍 ${act.stage}`;
                    card.appendChild(stageDiv);

                    // Act Effects Container
                    const effectsDiv = document.createElement('div');
                    effectsDiv.className = 'act-effects';

                    // Description (Italic)
                    const descItalic = document.createElement('i');
                    descItalic.textContent = `"${act.desc}"`;
                    effectsDiv.appendChild(descItalic);
                    
                    effectsDiv.appendChild(document.createElement('br'));
                    effectsDiv.appendChild(document.createElement('br'));

                    // Energy Stat
                    const energySign = act.energy > 0 ? '+' : '';
                    const energyText = document.createTextNode(`⚡ Energy: ${energySign}${act.energy}%`);
                    effectsDiv.appendChild(energyText);
                    
                    effectsDiv.appendChild(document.createElement('br'));

                    // Squad Stat
                    const loyaltySign = act.loyalty > 0 ? '+' : '';
                    const loyaltyText = document.createTextNode(`🤝 Squad: ${loyaltySign}${act.loyalty}%`);
                    effectsDiv.appendChild(loyaltyText);

                    card.appendChild(effectsDiv);
                    actsGrid.appendChild(card);
                });

                slotDiv.appendChild(actsGrid);
                container.appendChild(slotDiv);
            });

            document.getElementById('export-btn').onclick = exportRoute;
        }

        function selectAct(timeIndex, act) {
            selectedActs[timeIndex] = act;
            
            // Update UI highlights
            const slotDivs = document.querySelectorAll('.time-slot')[timeIndex].querySelectorAll('.act-card');
            slotDivs.forEach(div => div.classList.remove('selected'));
            document.getElementById(`act-${act.id}`).classList.add('selected');

            updateStats();
            checkExportState();
        }

        function updateStats() {
            let energy = 100;
            let loyalty = 100;
            let distance = 0;
            let caughtMustSees = 0;
            let lastStageIndex = null;

            // Ensure we iterate in chronological order
            const sortedIndices = Object.keys(selectedActs).sort((a, b) => a - b);

            sortedIndices.forEach(idx => {
                const act = selectedActs[idx];
                energy += act.energy;
                loyalty += act.loyalty;
                if (act.isMustSee) caughtMustSees++;

                const currentStageIndex = STAGES[act.stage];
                if (lastStageIndex !== null) {
                    distance += Math.abs(currentStageIndex - lastStageIndex) * 0.5; // 0.5 miles per stage gap
                }
                lastStageIndex = currentStageIndex;
            });

            // Clamp values
            if (energy < 0) energy = 0;
            if (energy > 100) energy = 100;
            if (loyalty < 0) loyalty = 0;
            if (loyalty > 100) loyalty = 100;

            // Update DOM
            const eSpan = document.getElementById('val-energy');
            eSpan.textContent = `${energy}%`;
            eSpan.className = `stat-value ${energy < 20 ? 'danger' : energy < 50 ? 'warning' : ''}`;

            const lSpan = document.getElementById('val-loyalty');
            lSpan.textContent = `${loyalty}%`;
            lSpan.className = `stat-value ${loyalty < 30 ? 'danger' : loyalty < 60 ? 'warning' : ''}`;

            document.getElementById('val-distance').textContent = `${distance.toFixed(1)} mi`;
            document.getElementById('val-mustsee').textContent = `${caughtMustSees}/${totalMustSees}`;
        }

        function checkExportState() {
            const btn = document.getElementById('export-btn');
            if (Object.keys(selectedActs).length === scheduleData.length) {
                btn.disabled = false;
                btn.textContent = "📋 Copy Route & Brag";
            }
        }

        function exportRoute() {
            let energy = parseInt(document.getElementById('val-energy').textContent);
            let loyalty = parseInt(document.getElementById('val-loyalty').textContent);
            let distance = document.getElementById('val-distance').textContent;
            let mustsee = document.getElementById('val-mustsee').textContent;

            let vibeCheck = "";
            if (energy === 0) vibeCheck = "Literally passed out in an Uber line.";
            else if (loyalty < 30) vibeCheck = "Your friends are ignoring your texts.";
            else if (energy > 50 && loyalty > 80) vibeCheck = "Festival God. Perfect balance.";
            else vibeCheck = "Survived the chaos.";

            let routeText = `🎡 MY FESTIVAL ROUTE ⛺\n`;
            routeText += `⚡ Energy Left: ${energy}% | 🤝 Squad Loyalty: ${loyalty}%\n`;
            routeText += `👟 Walked: ${distance} | ⭐ Must-Sees: ${mustsee}\n`;
            routeText += `Vibe Check: ${vibeCheck}\n\n`;

            const sortedIndices = Object.keys(selectedActs).sort((a, b) => a - b);
            sortedIndices.forEach(idx => {
                const timeStr = scheduleData[idx].time.split(' - ')[0];
                routeText += `[${timeStr}] ${selectedActs[idx].name} (@ ${selectedActs[idx].stage})\n`;
            });

            navigator.clipboard.writeText(routeText).then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 3000);
            });
        }

        // Boot it up
        init();
    </script>
</body>
</html>
