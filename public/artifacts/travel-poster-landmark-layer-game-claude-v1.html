<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-sans, sans-serif); font-size: 14px; color: var(--color-text-primary); }
.container { display: flex; gap: 12px; height: 100vh; padding: 12px; background: var(--color-background-tertiary); }
.panel { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 12px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); }
.left-panel { width: 180px; }
.center-panel { flex: 1; }
.right-panel { width: 160px; }
.poster-canvas { width: 100%; height: 100%; border: 0.5px solid var(--color-border-tertiary); background: white; border-radius: var(--border-radius-md); }
.section-label { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 12px; margin-bottom: 4px; }
.option-btn { padding: 8px 12px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); border-radius: var(--border-radius-md); cursor: pointer; font-size: 13px; transition: all 0.15s; }
.option-btn:hover { background: var(--color-background-secondary); border-color: var(--color-border-primary); }
.option-btn.active { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); }
.score-card { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 8px; margin-bottom: 8px; }
.score-label { font-size: 11px; color: var(--color-text-secondary); }
.score-value { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
.score-bar { width: 100%; height: 6px; background: var(--color-background-tertiary); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.score-fill { height: 100%; background: var(--color-background-success); transition: width 0.3s; }
.button-group { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.action-btn { flex: 1; min-width: 60px; padding: 8px 12px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); border-radius: var(--border-radius-md); cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.15s; }
.action-btn:hover { background: var(--color-background-secondary); transform: scale(0.98); }
.action-btn:active { transform: scale(0.95); }
svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="container">
  <div class="panel left-panel">
    <div>
      <div class="section-label">Destination</div>
      <div id="dest-buttons"></div>
    </div>
    <div>
      <div class="section-label">Sky</div>
      <div id="sky-buttons"></div>
    </div>
    <div>
      <div class="section-label">Landmark</div>
      <div id="landmark-buttons"></div>
    </div>
    <div>
      <div class="section-label">Badge</div>
      <div id="badge-buttons"></div>
    </div>
    <div>
      <div class="section-label">Texture</div>
      <div id="texture-buttons"></div>
    </div>
  </div>

  <div class="panel center-panel">
    <svg class="poster-canvas" id="poster-canvas" viewBox="0 0 600 800">
      <defs>
        <pattern id="noise" patternUnits="userSpaceOnUse" width="4" height="4">
          <rect width="4" height="4" fill="white" opacity="0.02"/>
        </pattern>
      </defs>
      <rect width="600" height="800" id="bg-sky" fill="#87CEEB"/>
      <g id="poster-content"></g>
      <rect width="600" height="800" id="texture-overlay" fill="url(#noise)" opacity="0"/>
    </svg>
  </div>

  <div class="panel right-panel">
    <div class="section-label">Score</div>
    <div id="scores"></div>
    <div class="button-group" style="margin-top: 20px;">
      <button class="action-btn" onclick="reset()">Reset</button>
      <button class="action-btn" onclick="randomize()">Randomize</button>
    </div>
    <div class="button-group">
      <button class="action-btn" onclick="exportBrief()" style="flex: 1;">Export Brief</button>
    </div>
  </div>
</div>

<script>
const destinations = {
  'paris': { name: 'Paris', skyColor: '#4a90e2', textColor: '#fff', landmark: '✦ Eiffel Tower', accentColor: '#d4af37' },
  'tokyo': { name: 'Tokyo', skyColor: '#ff6b6b', textColor: '#fff', landmark: '⛩ Temple', accentColor: '#ffd700' },
  'newyork': { name: 'New York', skyColor: '#2c3e50', textColor: '#fff', landmark: '🏢 Skyline', accentColor: '#f39c12' },
  'sydney': { name: 'Sydney', skyColor: '#3498db', textColor: '#fff', landmark: '🎭 Opera House', accentColor: '#e74c3c' },
  'rome': { name: 'Rome', skyColor: '#e67e22', textColor: '#fff', landmark: '🏛 Colosseum', accentColor: '#ecf0f1' },
};

const skies = {
  'dawn': { color: '#ff9a56', label: 'Dawn' },
  'day': { color: '#87ceeb', label: 'Day' },
  'sunset': { color: '#ff6b6b', label: 'Sunset' },
  'night': { color: '#1a1a2e', label: 'Night' },
  'mountain': { color: '#c9ada7', label: 'Mountain' },
};

const landmarks = {
  'monument': { icon: '✦', label: 'Monument', size: 'large' },
  'building': { icon: '⬛', label: 'Building', size: 'large' },
  'nature': { icon: '🌲', label: 'Nature', size: 'medium' },
  'arch': { icon: '⌢', label: 'Arch', size: 'medium' },
  'dome': { icon: '⬤', label: 'Dome', size: 'medium' },
};

const badges = {
  'circle': { shape: 'circle', label: 'Circle Badge' },
  'ribbon': { shape: 'ribbon', label: 'Ribbon' },
  'stamp': { shape: 'stamp', label: 'Stamp' },
  'banner': { shape: 'banner', label: 'Banner' },
};

const textures = {
  'none': { opacity: 0, label: 'None' },
  'subtle': { opacity: 0.08, label: 'Subtle' },
  'medium': { opacity: 0.15, label: 'Medium' },
  'heavy': { opacity: 0.25, label: 'Heavy' },
};

let state = {
  destination: 'paris',
  sky: 'day',
  landmark: 'monument',
  badge: 'circle',
  texture: 'none',
  landmarkX: 300,
  landmarkY: 350,
};

function render() {
  const svg = document.getElementById('poster-content');
  svg.innerHTML = '';
  
  const dest = destinations[state.destination];
  const skyObj = skies[state.sky];
  
  // Update sky
  document.getElementById('bg-sky').setAttribute('fill', skyObj.color);
  
  // Title
  const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  title.setAttribute('x', '300');
  title.setAttribute('y', '100');
  title.setAttribute('text-anchor', 'middle');
  title.setAttribute('font-size', '48');
  title.setAttribute('font-weight', '700');
  title.setAttribute('fill', dest.textColor);
  title.setAttribute('font-family', 'serif');
  title.textContent = dest.name;
  svg.appendChild(title);
  
  // Landmark
  const landmarkObj = landmarks[state.landmark];
  const lSize = landmarkObj.size === 'large' ? 120 : 80;
  const landmark = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  landmark.setAttribute('x', state.landmarkX.toString());
  landmark.setAttribute('y', state.landmarkY.toString());
  landmark.setAttribute('text-anchor', 'middle');
  landmark.setAttribute('font-size', lSize.toString());
  landmark.setAttribute('fill', dest.accentColor);
  landmark.textContent = landmarkObj.icon;
  svg.appendChild(landmark);
  
  // Badge
  const badgeObj = badges[state.badge];
  if (badgeObj.shape === 'circle') {
    const badge = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    badge.setAttribute('cx', '480');
    badge.setAttribute('cy', '680');
    badge.setAttribute('r', '45');
    badge.setAttribute('fill', dest.accentColor);
    badge.setAttribute('opacity', '0.9');
    svg.appendChild(badge);
    
    const badgeText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    badgeText.setAttribute('x', '480');
    badgeText.setAttribute('y', '690');
    badgeText.setAttribute('text-anchor', 'middle');
    badgeText.setAttribute('font-size', '14');
    badgeText.setAttribute('fill', skyObj.color);
    badgeText.setAttribute('font-weight', '700');
    badgeText.textContent = 'TRAVEL';
    svg.appendChild(badgeText);
  } else if (badgeObj.shape === 'ribbon') {
    const ribbon = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    ribbon.setAttribute('x', '420');
    ribbon.setAttribute('y', '650');
    ribbon.setAttribute('width', '160');
    ribbon.setAttribute('height', '60');
    ribbon.setAttribute('fill', dest.accentColor);
    ribbon.setAttribute('opacity', '0.85');
    svg.appendChild(ribbon);
    
    const ribbonText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    ribbonText.setAttribute('x', '500');
    ribbonText.setAttribute('y', '685');
    ribbonText.setAttribute('text-anchor', 'middle');
    ribbonText.setAttribute('font-size', '16');
    ribbonText.setAttribute('fill', skyObj.color);
    ribbonText.setAttribute('font-weight', '700');
    ribbonText.textContent = 'EXPLORE';
    svg.appendChild(ribbonText);
  } else if (badgeObj.shape === 'stamp') {
    const stamp = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    stamp.setAttribute('x', '450');
    stamp.setAttribute('y', '650');
    stamp.setAttribute('width', '80');
    stamp.setAttribute('height', '80');
    stamp.setAttribute('fill', 'none');
    stamp.setAttribute('stroke', dest.accentColor);
    stamp.setAttribute('stroke-width', '3');
    stamp.setAttribute('opacity', '0.8');
    stamp.setAttribute('transform', 'rotate(-25 490 690)');
    svg.appendChild(stamp);
    
    const stampText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    stampText.setAttribute('x', '490');
    stampText.setAttribute('y', '700');
    stampText.setAttribute('text-anchor', 'middle');
    stampText.setAttribute('font-size', '12');
    stampText.setAttribute('fill', dest.accentColor);
    stampText.setAttribute('font-weight', '700');
    stampText.textContent = '★';
    svg.appendChild(stampText);
  } else if (badgeObj.shape === 'banner') {
    const banner = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    banner.setAttribute('points', '420,680 580,680 560,720 440,720');
    banner.setAttribute('fill', dest.accentColor);
    banner.setAttribute('opacity', '0.9');
    svg.appendChild(banner);
    
    const bannerText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    bannerText.setAttribute('x', '500');
    bannerText.setAttribute('y', '705');
    bannerText.setAttribute('text-anchor', 'middle');
    bannerText.setAttribute('font-size', '14');
    bannerText.setAttribute('fill', skyObj.color);
    bannerText.setAttribute('font-weight', '700');
    bannerText.textContent = 'VISIT NOW';
    svg.appendChild(bannerText);
  }
  
  // Texture
  const textureObj = textures[state.texture];
  document.getElementById('texture-overlay').setAttribute('opacity', textureObj.opacity.toString());
  
  updateScores();
  updateUI();
}

function updateScores() {
  const dest = destinations[state.destination];
  const skyObj = skies[state.sky];
  const landmarkObj = landmarks[state.landmark];
  const badgeObj = badges[state.badge];
  
  // Balance: check distribution of elements
  let balance = 50;
  const landmarkDistFromCenter = Math.sqrt(Math.pow(state.landmarkX - 300, 2) + Math.pow(state.landmarkY - 400, 2));
  balance = Math.max(0, 100 - (landmarkDistFromCenter / 5));
  
  // Readability: text contrast
  let readability = 50;
  const skyL = parseInt(skyObj.color.slice(1, 3), 16) + parseInt(skyObj.color.slice(3, 5), 16) + parseInt(skyObj.color.slice(5, 7), 16);
  const textL = dest.textColor === '#fff' ? 255 * 3 : 0;
  const contrast = Math.abs(skyL - textL) / (255 * 3) * 100;
  readability = Math.min(100, contrast * 1.5);
  
  // Landmark coverage: size and visibility
  let coverage = landmarkObj.size === 'large' ? 75 : 50;
  
  // Clutter: low is good
  let clutter = 100 - (Object.keys(badges).indexOf(state.badge) * 15 + (state.texture !== 'none' ? 10 : 0));
  clutter = Math.max(0, clutter);
  
  const scores = {
    'Balance': Math.round(balance),
    'Readability': Math.round(readability),
    'Coverage': Math.round(coverage),
    'Clarity': Math.round(clutter),
  };
  
  const scoresDiv = document.getElementById('scores');
  scoresDiv.innerHTML = Object.entries(scores).map(([label, value]) => `
    <div class="score-card">
      <div class="score-label">${label}</div>
      <div class="score-value">${value}</div>
      <div class="score-bar"><div class="score-fill" style="width: ${value}%"></div></div>
    </div>
  `).join('');
}

function updateUI() {
  document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`[data-dest="${state.destination}"]`)?.classList.add('active');
  document.querySelector(`[data-sky="${state.sky}"]`)?.classList.add('active');
  document.querySelector(`[data-landmark="${state.landmark}"]`)?.classList.add('active');
  document.querySelector(`[data-badge="${state.badge}"]`)?.classList.add('active');
  document.querySelector(`[data-texture="${state.texture}"]`)?.classList.add('active');
}

function setDest(key) { state.destination = key; render(); }
function setSky(key) { state.sky = key; render(); }
function setLandmark(key) { state.landmark = key; render(); }
function setBadge(key) { state.badge = key; render(); }
function setTexture(key) { state.texture = key; render(); }

function reset() {
  state = { destination: 'paris', sky: 'day', landmark: 'monument', badge: 'circle', texture: 'none', landmarkX: 300, landmarkY: 350 };
  render();
}

function randomize() {
  state.destination = Object.keys(destinations)[Math.floor(Math.random() * Object.keys(destinations).length)];
  state.sky = Object.keys(skies)[Math.floor(Math.random() * Object.keys(skies).length)];
  state.landmark = Object.keys(landmarks)[Math.floor(Math.random() * Object.keys(landmarks).length)];
  state.badge = Object.keys(badges)[Math.floor(Math.random() * Object.keys(badges).length)];
  state.texture = Object.keys(textures)[Math.floor(Math.random() * Object.keys(textures).length)];
  state.landmarkX = 200 + Math.random() * 200;
  state.landmarkY = 300 + Math.random() * 200;
  render();
}

function exportBrief() {
  const brief = `RETRO TRAVEL POSTER BRIEF
Destination: ${destinations[state.destination].name}
Sky: ${skies[state.sky].label}
Landmark: ${landmarks[state.landmark].label}
Badge Style: ${badges[state.badge].label}
Texture: ${textures[state.texture].label}
Landmark Position: (${Math.round(state.landmarkX)}, ${Math.round(state.landmarkY)})

Scores:
Balance: ${document.querySelector('.score-value:nth-child(2)')?.textContent || 'N/A'}
Readability: ${Array.from(document.querySelectorAll('.score-value')).map(e => e.textContent)[1] || 'N/A'}
Coverage: ${Array.from(document.querySelectorAll('.score-value')).map(e => e.textContent)[2] || 'N/A'}
Clarity: ${Array.from(document.querySelectorAll('.score-value')).map(e => e.textContent)[3] || 'N/A'}

Design Notes:
This retro travel poster combines classic design principles with modern composition techniques.`;
  
  const blob = new Blob([brief], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${destinations[state.destination].name.toLowerCase()}_poster_brief.txt`;
  a.click();
}

// Initialize UI buttons
Object.entries(destinations).forEach(([key, dest]) => {
  const btn = document.createElement('button');
  btn.className = 'option-btn';
  btn.setAttribute('data-dest', key);
  btn.textContent = dest.name;
  btn.onclick = () => setDest(key);
  document.getElementById('dest-buttons').appendChild(btn);
});

Object.entries(skies).forEach(([key, sky]) => {
  const btn = document.createElement('button');
  btn.className = 'option-btn';
  btn.setAttribute('data-sky', key);
  btn.textContent = sky.label;
  btn.onclick = () => setSky(key);
  document.getElementById('sky-buttons').appendChild(btn);
});

Object.entries(landmarks).forEach(([key, lm]) => {
  const btn = document.createElement('button');
  btn.className = 'option-btn';
  btn.setAttribute('data-landmark', key);
  btn.textContent = lm.icon + ' ' + lm.label;
  btn.onclick = () => setLandmark(key);
  document.getElementById('landmark-buttons').appendChild(btn);
});

Object.entries(badges).forEach(([key, badge]) => {
  const btn = document.createElement('button');
  btn.className = 'option-btn';
  btn.setAttribute('data-badge', key);
  btn.textContent = badge.label;
  btn.onclick = () => setBadge(key);
  document.getElementById('badge-buttons').appendChild(btn);
});

Object.entries(textures).forEach(([key, tex]) => {
  const btn = document.createElement('button');
  btn.className = 'option-btn';
  btn.setAttribute('data-texture', key);
  btn.textContent = tex.label;
  btn.onclick = () => setTexture(key);
  document.getElementById('texture-buttons').appendChild(btn);
});

render();
</script>
</body>
</html>
