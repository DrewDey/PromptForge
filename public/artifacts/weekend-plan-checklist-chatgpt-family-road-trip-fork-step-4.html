<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>Family Road-Trip Readiness Board</title>  <style>    :root{      --bg:#0d1117; --panel:rgba(22,27,34,.88); --panel2:rgba(31,38,48,.88);      --text:#edf2f7; --muted:#9aa7b6; --line:rgba(255,255,255,.11);      --accent:#7dd3fc; --accent2:#a78bfa; --good:#86efac; --warn:#fde68a; --danger:#fca5a5;      --shadow:0 28px 80px rgba(0,0,0,.38); --radius:22px;    }    *{box-sizing:border-box}    html,body{margin:0;min-height:100%;overflow-x:hidden}    body{      font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;      color:var(--text); background:radial-gradient(circle at 8% 8%,rgba(125,211,252,.2),transparent 30%),radial-gradient(circle at 88% 14%,rgba(167,139,250,.22),transparent 34%),radial-gradient(circle at 50% 100%,rgba(52,211,153,.11),transparent 35%),var(--bg);      padding:24px;    }    .app{width:min(1240px,100%);margin:0 auto}    header{display:flex;justify-content:space-between;gap:22px;align-items:flex-end;margin-bottom:20px}    .eyebrow{color:var(--accent);letter-spacing:.16em;text-transform:uppercase;font-size:12px;font-weight:800;margin-bottom:10px}    h1{margin:0;font-size:clamp(32px,5vw,58px);line-height:.96;letter-spacing:-.055em;max-width:760px}    .sub{color:var(--muted);font-size:15px;max-width:430px;line-height:1.5;margin:0}    .shell{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}    .card{background:linear-gradient(180deg,var(--panel),rgba(16,21,30,.82));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(18px);overflow:hidden}    .card-head{padding:20px 20px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}    h2{margin:0;font-size:18px;letter-spacing:-.02em}.hint{color:var(--muted);font-size:13px;line-height:1.4}.body{padding:18px 20px 20px}    textarea,input,select{width:100%;border:1px solid var(--line);border-radius:15px;background:rgba(6,10,16,.62);color:var(--text);font:inherit;outline:none}    textarea{min-height:210px;resize:vertical;padding:15px;line-height:1.45} input,select{padding:12px 13px}    textarea:focus,input:focus,select:focus{border-color:rgba(125,211,252,.65);box-shadow:0 0 0 3px rgba(125,211,252,.12)}    label{display:block;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:14px 0 7px}    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn,.chip{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);color:var(--text);font:inherit;font-weight:800;cursor:pointer;min-height:42px;padding:0 15px}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#071018;border:0}.btn.danger{color:var(--danger)}.btn:hover,.chip:hover{transform:translateY(-1px);background:rgba(255,255,255,.1)}    .chips{display:flex;gap:8px;flex-wrap:wrap}.chip{font-size:13px;min-height:36px}.chip.active{background:rgba(125,211,252,.16);border-color:rgba(125,211,252,.5);color:#dff6ff}    .next-strip{margin-bottom:18px;padding:16px;border-radius:20px;background:linear-gradient(135deg,rgba(125,211,252,.14),rgba(167,139,250,.13));border:1px solid rgba(125,211,252,.22)}    .next-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.next-title{font-weight:900;letter-spacing:-.02em}.meter{color:var(--muted);font-size:13px}    .next-list{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.next-card{border:1px solid var(--line);background:rgba(6,10,16,.42);border-radius:15px;padding:10px;min-height:82px}.next-card small{display:block;color:var(--accent);font-weight:900;margin-bottom:4px}.next-card span{font-size:13px;line-height:1.25;display:block}    .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.lane{background:rgba(14,18,26,.72);border:1px solid var(--line);border-radius:20px;overflow:hidden;min-width:0}.lane-head{padding:14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.035);display:flex;align-items:center;justify-content:space-between;gap:8px}.lane-title{font-weight:950;letter-spacing:-.02em}.count{color:var(--muted);font-size:12px;white-space:nowrap}.items{padding:10px;display:grid;gap:8px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.045)}    .item.done{opacity:.58}.item.done .text{text-decoration:line-through;color:var(--muted)}.item input[type="checkbox"]{width:21px;height:21px;margin:1px 0 0;accent-color:#7dd3fc}.text{line-height:1.28;font-size:14px;word-break:break-word}.tag{font-size:10px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:#071018;border-radius:999px;padding:4px 7px;background:var(--good);white-space:nowrap}.tag.nice{background:var(--warn)}.del{width:28px;height:28px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer}.del:hover{color:var(--danger)}    .addline{display:grid;grid-template-columns:1fr 94px;gap:8px;margin-top:10px}.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px;border:1px dashed var(--line);border-radius:15px}.template{display:none}.status{margin-top:12px;color:var(--muted);font-size:13px;min-height:18px}    .saved{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 12px rgba(134,239,172,.65)}    @media(max-width:980px){body{padding:16px}.shell{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,minmax(0,1fr))}.next-list{grid-template-columns:1fr 1fr}}    @media(max-width:620px){header{display:block}.sub{margin-top:12px}.board{grid-template-columns:1fr}.row,.row3{grid-template-columns:1fr}.next-list{grid-template-columns:1fr}.btn,.chip{width:100%}.btns .btn{flex:1 1 150px}.card-head{align-items:flex-start}.addline{grid-template-columns:1fr}.item{grid-template-columns:auto 1fr auto}.tag{font-size:9px}}    @media print{body{background:#fff;color:#111;padding:0}.card,.lane,.next-strip{box-shadow:none;background:#fff;border-color:#bbb}.controls,.btns,.addline,.del,textarea,input,select{display:none!important}.shell{display:block}.board{grid-template-columns:repeat(2,1fr)}.sub,.hint,.meter,.count{color:#444}.item.done{display:none}}  </style></head><body>  <div class="app">    <header>      <div>        <div class="eyebrow">Road-trip readiness board</div>        <h1>Turn the family plan into lanes, not chaos.</h1>      </div>      <p class="sub">Paste the messy plan, name the travelers, then generate an editable board for people, pets, car prep, documents, and snacks. Everything saves locally in this browser.</p>    </header>    <div class="shell">      <section class="card controls">        <div class="card-head"><h2>Trip input</h2><div class="saved"><span class="dot"></span><span id="saveState">Saved locally</span></div></div>        <div class="body">          <label for="plan">Messy family plan</label>          <textarea id="plan" placeholder="Example: Leave Friday after school for Grandma's. Hotel pool, dog coming, wedding Saturday, toddler needs stroller, rain possible, 6-hour drive, snacks, passports maybe, birthday gift, cooler, car seat, medicines..."></textarea>          <label for="travelers">Travelers</label>          <input id="travelers" placeholder="Alex, Jamie, Sam, Nora" />          <div class="row">            <div><label for="pets">Pets</label><input id="pets" placeholder="Dog, cat, none" /></div>            <div><label for="days">Trip length</label><select id="days"><option>Weekend</option><option>Overnight</option><option>3-4 days</option><option>Weeklong</option></select></div>          </div>          <label>Filters</label>          <div class="chips" id="filters">            <button class="chip active" data-filter="all">All</button>            <button class="chip" data-filter="essential">Essentials</button>            <button class="chip" data-filter="nice">Nice-to-have</button>            <button class="chip" data-filter="done">Done</button>            <button class="chip" data-filter="open">Open</button>          </div>          <div class="btns">            <button class="btn primary" id="generate">Generate board</button>            <button class="btn" id="sample">Sample trip</button>            <button class="btn" id="print">Print</button>            <button class="btn" id="copy">Copy text</button>            <button class="btn danger" id="reset">Reset</button>          </div>          <div class="status" id="status"></div>        </div>      </section>      <main>        <section class="next-strip">          <div class="next-top"><div class="next-title">Next 5 actions</div><div class="meter" id="meter">0 ready</div></div>          <div class="next-list" id="nextList"></div>        </section>        <section class="board" id="board"></section>      </main>    </div>  </div>  <script>    const lanes = [      {id:'travelers', name:'Travelers'}, {id:'pets', name:'Pets'}, {id:'car', name:'Car prep'},      {id:'docs', name:'Documents'}, {id:'food', name:'Food & snacks'}, {id:'misc', name:'Shared extras'}    ];    const defaults = {      travelers:[['Outfits for each day','essential'],['Pajamas and underwear','essential'],['Toiletries and toothbrushes','essential'],['Chargers and headphones','essential'],['Comfort item for kids','nice']],      pets:[['Pet food and bowls','essential'],['Leash, harness, and waste bags','essential'],['Pet medicine or vaccination records','essential'],['Towel or seat cover','nice']],      car:[['Fill gas or charge vehicle','essential'],['Check tire pressure','essential'],['Load car seats or boosters','essential'],['Pack roadside kit','nice'],['Trash bag for car','nice']],      docs:[['Wallet, license, and cards','essential'],['Hotel or host address','essential'],['Insurance cards and medical info','essential'],['Tickets, invitations, or reservation details','essential']],      food:[['Water bottles','essential'],['Easy snacks for the drive','essential'],['Cooler or lunch bag','nice'],['Napkins and wipes','nice']],      misc:[['Gift or card','essential'],['Rain layer or umbrella','nice'],['Small laundry bag','nice']]    };    let state = {plan:'', travelers:'', pets:'', days:'Weekend', filter:'all', items:[]};    const $ = id => document.getElementById(id);    const uid = () => Math.random().toString(36).slice(2,9);    const norm = s => s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();    const compactKey = s => norm(s).replace(/\b(the|a|an|and|for|each|extra|family|personal|small)\b/g,'').replace(/\s+/g,' ').trim();    function add(lane,text,priority='essential'){      const key = compactKey(text);      if(!key || state.items.some(i => compactKey(i.text) === key || key.includes(compactKey(i.text)) || compactKey(i.text).includes(key))) return;      state.items.push({id:uid(), lane, text, priority, done:false});    }    function parseNames(str){ return str.split(/[,&\n]+/).map(s=>s.trim()).filter(Boolean).slice(0,8); }    function generate(){      const text = `${$('plan').value} ${$('travelers').value} ${$('pets').value} ${$('days').value}`.toLowerCase();      state.plan=$('plan').value; state.travelers=$('travelers').value; state.pets=$('pets').value; state.days=$('days').value; state.items=[];      lanes.forEach(l => defaults[l.id].forEach(d => add(l.id,d[0],d[1])));      const names = parseNames(state.travelers);      names.forEach(n => { add('travelers', `${n}: clothes packed`, 'essential'); add('travelers', `${n}: personal medicine or must-have item`, 'essential'); });      if(/baby|toddler|infant|kid|child|children|stroller|diaper/.test(text)){ add('travelers','Diapers, wipes, and backup outfit','essential'); add('travelers','Stroller or carrier','essential'); add('travelers','Kid entertainment bag','nice'); }      if(/pool|swim|beach|lake|water/.test(text)){ add('travelers','Swimsuits and sandals','essential'); add('misc','Wet bag or plastic bag for suits','nice'); }      if(/wedding|formal|funeral|church|nice dinner|rehearsal/.test(text)){ add('travelers','Formal outfit and shoes','essential'); add('misc','Lint roller or wrinkle spray','nice'); }      if(/rain|storm|wet|umbrella/.test(text)){ add('misc','Rain jackets or umbrellas','essential'); }      if(/cold|snow|winter|ski/.test(text)){ add('travelers','Warm layers, hats, and gloves','essential'); add('car','Ice scraper or snow brush','essential'); }      if(/hotel|reservation|airbnb|vrbo|check.?in/.test(text)){ add('docs','Lodging confirmation and check-in instructions','essential'); }      if(/passport|international|border|canada|mexico/.test(text)){ add('docs','Passports or birth certificates','essential'); }      if(/camp|cabin|hike|trail|outdoor/.test(text)){ add('misc','Bug spray and sunscreen','essential'); add('food','Picnic or trail snacks','nice'); }      if(/medicine|meds|prescription|allergy|inhaler/.test(text)){ add('docs','Medication list and emergency contacts','essential'); add('travelers','Daily medicines packed separately','essential'); }      if(/dog|cat|pet|puppy|kennel|crate/.test(text)){ add('pets','Crate, bed, or travel blanket','essential'); add('pets','Confirm pet-friendly lodging or sitter','essential'); }      if(/gift|birthday|card|present|party|shower|graduation/.test(text)){ add('misc','Gift or card','essential'); }      if(/cooler|drinks|snacks|lunch|sandwich/.test(text)){ add('food','Cooler packed with ice packs','essential'); add('food','Meal plan for first drive day','nice'); }      if(/long drive|road trip|drive|traffic|hours|miles/.test(text)){ add('car','Download maps or route backup','essential'); add('car','Set playlist or audiobook','nice'); add('food','Extra water for the car','essential'); }      save(); render(); flash('Board generated and deduped.');    }    function visibleItems(){      return state.items.filter(i => state.filter==='all' || (state.filter==='done'?i.done:state.filter==='open'?!i.done:i.priority===state.filter));    }    function render(){      $('plan').value=state.plan||''; $('travelers').value=state.travelers||''; $('pets').value=state.pets||''; $('days').value=state.days||'Weekend';      document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active', b.dataset.filter===state.filter));      const board=$('board'); board.innerHTML=''; const visible=visibleItems();      lanes.forEach(l=>{        const laneItems = visible.filter(i=>i.lane===l.id);        const allLane = state.items.filter(i=>i.lane===l.id); const done = allLane.filter(i=>i.done).length;        const el=document.createElement('section'); el.className='lane';        el.innerHTML=`<div class="lane-head"><div class="lane-title">${l.name}</div><div class="count">${done}/${allLane.length} done</div></div><div class="items" id="items-${l.id}"></div><div class="body" style="padding-top:0"><div class="addline"><input aria-label="Add item to ${l.name}" id="add-${l.id}" placeholder="Add item..."/><button class="btn" data-add="${l.id}">Add</button></div></div>`;        board.appendChild(el); const wrap=$(`items-${l.id}`);        if(!laneItems.length) wrap.innerHTML='<div class="empty">No items in this filter.</div>';        laneItems.forEach(i=>{          const row=document.createElement('div'); row.className='item'+(i.done?' done':'');          row.innerHTML=`<input type="checkbox" ${i.done?'checked':''} data-check="${i.id}" aria-label="Mark done"><div class="text" contenteditable="true" data-edit="${i.id}" spellcheck="true">${escapeHtml(i.text)}</div><div><div class="tag ${i.priority==='nice'?'nice':''}" data-priority="${i.id}" title="Click to toggle priority">${i.priority==='nice'?'Nice':'Essential'}</div><button class="del" data-del="${i.id}" aria-label="Delete item">×</button></div>`;          wrap.appendChild(row);        });      });      renderNext(); bindDynamic(); save();    }    function renderNext(){      const open = state.items.filter(i=>!i.done).sort((a,b)=>(a.priority==='nice')-(b.priority==='nice')).slice(0,5);      $('nextList').innerHTML = open.length ? open.map((i,idx)=>`<div class="next-card"><small>${idx+1}. ${laneName(i.lane)}</small><span>${escapeHtml(i.text)}</span></div>`).join('') : '<div class="next-card"><small>Done</small><span>Everything on the board is checked off.</span></div>';      const done=state.items.filter(i=>i.done).length; $('meter').textContent = `${done}/${state.items.length} ready`;    }    function bindDynamic(){      document.querySelectorAll('[data-check]').forEach(el=>el.onchange=e=>{ const i=find(e.target.dataset.check); if(i){i.done=e.target.checked; render();}});      document.querySelectorAll('[data-del]').forEach(el=>el.onclick=e=>{ state.items=state.items.filter(i=>i.id!==e.target.dataset.del); render();});      document.querySelectorAll('[data-priority]').forEach(el=>el.onclick=e=>{ const i=find(e.target.dataset.priority); if(i){i.priority=i.priority==='nice'?'essential':'nice'; render();}});      document.querySelectorAll('[data-edit]').forEach(el=>el.onblur=e=>{ const i=find(e.target.dataset.edit); if(i){i.text=e.target.textContent.trim()||i.text; render();}});      document.querySelectorAll('[data-add]').forEach(el=>el.onclick=e=>{ const lane=e.target.dataset.add, input=$(`add-${lane}`); if(input.value.trim()){ add(lane,input.value.trim(),'essential'); input.value=''; render(); }});      document.querySelectorAll('.addline input').forEach(input=>input.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); input.nextElementSibling.click(); }});    }    function laneName(id){ return (lanes.find(l=>l.id===id)||{}).name||id; } function find(id){return state.items.find(i=>i.id===id)}    function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}    function save(){ localStorage.setItem('roadTripBoard.v1', JSON.stringify(state)); $('saveState').textContent='Saved locally'; }    function load(){ try{ const raw=localStorage.getItem('roadTripBoard.v1'); if(raw) state=JSON.parse(raw); }catch(e){} if(!state.items||!state.items.length){ state.items=[]; lanes.forEach(l=>defaults[l.id].forEach(d=>add(l.id,d[0],d[1]))); } render(); }    function flash(msg){ $('status').textContent=msg; clearTimeout(window._st); window._st=setTimeout(()=>$('status').textContent='',2600); }    function copyText(){      const txt = lanes.map(l=>`${l.name}\n`+state.items.filter(i=>i.lane===l.id).map(i=>`[${i.done?'x':' '}] ${i.priority==='nice'?'Nice':'Essential'} - ${i.text}`).join('\n')).join('\n\n');      navigator.clipboard.writeText(txt).then(()=>flash('Copied board text.')).catch(()=>flash('Copy failed. Select and print instead.'));    }    $('generate').onclick=generate; $('print').onclick=()=>window.print(); $('copy').onclick=copyText;    $('reset').onclick=()=>{ if(confirm('Clear this board and start fresh?')){ localStorage.removeItem('roadTripBoard.v1'); state={plan:'',travelers:'',pets:'',days:'Weekend',filter:'all',items:[]}; load(); flash('Board reset.'); }};    $('sample').onclick=()=>{ $('plan').value='Leave Friday after school for a 6-hour drive to Grandma\'s. Wedding Saturday, hotel pool, dog coming, toddler needs stroller, rain possible, birthday gift and card, cooler snacks, medicines, car seats, and printed hotel check-in.'; $('travelers').value='Drew, Taylor, Max, Ellie'; $('pets').value='Dog'; $('days').value='Weekend'; generate(); };    $('filters').onclick=e=>{ if(e.target.dataset.filter){ state.filter=e.target.dataset.filter; render(); }};    ['plan','travelers','pets','days'].forEach(id=>$(id).addEventListener('input',()=>{ state[id]=$(id).value; save(); }));    load();  </script></body></html>
