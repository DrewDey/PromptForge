<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekend Road-Trip Readiness Board</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #667085;
      --line: #d7dde5;
      --paper: #ffffff;
      --mist: #f4f7fb;
      --blue: #2563eb;
      --green: #16a34a;
      --amber: #d97706;
      --rose: #e11d48;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--mist);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      border-bottom: 3px solid var(--ink);
      padding-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .summary {
      max-width: 720px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .trip-meta {
      display: grid;
      gap: 8px;
      min-width: 260px;
    }

    .trip-meta input {
      width: 100%;
      border: 2px solid var(--line);
      background: var(--paper);
      padding: 11px 12px;
      color: var(--ink);
      font-weight: 700;
    }

    .next-strip {
      margin: 20px 0;
      border: 2px solid var(--ink);
      background: var(--paper);
      padding: 16px;
    }

    .next-strip h2,
    .lane h2,
    .composer h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
    }

    .next-items {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .next-card {
      border: 1px solid var(--line);
      background: #f8fbff;
      padding: 10px;
      min-height: 70px;
    }

    .next-card strong {
      display: block;
      font-size: 13px;
    }

    .next-card span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 18px;
    }

    .controls button,
    .composer button,
    .task button {
      border: 2px solid var(--ink);
      background: var(--paper);
      padding: 9px 12px;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
    }

    .controls button.active {
      background: var(--ink);
      color: var(--paper);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .lane {
      border: 2px solid var(--line);
      background: var(--paper);
      min-height: 260px;
    }

    .lane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 2px solid var(--line);
      padding: 13px;
    }

    .lane-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .tasks {
      display: grid;
      gap: 9px;
      padding: 12px;
    }

    .task {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      border: 1px solid var(--line);
      background: #fbfcfe;
      padding: 10px;
    }

    .task input {
      margin-top: 3px;
      accent-color: var(--green);
    }

    .task.done {
      opacity: 0.55;
    }

    .task.done .task-title {
      text-decoration: line-through;
    }

    .task-title {
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .task-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .priority-high {
      color: var(--rose);
    }

    .priority-medium {
      color: var(--amber);
    }

    .priority-low {
      color: var(--green);
    }

    .task button {
      min-width: 34px;
      min-height: 32px;
      padding: 2px 8px;
    }

    .composer {
      margin-top: 18px;
      border: 2px solid var(--line);
      background: var(--paper);
      padding: 16px;
    }

    .composer-grid {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(130px, 1fr) minmax(130px, 1fr) auto;
      gap: 10px;
      margin-top: 12px;
    }

    .composer input,
    .composer select {
      min-height: 42px;
      border: 2px solid var(--line);
      padding: 8px 10px;
    }

    .print-summary {
      margin-top: 18px;
      border: 2px dashed var(--line);
      background: var(--paper);
      padding: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 860px) {
      header {
        grid-template-columns: 1fr;
      }

      .next-items,
      .board,
      .composer-grid {
        grid-template-columns: 1fr;
      }

      .trip-meta {
        min-width: 0;
      }
    }

    @media print {
      body {
        background: white;
      }

      .controls,
      .composer,
      .task button {
        display: none;
      }

      .shell {
        padding: 10px;
      }

      .board {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <p class="eyebrow">Forked from response package 03</p>
        <h1>Weekend road-trip readiness board</h1>
        <p class="summary">A practical fork of the checklist path: keep the next-action focus, but split the plan into people, pets, car prep, and timing lanes.</p>
      </div>
      <div class="trip-meta">
        <input id="tripName" value="Nashville wedding weekend" aria-label="Trip name">
        <input id="leaveTime" value="Leave Friday, 5:30 PM" aria-label="Leave time">
      </div>
    </header>

    <section class="next-strip" aria-live="polite">
      <h2>Next actions</h2>
      <div class="next-items" id="nextItems"></div>
    </section>

    <nav class="controls" aria-label="Checklist filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="high">High priority</button>
      <button data-filter="open">Open</button>
      <button data-filter="done">Done</button>
      <button type="button" id="printBtn">Print</button>
    </nav>

    <main class="board" id="board"></main>

    <section class="composer">
      <h2>Add trip item</h2>
      <div class="composer-grid">
        <input id="newTask" placeholder="Pack rain jackets" aria-label="New task">
        <select id="newLane" aria-label="Lane"></select>
        <select id="newPriority" aria-label="Priority">
          <option value="high">High priority</option>
          <option value="medium">Medium priority</option>
          <option value="low">Low priority</option>
        </select>
        <button id="addBtn" type="button">Add</button>
      </div>
    </section>

    <section class="print-summary" id="summary"></section>
  </div>

  <script>
    const lanes = [
      'People',
      'Pets',
      'Car prep',
      'Before leaving',
      'On the road',
      'Arrival'
    ];

    let activeFilter = 'all';
    let tasks = [
      { id: 1, lane: 'People', title: 'Black suit, dress shoes, belt, and backup shirt', priority: 'high', done: false },
      { id: 2, lane: 'People', title: 'Phone chargers, medication, and wedding card', priority: 'high', done: false },
      { id: 3, lane: 'Pets', title: 'Fill dog food bin and leave feeding note', priority: 'high', done: false },
      { id: 4, lane: 'Pets', title: 'Pack leash, bowls, and towel for hotel stop', priority: 'medium', done: false },
      { id: 5, lane: 'Car prep', title: 'Gas, tire pressure, windshield fluid, and parking cash', priority: 'high', done: false },
      { id: 6, lane: 'Before leaving', title: 'Set thermostat, lock windows, take trash out', priority: 'medium', done: false },
      { id: 7, lane: 'On the road', title: 'Text arrival ETA after first rest stop', priority: 'low', done: false },
      { id: 8, lane: 'Arrival', title: 'Hang formal outfit and put chargers by bed', priority: 'medium', done: false }
    ];

    const board = document.getElementById('board');
    const nextItems = document.getElementById('nextItems');
    const summary = document.getElementById('summary');
    const newLane = document.getElementById('newLane');
    const newPriority = document.getElementById('newPriority');
    const newTask = document.getElementById('newTask');

    lanes.forEach((lane) => {
      const option = document.createElement('option');
      option.value = lane;
      option.textContent = lane;
      newLane.appendChild(option);
    });

    function priorityLabel(priority) {
      if (priority === 'high') return 'High priority';
      if (priority === 'medium') return 'Medium priority';
      return 'Low priority';
    }

    function visibleTasksForLane(lane) {
      return tasks.filter((task) => {
        if (task.lane !== lane) return false;
        if (activeFilter === 'all') return true;
        if (activeFilter === 'high') return task.priority === 'high';
        if (activeFilter === 'open') return !task.done;
        if (activeFilter === 'done') return task.done;
        return true;
      });
    }

    function renderNextActions() {
      const open = tasks
        .filter((task) => !task.done)
        .sort((a, b) => {
          const rank = { high: 0, medium: 1, low: 2 };
          return rank[a.priority] - rank[b.priority] || lanes.indexOf(a.lane) - lanes.indexOf(b.lane);
        })
        .slice(0, 3);

      nextItems.textContent = '';

      if (open.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'next-card';
        empty.textContent = 'Everything is checked off.';
        nextItems.appendChild(empty);
        return;
      }

      open.forEach((task) => {
        const card = document.createElement('div');
        card.className = 'next-card';

        const title = document.createElement('strong');
        title.textContent = task.title;

        const meta = document.createElement('span');
        meta.textContent = `${task.lane} - ${priorityLabel(task.priority)}`;

        card.appendChild(title);
        card.appendChild(meta);
        nextItems.appendChild(card);
      });
    }

    function renderBoard() {
      board.textContent = '';

      lanes.forEach((lane) => {
        const laneTasks = visibleTasksForLane(lane);
        const section = document.createElement('section');
        section.className = 'lane';

        const head = document.createElement('div');
        head.className = 'lane-head';

        const title = document.createElement('h2');
        title.textContent = lane;

        const count = document.createElement('span');
        count.className = 'lane-count';
        count.textContent = `${laneTasks.filter((task) => !task.done).length} open`;

        head.appendChild(title);
        head.appendChild(count);
        section.appendChild(head);

        const list = document.createElement('div');
        list.className = 'tasks';

        laneTasks.forEach((task) => {
          const row = document.createElement('article');
          row.className = task.done ? 'task done' : 'task';

          const check = document.createElement('input');
          check.type = 'checkbox';
          check.checked = task.done;
          check.setAttribute('aria-label', `Mark ${task.title} done`);
          check.addEventListener('change', () => {
            task.done = check.checked;
            render();
          });

          const copy = document.createElement('div');
          const taskTitle = document.createElement('div');
          taskTitle.className = 'task-title';
          taskTitle.textContent = task.title;
          const meta = document.createElement('div');
          meta.className = `task-meta priority-${task.priority}`;
          meta.textContent = priorityLabel(task.priority);
          copy.appendChild(taskTitle);
          copy.appendChild(meta);

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.textContent = 'X';
          remove.setAttribute('aria-label', `Remove ${task.title}`);
          remove.addEventListener('click', () => {
            tasks = tasks.filter((item) => item.id !== task.id);
            render();
          });

          row.appendChild(check);
          row.appendChild(copy);
          row.appendChild(remove);
          list.appendChild(row);
        });

        if (laneTasks.length === 0) {
          const empty = document.createElement('p');
          empty.style.margin = '0';
          empty.style.color = 'var(--muted)';
          empty.textContent = 'No visible items.';
          list.appendChild(empty);
        }

        section.appendChild(list);
        board.appendChild(section);
      });
    }

    function renderSummary() {
      const open = tasks.filter((task) => !task.done).length;
      const done = tasks.length - open;
      summary.textContent = `${document.getElementById('tripName').value} - ${document.getElementById('leaveTime').value}. ${done} done, ${open} open.`;
    }

    function render() {
      renderNextActions();
      renderBoard();
      renderSummary();
    }

    document.querySelectorAll('[data-filter]').forEach((button) => {
      button.addEventListener('click', () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll('[data-filter]').forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        render();
      });
    });

    document.getElementById('addBtn').addEventListener('click', () => {
      const title = newTask.value.trim();
      if (!title) return;
      tasks.push({
        id: Date.now(),
        lane: newLane.value,
        title,
        priority: newPriority.value,
        done: false
      });
      newTask.value = '';
      render();
    });

    document.getElementById('printBtn').addEventListener('click', () => window.print());
    document.getElementById('tripName').addEventListener('input', renderSummary);
    document.getElementById('leaveTime').addEventListener('input', renderSummary);

    render();
  </script>
</body>
</html>
