<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Video Planner</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --accent: #ff4444;
            --border: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 10px; font-size: 14px; }
        .container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        
        .section { background: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
        h3 { font-size: 14px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; }
        
        input, textarea, select { width: 100%; background: #2a2a2a; color: #fff; border: 1px solid var(--border); padding: 8px; border-radius: 4px; font-size: 14px; }
        textarea { resize: vertical; min-height: 50px; }
        
        .toolbar { display: flex; gap: 8px; }
        button { flex: 1; background: #333; color: #fff; border: none; padding: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button.action { background: var(--accent); }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: center; }
        .stat-box { background: #252525; padding: 8px; border-radius: 4px; }
        .stat-val { font-size: 18px; font-weight: bold; color: var(--accent); }
        .alert { color: #ffcc00; font-size: 12px; margin-top: 4px; display: none; }
        
        .beat-list { display: flex; flex-direction: column; gap: 8px; }
        .beat-card { background: #252525; border-left: 4px solid #888; padding: 8px; border-radius: 4px; }
        
        .beat-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
        .beat-type { width: 85px; font-size: 12px; font-weight: bold; }
        .beat-dur { width: 65px; text-align: center; }
        .beat-del { background: #442222; max-width: 32px; }
        
        .beat-card[data-type="Hook"] { border-left-color: #ff4444; }
        .beat-card[data-type="Proof"] { border-left-color: #33b5e5; }
        .beat-card[data-type="Demo"] { border-left-color: #00C851; }
        .beat-card[data-type="B-Roll"] { border-left-color: #aa66cc; }
        .beat-card[data-type="CTA"] { border-left-color: #ffbb33; }
        
        .nav-btns { display: flex; gap: 4px; margin-top: 4px; }
        .nav-btns button { padding: 4px 6px; font-size: 11px; background: #444; }
    </style>
</head>
<body>

<div class="container">
    <div class="section">
        <h3>Concept</h3>
        <input type="text" id="videoIdea" placeholder="Core Video Idea / Hook Title">
    </div>

    <div class="section">
        <h3>Budget & Pacing</h3>
        <div class="stats-grid">
            <div class="stat-box">
                <div>Total Duration</div>
                <div id="totalTime" class="stat-val">0s</div>
            </div>
            <div class="stat-box">
                <div>Beats Count</div>
                <div id="beatCount" class="stat-val">0</div>
            </div>
        </div>
        <div id="pacingAlert" class="alert">⚠️ Warning: Single beat duration exceeds 90s (Pacing Risk)</div>
    </div>

    <div class="section">
        <div class="toolbar">
            <button id="addBtn">+ Add Beat</button>
            <button id="loadBtn">Load Sample</button>
            <button class="action" id="copyBtn">Copy Output</button>
        </div>
    </div>

    <div class="section">
        <h3>Scene Beats</h3>
        <div id="beatList" class="beat-list"></div>
    </div>

    <div class="section">
        <h3>Risk & Retention Notes</h3>
        <textarea id="riskNotes" placeholder="Flag execution hurdles, drop-off risks, or script notes..."></textarea>
    </div>
</div>

<script>
    const beatList = document.getElementById("beatList");
    const types = ["Hook", "Proof", "Demo", "B-Roll", "CTA"];
    
    function createBeatElement(type = "Hook", duration = 30, text = "") {
        const card = document.createElement("div");
        card.className = "beat-card";
        card.setAttribute("data-type", type);

        const row = document.createElement("div");
        row.className = "beat-row";

        const select = document.createElement("select");
        select.className = "beat-type";
        types.forEach(t => {
            const opt = document.createElement("option");
            opt.value = t;
            opt.textContent = t;
            if (t === type) opt.selected = true;
            select.appendChild(opt);
        });
        select.addEventListener("change", (e) => {
            card.setAttribute("data-type", e.target.value);
        });

        const input = document.createElement("input");
        input.type = "number";
        input.className = "beat-dur";
        input.value = duration;
        input.placeholder = "Sec";
        input.addEventListener("input", calculateStats);

        const delBtn = document.createElement("button");
        delBtn.className = "beat-del";
        delBtn.textContent = "X";
        delBtn.addEventListener("click", () => {
            card.remove();
            calculateStats();
        });

        row.appendChild(select);
        row.appendChild(input);
        row.appendChild(delBtn);

        const textarea = document.createElement("textarea");
        textarea.className = "beat-text";
        textarea.placeholder = "What happens in this scene?";
        textarea.value = text;

        const navRow = document.createElement("div");
        navRow.className = "nav-btns";

        const upBtn = document.createElement("button");
        upBtn.textContent = "▲ Up";
        upBtn.addEventListener("click", () => {
            const prev = card.previousElementSibling;
            if (prev) card.parentNode.insertBefore(card, prev);
        });

        const downBtn = document.createElement("button");
        downBtn.textContent = "▼ Down";
        downBtn.addEventListener("click", () => {
            const next = card.nextElementSibling;
            if (next) card.parentNode.insertBefore(next, card);
        });

        navRow.appendChild(upBtn);
        navRow.appendChild(downBtn);

        card.appendChild(row);
        card.appendChild(textarea);
        card.appendChild(navRow);

        return card;
    }

    function calculateStats() {
        const cards = document.querySelectorAll(".beat-card");
        let totalSeconds = 0;
        let pacingRisk = false;

        cards.forEach(card => {
            const durInput = card.querySelector(".beat-dur");
            const dur = parseInt(durInput.value) || 0;
            totalSeconds += dur;
            if (dur > 90) pacingRisk = true;
        });

        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        
        document.getElementById("totalTime").textContent = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
        document.getElementById("beatCount").textContent = cards.length;
        document.getElementById("pacingAlert").style.display = pacingRisk ? "block" : "none";
    }

    document.getElementById("addBtn").addEventListener("click", () => {
        beatList.appendChild(createBeatElement());
        calculateStats();
    });

    document.getElementById("loadBtn").addEventListener("click", () => {
        while (beatList.firstChild) {
            beatList.removeChild(beatList.firstChild);
        }

        document.getElementById("videoIdea").value = "Building a 1000HP engine in 24 hours";
        document.getElementById("riskNotes").value = "High risk of mid-video drop-off during the technical teardown phase. Keep demo snappy.";

        const samples = [
            ["Hook", 15, "Show the completed engine roaring, lay out the 24-hour challenge stakes."],
            ["Proof", 30, "Show the parts boxes piling up and time-lapse clock starting."],
            ["Demo", 60, "Tearing down the stock block; highlight crucial mechanical pain points."],
            ["B-Roll", 45, "Cinematic assembly sequence with heavy soundtrack overlay."],
            ["Demo", 95, "First crank attempt fails. Troubleshooting the starter issue under time pressure."],
            ["B-Roll", 30, "Success montage as time ticks down to final 10 minutes."],
            ["Demo", 40, "Mounting the engine to the dyno frame and completing vital fluid checks."],
            ["B-Roll", 20, "Revs building up, split cuts between the mechanical readouts and exhaust flames."],
            ["CTA", 15, "Dyno test results reveal next week. Sub if you want to see the track run."]
        ];

        samples.forEach(s => {
            beatList.appendChild(createBeatElement(s[0], s[1], s[2]));
        });

        calculateStats();
    });

    document.getElementById("copyBtn").addEventListener("click", () => {
        let output = `VIDEO PLAN: ${document.getElementById("videoIdea").value}\n`;
        output += `Total Estimated Runtime: ${document.getElementById("totalTime").textContent}\n`;
        output += `====================================\n\n`;

        document.querySelectorAll(".beat-card").forEach((card, index) => {
            const type = card.querySelector(".beat-type").value;
            const dur = card.querySelector(".beat-dur").value;
            const text = card.querySelector(".beat-text").value;
            output += `Beat #${index + 1} [${type} - ${dur}s]\n${text}\n\n`;
        });

        output += `====================================\n`;
        output += `RISK & RETENTION NOTES:\n${document.getElementById("riskNotes").value}`;

        navigator.clipboard.writeText(output).then(() => {
            alert("Plan copied to clipboard!");
        });
    });
</script>

</body>
</html>
