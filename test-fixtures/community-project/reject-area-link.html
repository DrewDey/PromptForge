<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Navigating image map</title>
  </head>
  <body>
    <main>
      <h1>Apparently static image map</h1>
      <p>This result contains enough visible content to pass the static reader gate.</p>
      <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" usemap="#project-map" alt="Project map">
      <map name="project-map">
        <area shape="rect" coords="0,0,10,10" href="/privacy" alt="Leave the preview">
      </map>
    </main>
  </body>
</html>
