<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Responsive external image</title>
  </head>
  <body>
    <main>
      <h1>Apparently self-contained responsive image</h1>
      <p>This result contains enough visible content to pass the static reader gate.</p>
      <img
        src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
        srcset="data:image/gif;base64,R0lGODlhAQABAAAAACw= 1x, /private-render 2x"
        alt="Responsive result"
      >
    </main>
  </body>
</html>
