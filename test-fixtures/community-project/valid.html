<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Safe pilot fixture</title>
    <style>body { font-family: system-ui; margin: 2rem; } button { padding: .75rem 1rem; } .inline-image { mask-image: url(#safe-local-fragment); }</style>
  </head>
  <body>
    <h1>Safe pilot fixture</h1>
    <p id="count">Count: 0</p>
    <img class="inline-image" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Inline one-pixel fixture">
    <button id="increment" type="button">Increment</button>
    <script>
      let count = 0;
      document.getElementById('increment').addEventListener('click', () => {
        count += 1;
        document.getElementById('count').textContent = `Count: ${count}`;
      });
    </script>
  </body>
</html>
