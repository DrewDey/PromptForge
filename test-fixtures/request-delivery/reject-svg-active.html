<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Active SVG</title></head>
  <body>
    <svg viewBox="0 0 20 20" aria-label="active">
      <circle cx="10" cy="10" r="5">
        <animate attributeName="r" values="2;8;2" dur="1s" repeatCount="indefinite"></animate>
      </circle>
    </svg>
  </body>
</html>
